async function fetchWikiActivities(dest,type='all',query=''){
  if(!dest)return[];
  const target=query?`${query} ${dest}`:dest;
  try{
    const r=await fetchT(`https://fr.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(target)}&gsrlimit=24&prop=coordinates|extracts|pageprops|pageimages&piprop=thumbnail&pithumbsize=400&exintro=1&explaintext=1&exchars=140&format=json&origin=*`);
    if(!r.ok)return[];
    const j=await r.json();
    if(!j.query||!j.query.pages)return[];
    const pages=Object.values(j.query.pages);
    const results=[];
    for(const p of pages){
      if(!p.coordinates||!p.coordinates[0])continue;
      const title=p.title;
      const desc=p.extract||'';
      const cLow=(title+' '+desc).toLowerCase();
      let detectedCat='v';
      if(/musée|museum|galerie|exposition/.test(cLow))detectedCat='v';
      else if(/parc|jardin|nature|cascade|mont|plage|lac|forêt|belvédère|vue/.test(cLow))detectedCat='a';
      else if(/restaurant|marché|gastronomie|café|dégustation|cuisine/.test(cLow))detectedCat='f';
      else if(/spectacle|théâtre|opéra|concert|festival|nuit/.test(cLow))detectedCat='n';

      if(type!=='all'){
        if(type==='attraction'&&!/attraction|parc|aquarium|zoo|plage|loisir|roue|tour/.test(cLow))continue;
        if(type==='culture'&&!/monument|château|temple|palais|cathédrale|église|mosquée|musée|pyramide|statue|histoire/.test(cLow))continue;
        if(type==='nature'&&!/parc|jardin|nature|lac|mont|plage|forêt|cascade/.test(cLow))continue;
        if(type==='food'&&detectedCat!=='f')continue;
      }
      const thumb=p.thumbnail?p.thumbnail.source:null;
      results.push({
        id:'wiki-'+p.pageid,
        name:title,
        desc:desc,
        lat:+p.coordinates[0].lat.toFixed(6),
        lng:+p.coordinates[0].lon.toFixed(6),
        cat:detectedCat,
        source:'Guide culturel',
        sourceUrl:`https://fr.wikipedia.org/wiki/${encodeURIComponent(title)}`,
        bookingUrl:null,
        thumb:thumb,
        pageTitle:title
      });
    }
    return results;
  }catch(e){console.error(e);return[]}
}

    filterStr='nwr["tourism"="viewpoint"](around:20000,'+lat+','+lng+');nwr["leisure"="park"](around:20000,'+lat+','+lng+');nwr["natural"~"beach|peak|waterfall"](around:20000,'+lat+','+lng+');';
  }else if(type==='food'){
    filterStr='nwr["amenity"~"restaurant|cafe|food_court"](around:12000,'+lat+','+lng+');';
  }else{
    filterStr='nwr["tourism"~"attraction|theme_park|zoo|aquarium|museum|viewpoint"](around:20000,'+lat+','+lng+');nwr["historic"~"monument|castle|ruins"](around:20000,'+lat+','+lng+');nwr["leisure"~"water_park|park"](around:20000,'+lat+','+lng+');';
  }
  const ql=`[out:json][timeout:15];(${filterStr});out center tags 30;`;
  try{
    const r=await fetchT('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(ql),12000);
    if(!r.ok)return [];
    const j=await r.json();
    if(!j.elements)return [];
    let list=j.elements.map(el=>{
      const t=el.tags||{};
      const name=t.name||t['name:fr']||t['name:en'];
      if(!name)return null;
      const elLat=el.lat||(el.center&&el.center.lat);
      const elLng=el.lon||(el.center&&el.center.lon);
      if(!elLat||!elLng)return null;

      let cat='v';
      if(t.amenity==='restaurant'||t.amenity==='cafe')cat='f';
      else if(t.tourism==='theme_park'||t.leisure==='water_park'||t.tourism==='zoo')cat='a';
      else if(t.amenity==='theatre'||t.amenity==='nightclub')cat='n';

      const booking=t['contact:website']||t.website||t['booking:url']||t['tickets:url']||t.url||null;
      const osmUrl=`https://www.openstreetmap.org/${el.type}/${el.id}`;

      let descParts=[];
      if(t.opening_hours)descParts.push('🕒 '+t.opening_hours);
      if(t.description)descParts.push(t.description);
      if(!descParts.length){
        const sub=t.tourism||t.historic||t.leisure||t.amenity||'Lieu à découvrir';
        descParts.push('Activité : '+sub);
      }

      let thumb=t.image||null;
      if(thumb&&thumb.startsWith('http://'))thumb=thumb.replace('http://','https://');

      return {
        id:'osm-'+el.id,
        name:name,
        desc:descParts.join(' · '),
        lat:+elLat.toFixed(6),
        lng:+elLng.toFixed(6),
        cat:cat,
        source:'Guide sorties & loisirs',
        sourceUrl:booking||osmUrl,
        bookingUrl:booking,
        thumb:thumb,
        pageTitle:t.wikipedia?t.wikipedia.replace(/^[a-z]+:/i,''):name
      };
    }).filter(Boolean);

    if(query){
      const qNorm=query.toLowerCase().trim();
      list=list.filter(item=>item.name.toLowerCase().includes(qNorm)||item.desc.toLowerCase().includes(qNorm));
    }
    return list.slice(0,25);
  }catch(e){console.error(e);return[]}
}

async function openGallery(pageTitle,initialUrl,caption){
  curGallery=[];curGalIdx=0;
  if(initialUrl)curGallery.push({url:initialUrl,caption:caption||pageTitle});
  updateGalUI();
  $('#gallery-modal').classList.add('on');

  if(pageTitle){
    try{
      const r=await fetchT(`https://fr.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(pageTitle)}&prop=images&imlimit=12&format=json&origin=*`);
      if(r.ok){
        const j=await r.json();
        const pages=Object.values((j.query&&j.query.pages)||{});
        if(pages[0]&&pages[0].images){
          const fileNames=pages[0].images.map(img=>img.title).filter(n=>!/\.(svg|ogg|ogv)$/i.test(n));
          if(fileNames.length){
            const r2=await fetchT(`https://fr.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(fileNames.join('|'))}&prop=imageinfo&iiprop=url&iiurlwidth=800&format=json&origin=*`);
            if(r2.ok){
              const j2=await r2.json();
              const imgs=Object.values((j2.query&&j2.query.pages)||{}).map(p=>p.imageinfo&&p.imageinfo[0]&&(p.imageinfo[0].thumburl||p.imageinfo[0].url)).filter(Boolean);
              imgs.forEach(u=>{
                if(!curGallery.some(g=>g.url===u))curGallery.push({url:u,caption:pageTitle});
              });
              updateGalUI();
            }
          }
        }
      }
    }catch(e){console.error(e)}
  }
}

/* ================= Planning ================= */
function placeInDay(d,a){const last=d.items.filter(i=>i.aid&&get(i.aid)).sort(byT).pop();let t=a.s[0]&&SL[a.s[0]]?SL[a.s[0]][1]:'15:00';
  if(last){const e=tm(last.t)+(get(last.aid).d||60)+30;if(e>tm(t)&&a.s[0]!=='e'&&a.s[0]!=='s')t=mt(e)}
  d.items.push({id:uid(),aid:a.id,t})}
function addToDay(aid){const a=get(aid),d=dayO();if(!a||d.items.some(i=>i.aid===aid))return;mut(()=>placeInDay(d,a))}
const rankOf=a=>({m:0,a:1,s:2,e:3}[a.s[0]]??1);
const routeKm=list=>{let k=0;for(let i=1;i<list.length;i++){const l=leg(get(list[i-1].aid),get(list[i].aid));if(l)k+=l.km}return k};
function optimizeDay(n){
  const d=cal().days[n],acts=d.items.filter(i=>i.aid&&get(i.aid)).sort(byT);if(acts.length<2)return null;const before=routeKm(acts);
  const groups=[[],[],[],[]];acts.forEach(i=>groups[rankOf(get(i.aid))].push(i));
  let anchor=null;const order=[];
  groups.forEach(g=>{const rest=[...g];while(rest.length){let bi=0;if(anchor){let bd=1e9;rest.forEach((x,k)=>{const dd=hav(anchor,get(x.aid)),v=dd==null?500:dd;if(v<bd){bd=v;bi=k}})}const x=rest.splice(bi,1)[0];order.push(x);anchor=get(x.aid)}});
  let end=0;order.forEach(i=>{const a=get(i.aid),st=tm(SL[a.s[0]]?SL[a.s[0]][1]:'15:00'),t=Math.max(end,st);i.t=mt(t);end=t+(a.d||60)+30});
  d.items=[...d.items.filter(i=>!(i.aid&&get(i.aid))),...order];return{before,after:routeKm(order)}}
function autofill(n){
  const d=cal().days[n],u=used(),pool=S.acts.filter(a=>!u.has(a.id));if(!pool.length)return[];
  const ex=d.items.filter(i=>i.aid&&get(i.aid)).sort(byT),cnt={m:0,a:0,s:0,e:0},cap={m:1,a:2,s:1,e:1};ex.forEach(i=>{const r=get(i.aid).s[0];if(cnt[r]!=null)cnt[r]++});
  let anchor=ex.length?get(ex[ex.length-1].aid):null;const chosen=[];
  for(const slot of ['m','a','a','s','e']){if(cnt[slot]>=cap[slot])continue;
    const c=pool.filter(a=>!chosen.includes(a)&&a.s.includes(slot));if(!c.length)continue;
    let best=null,bs=1e9;c.forEach(a=>{const dd=anchor?hav(anchor,a):null;const sc=(anchor?(dd==null?8:dd):0)-(a.fav?1.5:0)-(a.rate||0)*.3;if(sc<bs){bs=sc;best=a}});
    chosen.push(best);cnt[slot]++;anchor=best}
  chosen.forEach(a=>placeInDay(d,a));return chosen}
function swapItem(id,dir){const f=findItem(id);if(!f)return;
  const arr=f.d.items.filter(x=>x.aid||typeof x.note==='string').slice().sort(byT),k=arr.findIndex(x=>x.id===id),j=k+dir;
  if(k<0||j<0||j>=arr.length){toast(dir<0?'Déjà en premier':'Déjà en dernier');return}
  mut(()=>{const times=arr.map(x=>x.t),[m]=arr.splice(k,1);arr.splice(j,0,m);arr.forEach((x,ix)=>{x.t=times[ix]});f.d.items=arr.concat(f.d.items.filter(x=>!arr.includes(x)))})}
function moveItem(id,to){const f=findItem(id);if(!f||to===f.i)return;const tgt=cal().days[to];if(!tgt)return;
  if(f.it.aid&&tgt.items.some(x=>x.aid===f.it.aid)){toast('Déjà prévu ce jour-là');return}
  mut(()=>{f.d.items=f.d.items.filter(x=>x.id!==id);tgt.items.push(f.it)});close();toast('Déplacé vers '+dl(to))}
function dirURL(i){const pts=dayEntries(i).filter(e=>e.k==='act'&&e.a.lat!=null).map(e=>e.a.lat+','+e.a.lng);if(pts.length<2)return'';
  const use=pts.slice(0,11),dist=routeKm(dayEntries(i).filter(e=>e.k==='act'&&e.a.lat!=null).map(e=>({aid:e.a.id})));
  return'https://www.google.com/maps/dir/?api=1&origin='+use[0]+'&destination='+use[use.length-1]+(use.length>2?'&waypoints='+use.slice(1,-1).join('|'):'')+'&travelmode='+(dist<=3?'walking':'driving')}
function itemSheet(id){const f=findItem(id);if(!f)return;const it=f.it,a=it.aid?get(it.aid):null;
  const mv=cal().days.map((_,i)=>i===f.i?'':`<button class="chip" data-mvto="${id}|${i}">${esc(dl(i))}</button>`).join('');
  sheet(`<h2 style="font-size:20px;margin-top:0">${a?esc(a.n):'📝 Note'}</h2>${a?'':`<textarea id="itx" rows="4" placeholder="Note du jour">${esc(it.note)}</textarea>`}
  <label class="lb">Heure prévue</label><input id="itt" type="time" style="width:100%;margin:4px 0 10px;padding:13px" value="${it.t}">
  <div class="row wrap"><button class="btn" data-saveitem="${id}">Enregistrer</button>${a?`<button class="btn s" data-open="${a.id}">Consulter la fiche</button>`:''}<button class="btn r" data-rm="${id}">Retirer du jour</button></div>
  <h3>Déplacer vers une autre journée</h3><div class="row wrap">${mv||'<span class="empty">Une seule journée configurée.</span>'}</div>`)}
function renderPlan(){const c=cal();
  $('#plan').innerHTML=`<h2>Planning</h2><div class="row" style="padding:0 0 10px">${S.cals.map(x=>`<button class="chip ${x.id===c.id?'on':''}" data-cal="${x.id}">${esc(x.name)}</button>`).join('')}<button class="chip" data-newcal>＋ Nouveau programme</button></div>
  <div class="row" style="padding:0 0 4px"><button class="btn s sm" data-ren>Renommer</button><button class="btn s sm" data-dup>Dupliquer</button><button class="btn s sm" data-delcal>Supprimer</button></div>`+
  c.days.map((d,i)=>{const es=dayEntries(i),s=dayStats(i),sum=[];if(s.n)sum.push(s.n+' étape'+(s.n>1?'s':''));if(s.km)sum.push('≈ '+fmtKm(s.km));if(s.tr)sum.push('trajets '+fmtMin(s.tr));if(s.vis)sum.push('visites '+fmtMin(s.vis));if(s.spent)sum.push(fm(s.spent));
    const url=dirURL(i);
    return`<div class="dh"><b>${dl(i)}</b><small>${sum.join(' · ')||'Journée libre'}</small></div><input data-hotel="${i}" value="${esc(d.hotel)}" placeholder="🏨 Où logez-vous ce soir ?">`+
    (es.map(e=>{
      if(e.k==='res')return`<div class="card tint"><span>${RT[e.r.k][1]}</span><div class="nm" data-resid="${e.r.id}"><b>${esc(e.r.t)}</b><small>${e.r.time||'Journée'}${e.r.ref?' · Réf. '+esc(e.r.ref):''}</small></div></div>`;
      const mv=`<div class="mv"><button data-mv="${e.it.id}|-1" aria-label="Monter">▲</button><button data-mv="${e.it.id}|1" aria-label="Descendre">▼</button></div>`;
      if(e.k==='note')return`<div class="card"><span>📝</span><input type="time" value="${e.it.t}" data-time="${e.it.id}"><div class="nm" data-item="${e.it.id}"><b style="white-space:pre-wrap">${esc(e.it.note)}</b></div>${mv}<button class="btn s sm" data-item="${e.it.id}">⋯</button></div>`;
      return(e.leg?`<div class="leg">${legTxt(e.leg)}</div>`:'')+`<div class="card"><span class="dot" style="background:${COL[e.a.c]}"></span><input type="time" value="${e.it.t}" data-time="${e.it.id}"><div class="nm" data-open="${e.a.id}"><b>${esc(e.a.n)}</b><small>${CT[e.a.c]}${e.a.d?' · '+fmtMin(e.a.d):''}${e.a.rate?' · '+'★'.repeat(e.a.rate):''}</small></div>${mv}<button class="btn s sm" data-item="${e.it.id}">⋯</button></div>`}).join('')||'<div class="empty">Aucune visite prévue — ajoutez-en depuis la carte ou l’onglet Explorer.</div>')+
    `<div class="row" style="padding:4px 0"><button class="btn s sm" data-day="${i}" data-go>🗺 Sur la carte</button><button class="btn s sm" data-addnote="${i}">＋ Note</button><button class="btn s sm" data-autofill="${i}">✨ Suggérer ma journée</button><button class="btn s sm" data-optim="${i}">⇄ Optimiser le trajet</button>${url?`<a class="btn s sm" target="_blank" rel="noopener" href="${esc(url)}">🧭 Itinéraire complet</a>`:''}</div>`}).join('')}

async function saveTrip(id){

  const n=Math.round((b-a)/864e5)+1;if(n<1)return toast('La date de départ doit être après l’arrivée');if(n>MAXD)return toast('Maximum '+MAXD+' jours');
  const start=toISO(a);
  if(id){const t=DB.trips.find(x=>x.id===id);if(!t)return;
    const lost=n<t.n?t.cals.reduce((s,c)=>s+c.days.slice(n).reduce((x,d)=>x+d.items.length,0),0):0;
    if(lost&&!confirm(lost+' élément(s) des derniers jours seront supprimés. Continuer ?'))return;

    lastChosenCoords=null;close();bars();centerMap();toast('✓ Voyage mis à jour');return}
  toast('Préparation de votre voyage…');const t=mkTrip({name,flag,dest,start,n,money:money.slice(0,6)});
  if(lastChosenCoords){t.center=lastChosenCoords;t.zoom=11;lastChosenCoords=null}
  else{try{const r=await geocode(dest,1,false);if(r[0]){t.center=[r[0].lat,r[0].lng];t.zoom=11}else toast('Destination enregistrée')}catch(e){} }
  DB.trips.push(t);close();setTrip(t.id);toast('✓ Voyage prêt')}

function download(name,obj){const u=URL.createObjectURL(new Blob([JSON.stringify(obj,null,1)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}

  r.onload=()=>{try{const j=JSON.parse(r.result);let trips=[];
    if(j&&Array.isArray(j.trips))trips=j.trips.map(norm).filter(Boolean);

const STOP=new Set('ajoute ajouter rajoute mets mettre met place placer retire retirer supprime supprimer enleve enlever pour dans sur jour journee des les une propose proposer suggere idee idees autour pres proche cote quoi faire infos info prix horaires organise organiser optimise optimiser resume planning programme avec moi'.split(' '));

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeGallery();return}
  if(e.key==='ArrowLeft'&&$('#gallery-modal').classList.contains('on')){
    if(curGallery.length){curGalIdx=(curGalIdx-1+curGallery.length)%curGallery.length;updateGalUI()}return;
  }
  if(e.key==='ArrowRight'&&$('#gallery-modal').classList.contains('on')){
    if(curGallery.length){curGalIdx=(curGalIdx+1)%curGallery.length;updateGalUI()}return;
  }
  if(e.key!=='Enter')return;
  if(e.target.id==='aiq'){e.preventDefault();aiSend(e.target.value)}
  else if(e.target.id==='discq'){e.preventDefault();loadDiscover(true,e.target.value)}
  else if(e.target.dataset&&e.target.dataset.li){e.preventDefault();const b=document.querySelector(`[data-addli="${e.target.dataset.li}"]`);if(b)b.click()}
  else if(e.target.id==='pn'){e.preventDefault();const b=$('[data-addperson]');if(b)b.click()}
  else if(e.target.id==='sq'){e.preventDefault();clearTimeout(sqT);runSearch()}});

document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
  if(d.time&&S){mut(()=>cal().days.forEach(x=>x.items.forEach(i=>{if(i.id===d.time&&t.value)i.t=t.value})))}
  else if(d.hotel!==undefined&&S){mut(()=>{cal().days[+d.hotel].hotel=t.value})}
  else if('imp' in d&&t.files[0]){doImport(t.files[0]);t.value=''}});

let rt;
document.addEventListener('input',e=>{const id=e.target.id;
  if(id==='ema'){clearTimeout(rt);const v=e.target.value.trim();if(/^https?:\/\//i.test(v)||parseGPS(v))rt=setTimeout(doResolve,450)}
  else if(id==='sq'){clearTimeout(sqT);sqT=setTimeout(runSearch,650)}});

window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});

/* ================= Démarrage ================= */
const boot=loadDB();DB=boot.db;S=curTrip();AIM=aiWelcome();applyTheme();
try{localStorage.setItem(K+'_t','1');localStorage.removeItem(K+'_t')}catch(e){setTimeout(()=>toast('⚠ Pensez à exporter régulièrement votre sauvegarde'),800)}
initMap();show();
if(!S)setTimeout(tripForm,300);
window.__tp={get DB(){return DB},get S(){return S},parseGPS,fromHtml,nameFromUrl,norm,resolveLink,budgetData,leg,tripText,optimizeDay,dayEntries,get themePref(){return themePref}};
})();
</script></body></html>
