/* Nav défilante + boutons globaux fixes */
#nav{gap:4px}

function norm(t){
  if(!t||typeof t!=='object')return null;
  t.id=t.id||uid();t.name=String(t.name||'Voyage');t.flag=t.flag||'🌍';t.dest=t.dest||t.name;

  t.acts=Array.isArray(t.acts)?t.acts.filter(a=>a&&typeof a==='object'):[];t.notes=Array.isArray(t.notes)?t.notes.filter(n=>n&&typeof n==='object'):[];
  t.cals=Array.isArray(t.cals)?t.cals.filter(c=>c&&typeof c==='object'):[];
  let n=Math.round(+t.n);if(!(n>=1))n=Math.max(1,...t.cals.map(c=>Array.isArray(c.days)?c.days.length:0));t.n=Math.min(MAXD,n);
  if(!(Array.isArray(t.center)&&t.center.length===2&&t.center.every(Number.isFinite)))t.center=null;t.zoom=+t.zoom||11;
  t.money=String(t.money||'€').slice(0,6);t.budget=fin(t.budget)&&+t.budget>0?+t.budget:null;
  t.people=(Array.isArray(t.people)?t.people:[]).filter(p=>p&&String(p.name||'').trim()).map(p=>({id:p.id||uid(),name:String(p.name).trim().slice(0,30)}));
  t.exp=(Array.isArray(t.exp)?t.exp:[]).filter(x=>x&&fin(x.amt)).map(x=>({id:x.id||uid(),t:String(x.t||'Dépense'),amt:+x.amt,cat:EXC[x.cat]?x.cat:'o',day:Number.isInteger(x.day)&&x.day>=0&&x.day<t.n?x.day:null,by:t.people.some(p=>p.id===x.by)?x.by:null}));
  t.res=(Array.isArray(t.res)?t.res:[]).filter(r=>r&&typeof r==='object').map(r=>({id:r.id||uid(),k:RT[r.k]?r.k:'o',t:String(r.t||'Réservation'),date:pISO(r.date)?r.date:'',time:/^\d\d:\d\d$/.test(r.time||'')?r.time:'',ref:String(r.ref||''),url:String(r.url||''),note:String(r.note||'')}));
  t.lists=(Array.isArray(t.lists)?t.lists:[]).filter(l=>l&&typeof l==='object').map(l=>({id:l.id||uid(),name:String(l.name||'Liste'),items:(Array.isArray(l.items)?l.items:[]).filter(i=>i&&typeof i==='object').map(i=>({id:i.id||uid(),t:String(i.t||''),done:!!i.done}))}));
  t.acts.forEach(a=>{a.id=a.id||uid();a.n=String(a.n||'Lieu');if(!Array.isArray(a.s))a.s=typeof a.s==='string'?a.s.split(''):[];if(!Array.isArray(a.tags))a.tags=[];if(!CT[a.c])a.c='a';
    if(a.lat!=null&&!(Number.isFinite(+a.lat)&&Number.isFinite(+a.lng))){a.lat=null;a.lng=null}else if(a.lat!=null){a.lat=+a.lat;a.lng=+a.lng}else{a.lat=null;a.lng=null}a.rate=+a.rate||0;a.src=a.src||'Saisie manuelle'});
  t.notes.forEach(x=>{x.id=x.id||uid();x.t=String(x.t||'');x.b=String(x.b||'')});
  if(!t.cals.length)t.cals.push(mkCal('Planning principal',t.n));
  t.cals.forEach(c=>{c.id=c.id||uid();c.name=String(c.name||'Planning');c.days=Array.isArray(c.days)?c.days:[];

async function fetchOtmActivities(center, dest, type='all', query='') {
  let lat = center && center[0], lng = center && center[1];
  if(!lat || !lng){
    try{
      const geo = await geocodeDest(dest);
      if(geo && geo[0]){ lat = geo[0].lat; lng = geo[0].lng; }
    } catch(e){}
  }
  if(!lat || !lng) return [];

  let kinds = 'interesting_places';
  let catMapping = 'v';
  if (type === 'attraction') { kinds = 'amusements,sport'; catMapping = 'a'; }
  else if (type === 'culture') { kinds = 'cultural,historic,architecture'; catMapping = 'v'; }
  else if (type === 'nature') { kinds = 'natural,nature_reserves'; catMapping = 'a'; }
  else if (type === 'food') { kinds = 'foods'; catMapping = 'f'; }

  try {
    const lang = ['fr','en','es','ar'].includes(curLang) ? curLang : 'fr';
    const radiusUrl = `https://api.opentripmap.com/0.1/${lang}/places/radius?radius=15000&lon=${lng}&lat=${lat}&kinds=${kinds}&rate=2&format=json&limit=20&apikey=${OTM_API_KEY}`;
    
    const r = await fetchT(radiusUrl, 8000);
    if (!r.ok) return [];
    let places = await r.json();

    if (query) {
      const qNorm = query.toLowerCase().trim();
      places = places.filter(p => p.name.toLowerCase().includes(qNorm));
    }

    const detailedPlaces = await Promise.all(places.slice(0, 12).map(async (p) => {
      try {
        const res = await fetchT(`https://api.opentripmap.com/0.1/${lang}/places/xid/${p.xid}?apikey=${OTM_API_KEY}`, 5000);
        if (!res.ok) return null;
        const details = await res.json();
        
        return {
          id: 'otm-' + p.xid,
          name: details.name || p.name,
          desc: (details.wikipedia_extracts && details.wikipedia_extracts.text) || (details.info && details.info.descr) || p.kinds.replace(/_/g, ' '),
          lat: details.point.lat,
          lng: details.point.lon,
          cat: catMapping,
          source: 'OpenTripMap',
          sourceUrl: details.wikipedia || details.url || `https://opentripmap.com/en/card/${p.xid}`,
          bookingUrl: details.url || null,
          thumb: details.preview ? details.preview.source : null,
          pageTitle: details.name || p.name
        };
      } catch (e) {
        return null;
      }
    }));
    return detailedPlaces.filter(Boolean);
  } catch (e) {
    console.error("Erreur OpenTripMap:", e);
    return [];
  }
}

async function openGallery(pageTitle,initialUrl,caption){
  curGallery=[];curGalIdx=0;
  if(initialUrl)curGallery.push({url:initialUrl,caption:caption||pageTitle});
  updateGalUI();
  $('#gallery-modal').classList.add('on');

  if(pageTitle){
    try{
      const langSub=['fr','en','es','ar'].includes(curLang)?curLang:'fr';
      const r=await fetchT(`https://${langSub}.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(pageTitle)}&prop=images&imlimit=12&format=json&origin=*`);
      if(r.ok){
        const j=await r.json();
        const pages=Object.values((j.query&&j.query.pages)||{});
        if(pages[0]&&pages[0].images){
          const fileNames=pages[0].images.map(img=>img.title).filter(n=>!/\.(svg|ogg|ogv)$/i.test(n));
          if(fileNames.length){
            const r2=await fetchT(`https://${langSub}.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(fileNames.join('|'))}&prop=imageinfo&iiprop=url&iiurlwidth=800&format=json&origin=*`);
            if(r2.ok){
              const j2=await r2.json();
              const imgs=Object.values((j2.query&&j2.query.pages)||{}).map(p=>p.imageinfo&&p.imageinfo[0]&&(p.imageinfo[0].thumburl||p.imageinfo[0].url)).filter(Boolean);
              imgs.forEach(u=>{
                if(!curGallery.some(g=>g.url===u))curGallery.push({url:u,caption:pageTitle});
              });
              updateGalUI();
            }
          }
        }
      }
    }catch(e){console.error(e)}
  }
}

function placeInDay(d,a){const last=d.items.filter(i=>i.aid&&get(i.aid)).sort(byT).pop();let tVal='15:00';
  if(last){const e=tm(last.t)+(get(last.aid).d||60)+30;if(e>tm(tVal))tVal=mt(e)}
  d.items.push({id:uid(),aid:a.id,t:tVal})}
function addToDay(aid){const a=get(aid),d=dayO();if(!a||d.items.some(i=>i.aid===aid))return;mut(()=>placeInDay(d,a))}
const rankOf=a=>({m:0,a:1,s:2,e:3}[a.s[0]]??1);
const routeKm=list=>{let k=0;for(let i=1;i<list.length;i++){const l=leg(get(list[i-1].aid),get(list[i].aid));if(l)k+=l.km}return k};
function optimizeDay(n){
  const d=cal().days[n],acts=d.items.filter(i=>i.aid&&get(i.aid)).sort(byT);if(acts.length<2)return null;const before=routeKm(acts);
  const groups=[[],[],[],[]];acts.forEach(i=>groups[rankOf(get(i.aid))].push(i));
  let anchor=null;const order=[];
  groups.forEach(g=>{const rest=[...g];while(rest.length){let bi=0;if(anchor){let bd=1e9;rest.forEach((x,k)=>{const dd=hav(anchor,get(x.aid)),v=dd==null?500:dd;if(v<bd){bd=v;bi=k}})}const x=rest.splice(bi,1)[0];order.push(x);anchor=get(x.aid)}});
  let end=0;order.forEach(i=>{const a=get(i.aid),st=tm('15:00'),tVal=Math.max(end,st);i.t=mt(tVal);end=tVal+(a.d||60)+30});
  d.items=[...d.items.filter(i=>!(i.aid&&get(i.aid))),...order];return{before,after:routeKm(order)}}
function autofill(n){
  const d=cal().days[n],u=used(),pool=S.acts.filter(a=>!u.has(a.id));if(!pool.length)return[];
  const ex=d.items.filter(i=>i.aid&&get(i.aid)).sort(byT),cnt={m:0,a:0,s:0,e:0},cap={m:1,a:2,s:1,e:1};ex.forEach(i=>{const r=get(i.aid).s[0];if(cnt[r]!=null)cnt[r]++});
  let anchor=ex.length?get(ex[ex.length-1].aid):null;const chosen=[];
  for(const slot of ['m','a','a','s','e']){if(cnt[slot]>=cap[slot])continue;
    const c=pool.filter(a=>!chosen.includes(a)&&a.s.includes(slot));if(!c.length)continue;
    let best=null,bs=1e9;c.forEach(a=>{const dd=anchor?hav(anchor,a):null;const sc=(anchor?(dd==null?8:dd):0)-(a.fav?1.5:0)-(a.rate||0)*.3;if(sc<bs){bs=sc;best=a}});
    chosen.push(best);cnt[slot]++;anchor=best}
  chosen.forEach(a=>placeInDay(d,a));return chosen}
function swapItem(id,dir){const f=findItem(id);if(!f)return;
  const arr=f.d.items.filter(x=>x.aid||typeof x.note==='string').slice().sort(byT),k=arr.findIndex(x=>x.id===id),j=k+dir;
  if(k<0||j<0||j>=arr.length){toast(dir<0?'Déjà en premier':'Déjà en dernier');return}
  mut(()=>{const times=arr.map(x=>x.t),[m]=arr.splice(k,1);arr.splice(j,0,m);arr.forEach((x,ix)=>{x.t=times[ix]});f.d.items=arr.concat(f.d.items.filter(x=>!arr.includes(x)))})}

function addActivityFromWiki(idx){
  const item=discList[idx];if(!item)return;
  const a=X(item.name,item.cat,'',{
    lat:item.lat,
    lng:item.lng,
    maps:item.bookingUrl||item.sourceUrl||null,
    note:(item.desc||'')+(item.bookingUrl?'\nBilletterie : '+item.bookingUrl:''),
    src:item.source,img:item.thumb||null
  });
  mut(()=>{
    S.acts.push(a);
  });
  renderDiscover();
  toast('✓ Enregistré');
  afterPos();
}

function removeActivityFromDiscover(actId){
  if(!confirm('Retirer cette activité ?'))return;
  mut(()=>{
    S.acts=S.acts.filter(a=>a.id!==actId);
    S.cals.forEach(c=>c.days.forEach(x=>x.items=x.items.filter(i=>i.aid!==actId)));
  });
  renderDiscover();
  toast('Activité retirée');
}

function budgetData(){const total=S.exp.reduce((s,x)=>s+x.amt,0),byCat={},byDay={},paid={};let attr=0;

  if(d.dellist){if(confirm('Supprimer cette liste ?'))mut(()=>{S.lists=S.lists.filter(l=>l.id!==d.dellist)});return}
  if(d.chk){const[l,i]=d.chk.split('|');mut(()=>{const it=(S.lists.find(x=>x.id===l)||{items:[]}).items.find(x=>x.id===i);if(it)it.done=!it.done});return}
  if(d.delli){const[l,i]=d.delli.split('|');mut(()=>{const ls=S.lists.find(x=>x.id===l);if(ls)ls.items=ls.items.filter(x=>x.id!==i)});return}
  if(d.addli){const inp=document.getElementById('li-'+d.addli),v=inp?inp.value.trim():'';if(!v)return;mut(()=>{const ls=S.lists.find(x=>x.id===d.addli);if(ls)ls.items.push({id:uid(),t:v.slice(0,120),done:false})});setTimeout(()=>{const n=document.getElementById('li-'+d.addli);if(n)n.focus()},30);return}
  if('share' in d){shareTrip();return}
  if('print' in d){printTrip();return}
  if(d.mv){const[i,s]=d.mv.split('|');swapItem(i,+s);return}
  if(d.item){itemSheet(d.item);return}
  if(d.mvto){const[i,k]=d.mvto.split('|');moveItem(i,+k);return}
  if(d.saveitem){const f=findItem(d.saveitem);if(!f)return;const tv=$('#itt').value,tx=$('#itx');mut(()=>{if(/^\d\d:\d\d$/.test(tv))f.it.t=tv;if(tx&&typeof f.it.note==='string')f.it.note=tx.value.trim()||f.it.note});close();return}
  if(d.addnote!==undefined){const n=prompt('Texte de votre note ?');if(n&&n.trim()){const i=+d.addnote;mut(()=>{const last=dayEntries(i).pop();cal().days[i].items.push({id:uid(),note:n.trim(),t:last?mt(Math.min(1380,tm(last.t)+30)):'09:00'})})}return}
  if(d.autofill!==undefined){const i=+d.autofill;let ch=[];mut(()=>{ch=autofill(i)});toast(ch.length?'✨ '+ch.length+' visite(s) ajoutée(s)':'Aucun lieu libre à suggérer');return}
  if(d.optim!==undefined){const i=+d.optim;if(cal().days[i].items.filter(x=>x.aid).length<2){toast('Il faut au moins deux visites');return}let r;mut(()=>{r=optimizeDay(i)});const g=r?r.before-r.after:0;toast(g>0.05?'⇄ Trajets réduits d’environ '+fmtKm(g):'⇄ Le trajet est déjà optimal');return}
  if('resolve' in d){doResolve();return}
  if('geo' in d){doGeo();return}
  if(d.geopick!==undefined){pickGeo(d.geopick);return}
  if('bulk' in d){bulkSheet();return}
  if('bulkgo' in d){bulkGo();return}
  if(d.day!==undefined){day=Math.min(+d.day,S.n-1);bars();drawMap();if('go' in d)tab('map');return}
  if(d.send!==undefined){aiSend($('#aiq').value);return}
  if(d.ask){aiSend(d.ask);return}
  if(d.aiadd){const[i,n]=d.aiadd.split('|');addAt(i,+n);toast('Ajouté au '+dl(+n));addMsg({r:'a',h:'✓ « '+esc(get(i).n)+' » a été ajouté au '+dl(+n)});return}
  if(d.aiapply){const m=AIM[+d.aiapply];const c=applyOps(m.ops||[]);m.ops=[];toast(c+' modification(s) enregistrée(s)');renderAI();return}
  if('aisave' in d){try{localStorage.setItem(K+'_ai',$('#aik').value.trim())}catch(e){}toast('Assistant connecté');renderAI();return}
  if('aiclear' in d){try{localStorage.removeItem(K+'_ai');localStorage.removeItem(KL+'_ai')}catch(e){}renderAI();toast('Connexion retirée');return}
  if(d.tg){if(d.tg==='o')hideO=!hideO;else hideU=!hideU;bars();drawMap();return}
  if(d.s){fs.has(d.s)?fs.delete(d.s):fs.add(d.s);bars();drawMap();fit();return}
  if(d.c){fc.has(d.c)?fc.delete(d.c):fc.add(d.c);bars();drawMap();fit();return}
  if(d.rmday){mut(()=>{const dd=dayO();dd.items=dd.items.filter(i=>i.aid!==d.rmday)});close();toast('Retiré de votre journée');return}
  if(d.add){addToDay(d.add);const a=get(d.add);if(a&&a.lat!=null)nearSheet(d.add);else close();return}
  if(d.add2){addToDay(d.add2);nearSheet(d.add2);return}
  if(d.open){actSheet(d.open);return}
  if(d.edit){editSheet(d.edit);return}
  if('newact' in d){addSheet();return}
  if(d.rate){const[i,n]=d.rate.split('|');mut(()=>{get(i).rate=get(i).rate==+n?0:+n});actSheet(i);return}
  if(d.fav){mut(()=>{get(d.fav).fav=!get(d.fav).fav});actSheet(d.fav);return}
  if(d.save!==undefined){const r=readForm(d.save);if(r){close();toast('Enregistré')}return}
  if(d.place!==undefined){let id=d.place;if($('#en')){const r=readForm(id||'');if(!r)return;id=r.id}placing=id;close();tab('map');toast('Touchez la carte à l’endroit souhaité');return}
  if(d.del){if(confirm('Supprimer ce lieu de votre carnet ?')){mut(()=>{S.acts=S.acts.filter(a=>a.id!==d.del);S.cals.forEach(c=>c.days.forEach(x=>x.items=x.items.filter(i=>i.aid!==d.del)))});close()}return}
  if(d.rm){mut(()=>cal().days.forEach(x=>x.items=x.items.filter(i=>i.id!==d.rm)));close();return}
  if(d.cal){S.cur=d.cal;day=Math.min(day,S.n-1);save();refresh();return}
  if('newcal' in d){const n=prompt('Nom de ce nouveau planning ?');if(n&&n.trim())mut(()=>{const c=mkCal(n.trim(),S.n);S.cals.push(c);S.cur=c.id});return}
  if('ren' in d){const n=prompt('Renommer le planning',cal().name);if(n&&n.trim())mut(()=>{cal().name=n.trim()});return}
  if('dup' in d){mut(()=>{const c=JSON.parse(JSON.stringify(cal()));c.id=uid();c.name+=' (copie)';c.days.forEach(x=>x.items.forEach(i=>i.id=uid()));S.cals.push(c);S.cur=c.id});return}
  if('delcal' in d){if(S.cals.length<2){toast('Conservez au moins un planning');return}if(confirm('Supprimer ce planning ?'))mut(()=>{S.cals=S.cals.filter(c=>c.id!==S.cur);S.cur=S.cals[0].id});return}
  if(d.export){doExport(d.export==='all');return}}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    closeGallery();
    return;
  }
  if(e.key==='ArrowLeft'&&$('#gallery-modal').classList.contains('on')){
    if(curGallery.length){curGalIdx=(curGalIdx-1+curGallery.length)%curGallery.length;updateGalUI()}return;
  }
  if(e.key==='ArrowRight'&&$('#gallery-modal').classList.contains('on')){
    if(curGallery.length){curGalIdx=(curGalIdx+1)%curGallery.length;updateGalUI()}return;
  }
  if(e.key!=='Enter')return;
  if(e.target.id==='aiq'){e.preventDefault();aiSend(e.target.value)}
  else if(e.target.id==='discq'){e.preventDefault();loadDiscover(true,e.target.value)}
  else if(e.target.dataset&&e.target.dataset.li){e.preventDefault();const b=document.querySelector(`[data-addli="${e.target.dataset.li}"]`);if(b)b.click()}
  else if(e.target.id==='pn'){e.preventDefault();const b=$('[data-addperson]');if(b)b.click()}
  else if(e.target.id==='sq'){e.preventDefault();clearTimeout(sqT);runSearch()}});

document.addEventListener('change',e=>{const tEl=e.target,d=tEl.dataset;
  if(d.time&&S){mut(()=>cal().days.forEach(x=>x.items.forEach(i=>{if(i.id===d.time&&tEl.value)i.t=tEl.value})))}
  else if(d.hotel!==undefined&&S){mut(()=>{cal().days[+d.hotel].hotel=tEl.value})}
  else if('imp' in d&&tEl.files[0]){doImport(tEl.files[0]);tEl.value=''}});

let rt;
document.addEventListener('input',e=>{const id=e.target.id;
  if(id==='ema'){clearTimeout(rt);const v=e.target.value.trim();if(/^https?:\/\//i.test(v)||parseGPS(v))rt=setTimeout(doResolve,450)}
  else if(id==='sq'){clearTimeout(sqT);sqT=setTimeout(runSearch,650)}});

window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});

/* ================= Démarrage ================= */
const boot=loadDB();DB=boot.db;S=curTrip();AIM=aiWelcome();applyTheme();applyLang(curLang);
try{localStorage.setItem(K+'_t','1');localStorage.removeItem(K+'_t')}catch(e){setTimeout(()=>toast('⚠ Pensez à exporter régulièrement votre sauvegarde'),800)}
initMap();show();{const n=$('#navs');if(n){n.addEventListener('scroll',navShadow,{passive:true});window.addEventListener('resize',navShadow);setTimeout(navShadow,100)}}
if(!S)setTimeout(tripForm,300);
window.__tp={get DB(){return DB},get S(){return S},parseGPS,fromHtml,nameFromUrl,norm,resolveLink,budgetData,leg,tripText,optimizeDay,dayEntries,get themePref(){return themePref},applyLang};
})();
</script></body></html>
