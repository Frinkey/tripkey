d.items.push({id:uid(),aid,t});
})}
/* planning */
function renderPlan(){const c=cal();$('#plan').innerHTML=`<h2>Planning</h2><div class="row" style="padding:0 0 10px">${S.cals.map(x=>`<button class="chip ${x.id===c.id?'on':''}" data-cal="${x.id}">${esc(x.name)}</button>`).join('')}<button class="chip" data-newcal>＋ Nouveau</button></div>
<div class="row" style="padding:0 0 12px"><button class="btn s" data-ren>Renommer</button><button class="btn s" data-dup>Dupliquer</button><button class="btn s" data-delcal>Supprimer</button></div>`+
c.days.map((d,i)=>`<h3>${dl(i)} décembre</h3><input data-hotel="${i}" value="${esc(d.hotel)}" placeholder="🏨 Hôtel">`+([...d.items].sort((a,b)=>a.t.localeCompare(b.t)).map(it=>{if(it.rest)return`<div class="card" style="background:rgba(255,198,92,.14)"><span>🛏</span><div class="nm"><b>Hôtel / repos</b><small>${it.t}–${it.to}</small></div><button class="btn s" data-rm="${it.id}">✕</button></div>`;const a=get(it.aid);return a?`<div class="card"><span class="dot" style="background:${COL[a.c]}"></span><input type="time" value="${it.t}" data-time="${it.id}"><div class="nm" data-open="${a.id}"><b>${esc(a.n)}</b><small>${CT[a.c]}${a.rate?' · '+'★'.repeat(a.rate):''}</small></div><button class="btn s" data-rm="${it.id}">✕</button></div>`:''}).join('')||'<div class="empty">Vide — remplis depuis la carte.</div>')+`<div class="row" style="padding:4px 0"><button class="btn s" data-day="${i}" data-go>Voir sur la carte</button>${d.items.some(x=>x.rest)?'':`<button class="btn s" data-restadd="${i}">🛏 Repos 17:00–19:30</button>`}</div>`).join('')}
function renderList(){const u=used(),no=S.acts.filter(a=>a.lat==null),yes=S.acts.filter(a=>a.lat!=null);
const row=a=>`<div class="card" data-open="${a.id}"><span class="dot" style="background:${COL[a.c]}"></span><div class="nm"><b>${esc(a.n)}</b><small>${CT[a.c]} · ${a.s.map(x=>SL[x][0]).join(', ')||'—'}${a.rate?' · '+'★'.repeat(a.rate):''}${u.has(a.id)?' · ✓ planifiée':''}</small></div>${a.fav?'♥':''}${a.lat==null?`<button class="btn s" data-place="${a.id}">📍</button>`:''}</div>`;
$('#list').innerHTML=`<h2>Activités</h2><button class="btn g" data-newact style="width:100%;justify-content:center;margin-bottom:6px">＋ Nouvelle activité</button><h3>À localiser (${no.length})</h3>${no.map(row).join('')||'<div class="empty">Tout est placé.</div>'}<h3>Sur la carte (${yes.length})</h3>${yes.map(row).join('')}`}
function renderInfo(){$('#info').innerHTML=`<h2>Infos utiles</h2><div class="note"><b>Facture restaurant</b><br>Si ajouts ou taxes inhabituels : demander une facture fiscale détaillée. Sans facture fiscale, ne pas payer la taxe. En cas de souci, filmer et mentionner @moiegy sur Instagram (infos reçues, à vérifier).<br><span dir="rtl">اطلب فاتورة ضريبية</span></div>
<div class="note"><b>Réclamation (à vérifier avant usage officiel)</b><br>Ligne : 16528<br>WhatsApp : 01555516528 / 01555525444<br>Instagram : @moiegy<ol><li>Demander le détail de la facture</li><li>Garder les justificatifs</li><li>Demander un responsable</li><li>Contacter l’organisme compétent</li></ol></div>
<div class="note"><b>Réservations</b><br>Utiliser un compte Booking égyptien. Rabbit : code RABBIT-GL3. Safari pyramides : 900 EGP/pers. (à vérifier).</div>
<h3>Sauvegarde</h3><div class="row" style="padding:0"><button class="btn" data-export>Exporter</button><label class="btn s">Importer<input type="file" id="imp" accept="application/json" hidden></label></div>
<h3>Zone dangereuse</h3><button class="btn r" data-reset>Réinitialiser</button>`}
function tab(t){tabNow=t;$('#dock').classList.toggle('hide',t!=='map');$('#top').style.display=t==='map'?'':'none';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));['plan','list','info'].forEach(p=>$('#'+p).classList.toggle('on',p===t));$('#new').style.display=t==='map'?'':'none';$('#unp').style.display=t==='map'&&unp().length?'':'none';$('#flt').style.display=t==='map'?'':'none';
if(t==='plan')renderPlan();if(t==='list')renderList();if(t==='info')renderInfo();if(t==='map')setTimeout(()=>{map.invalidateSize();drawMap()},60)}
function refresh(){bars();drawMap();if(tabNow==='plan')renderPlan();if(tabNow==='list')renderList()}
function doImport(f){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||!Array.isArray(j.acts)||!Array.isArray(j.cals)||!j.cals.length)throw Error('structure invalide');localStorage.setItem(K+'_backup',snap());undo.push(snap());S=j;if(!S.cals.find(c=>c.id===S.cur))S.cur=S.cals[0].id;save();refresh();toast('Import réussi (sauvegarde de sécurité conservée)')}catch(e){toast('Import impossible : '+e.message)}};r.readAsText(f)}
document.addEventListener('click',e=>{try{onClick(e)}catch(err){console.error(err);toast('Erreur : '+err.message)}});
function onClick(e){const t=e.target.closest('button,[data-open],#sheet');if(!t)return;const d=t.dataset;
if(t.id==='sheet'){if(e.target===t)close();return}
if(t.id==='nlx'){document.querySelectorAll('.nl-wrap').forEach(n=>n.remove());t.remove();return}if(t.id==='new')editSheet();else if(t.id==='unp')sheet(`<h2 style="font-size:20px;margin-top:0">Sans position</h2><p class="empty">Touche un lieu pour l’ajouter au jour ou le placer sur la carte.</p>${unp().map(a=>`<div class="near" data-open="${a.id}"><div><b>${esc(a.n)}</b><small>${CT[a.c]} · ${a.s.map(x=>SL[x][0]).join(', ')}</small></div><span>›</span></div>`).join('')}`);else if(t.id==='undo'){if(undo.length){redo.push(snap());S=JSON.parse(undo.pop());save();refresh()}}else if(t.id==='redo'){if(redo.length){undo.push(snap());S=JSON.parse(redo.pop());save();refresh()}}
else if(d.t)tab(d.t);else if('close' in d)close();
else if(d.day!==undefined){day=+d.day;bars();drawMap();if('go' in d)tab('map')}
else if(d.paste){const v=prompt('Colle le lien Google Maps long, ou « lat, lng » :');if(v){const g=parseGPS(v);if(g){mut(()=>{get(d.paste).lat=g[0];get(d.paste).lng=g[1]});toast('📍 Position enregistrée');actSheet(d.paste)}else toast('Format non reconnu (les liens courts maps.app.goo.gl ne contiennent pas les coordonnées)')}}else if(d.tg){if(d.tg==='o')hideO=!hideO;else hideU=!hideU;bars();drawMap()}else if(d.s){fs.has(d.s)?fs.delete(d.s):fs.add(d.s);bars();drawMap();fit()}else if(d.c){fc.has(d.c)?fc.delete(d.c):fc.add(d.c);bars();drawMap();fit()}
else if(d.rmday){mut(()=>{const dd=dayO();dd.items=dd.items.filter(i=>i.aid!==d.rmday)});close();toast('Retiré de '+dl(day))}else if(d.add){addToDay(d.add);if(get(d.add).lat!=null)nearSheet(d.add);else close()}
else if(d.add2){addToDay(d.add2);nearSheet(d.add2)}
else if(d.open)actSheet(d.open);else if(d.edit)editSheet(d.edit);else if('newact' in d)editSheet();
else if(d.rate){const[i,n]=d.rate.split('|');mut(()=>{get(i).rate=get(i).rate==+n?0:+n});actSheet(i)}
else if(d.fav){mut(()=>{get(d.fav).fav=!get(d.fav).fav});actSheet(d.fav)}
else if(d.save!==undefined){const r=readForm(d.save);if(r){close();toast('Enregistré')}}
else if(d.place!==undefined){let id=d.place;if(!id){const r=readForm('');if(!r)return;id=r.id}placing=id;close();tab('map');toast('Touche la carte pour placer le lieu')}
else if(d.del){if(confirm('Supprimer cette activité ?')){mut(()=>{S.acts=S.acts.filter(a=>a.id!==d.del);S.cals.forEach(c=>c.days.forEach(x=>x.items=x.items.filter(i=>i.aid!==d.del)))});close()}}
else if(d.rm)mut(()=>cal().days.forEach(x=>x.items=x.items.filter(i=>i.id!==d.rm)));
else if(d.restadd)mut(()=>cal().days[+d.restadd].items.push({id:uid(),rest:1,t:'17:00',to:'19:30'}));
else if(d.cal){S.cur=d.cal;save();refresh()}
else if('newcal' in d){const n=prompt('Nom du calendrier ?');if(n&&n.trim())mut(()=>{const c=mkCal(n.trim());S.cals.push(c);S.cur=c.id})}
else if('ren' in d){const n=prompt('Nouveau nom',cal().name);if(n&&n.trim())mut(()=>{cal().name=n.trim()})}
else if('dup' in d)mut(()=>{const c=JSON.parse(JSON.stringify(cal()));c.id=uid();c.name+=' (copie)';c.days.forEach(x=>x.items.forEach(i=>i.id=uid()));S.cals.push(c);S.cur=c.id});
else if('delcal' in d){if(S.cals.length<2)return toast('Garde au moins un calendrier');if(confirm('Supprimer ce calendrier ?'))mut(()=>{S.cals=S.cals.filter(c=>c.id!==S.cur);S.cur=S.cals[0].id})}
else if('export' in d){const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='egypt-2026.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}
else if('reset' in d){if(confirm('Tout effacer et revenir aux données initiales ?')){localStorage.setItem(K+'_backup',snap());const c=mkCal('Planning principal');S={acts:JSON.parse(JSON.stringify(SEED)),cals:[c],cur:c.id};undo=[];redo=[];save();refresh();renderInfo()}}}
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;if(d.time){mut(()=>cal().days.forEach(x=>x.items.forEach(i=>{if(i.id===d.time&&t.value)i.t=t.value})))}else if(d.hotel!==undefined){mut(()=>{cal().days[+d.hotel].hotel=t.value})}else if(t.id==='imp'&&t.files[0])doImport(t.files[0])});
window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
try{localStorage.setItem(K+'_t','1');localStorage.removeItem(K+'_t')}catch(e){setTimeout(()=>toast('⚠ Stockage du navigateur bloqué : exporte ta sauvegarde (Infos)'),800)}
initMap();bars();tab('map');setTimeout(fit,100);
})();
</script></body></html>
