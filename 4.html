/* ================= Planning ================= */
function placeInDay(d,a){const last=d.items.filter(i=>i.aid&&get(i.aid)).sort(byT).pop();let t=a.s[0]&&SL[a.s[0]]?SL[a.s[0]][1]:'15:00';
  if(last){const e=tm(last.t)+(get(last.aid).d||60)+30;if(e>tm(t)&&a.s[0]!=='e'&&a.s[0]!=='s')t=mt(e)}
  d.items.push({id:uid(),aid:a.id,t})}
function addToDay(aid){const a=get(aid),d=dayO();if(!a||d.items.some(i=>i.aid===aid))return;mut(()=>placeInDay(d,a))}
const rankOf=a=>({m:0,a:1,s:2,e:3}[a.s[0]]??1);
const routeKm=list=>{let k=0;for(let i=1;i<list.length;i++){const l=leg(get(list[i-1].aid),get(list[i].aid));if(l)k+=l.km}return k};
function optimizeDay(n){ /* limite les déplacements en gardant la logique matin → soir */
  const d=cal().days[n],acts=d.items.filter(i=>i.aid&&get(i.aid)).sort(byT);if(acts.length<2)return null;const before=routeKm(acts);
  const groups=[[],[],[],[]];acts.forEach(i=>groups[rankOf(get(i.aid))].push(i));
  let anchor=null;const order=[];
  groups.forEach(g=>{const rest=[...g];while(rest.length){let bi=0;if(anchor){let bd=1e9;rest.forEach((x,k)=>{const dd=hav(anchor,get(x.aid)),v=dd==null?500:dd;if(v<bd){bd=v;bi=k}})}const x=rest.splice(bi,1)[0];order.push(x);anchor=get(x.aid)}});
  let end=0;order.forEach(i=>{const a=get(i.aid),st=tm(SL[a.s[0]]?SL[a.s[0]][1]:'15:00'),t=Math.max(end,st);i.t=mt(t);end=t+(a.d||60)+30});
  d.items=[...d.items.filter(i=>!(i.aid&&get(i.aid))),...order];return{before,after:routeKm(order)}}
function autofill(n){ /* propose une journée à partir des lieux libres : matin, après-midi, coucher de soleil, soirée */
  const d=cal().days[n],u=used(),pool=S.acts.filter(a=>!u.has(a.id));if(!pool.length)return[];
  const ex=d.items.filter(i=>i.aid&&get(i.aid)).sort(byT),cnt={m:0,a:0,s:0,e:0},cap={m:1,a:2,s:1,e:1};ex.forEach(i=>{const r=get(i.aid).s[0];if(cnt[r]!=null)cnt[r]++});
  let anchor=ex.length?get(ex[ex.length-1].aid):null;const chosen=[];
  for(const slot of ['m','a','a','s','e']){if(cnt[slot]>=cap[slot])continue;
    const c=pool.filter(a=>!chosen.includes(a)&&a.s.includes(slot));if(!c.length)continue;
    let best=null,bs=1e9;c.forEach(a=>{const dd=anchor?hav(anchor,a):null;const sc=(anchor?(dd==null?8:dd):0)-(a.fav?1.5:0)-(a.rate||0)*.3;if(sc<bs){bs=sc;best=a}});
    chosen.push(best);cnt[slot]++;anchor=best}
  chosen.forEach(a=>placeInDay(d,a));return chosen}
function swapItem(id,dir){const f=findItem(id);if(!f)return;
  const arr=f.d.items.filter(x=>x.aid||typeof x.note==='string').slice().sort(byT),k=arr.findIndex(x=>x.id===id),j=k+dir;
  if(k<0||j<0||j>=arr.length){toast(dir<0?'Déjà en premier':'Déjà en dernier');return}
  mut(()=>{const times=arr.map(x=>x.t),[m]=arr.splice(k,1);arr.splice(j,0,m);arr.forEach((x,ix)=>{x.t=times[ix]});f.d.items=arr.concat(f.d.items.filter(x=>!arr.includes(x)))})}
function moveItem(id,to){const f=findItem(id);if(!f||to===f.i)return;const tgt=cal().days[to];if(!tgt)return;
  if(f.it.aid&&tgt.items.some(x=>x.aid===f.it.aid)){toast('Déjà dans ce jour');return}
  mut(()=>{f.d.items=f.d.items.filter(x=>x.id!==id);tgt.items.push(f.it)});close();toast('Déplacé vers '+dl(to))}
function dirURL(i){const pts=dayEntries(i).filter(e=>e.k==='act'&&e.a.lat!=null).map(e=>e.a.lat+','+e.a.lng);if(pts.length<2)return'';
  const use=pts.slice(0,11),dist=routeKm(dayEntries(i).filter(e=>e.k==='act'&&e.a.lat!=null).map(e=>({aid:e.a.id})));
  return'https://www.google.com/maps/dir/?api=1&origin='+use[0]+'&destination='+use[use.length-1]+(use.length>2?'&waypoints='+use.slice(1,-1).join('|'):'')+'&travelmode='+(dist<=3?'walking':'driving')}

    (es.map(e=>{
      if(e.k==='res')return`<div class="card tint"><span>${RT[e.r.k][1]}</span><div class="nm" data-resid="${e.r.id}"><b>${esc(e.r.t)}</b><small>${e.r.time||'Journée'}${e.r.ref?' · Réf. '+esc(e.r.ref):''}</small></div></div>`;
      const mv=`<div class="mv"><button data-mv="${e.it.id}|-1" aria-label="Monter">▲</button><button data-mv="${e.it.id}|1" aria-label="Descendre">▼</button></div>`;
      if(e.k==='note')return`<div class="card"><span>📝</span><input type="time" value="${e.it.t}" data-time="${e.it.id}"><div class="nm" data-item="${e.it.id}"><b style="white-space:pre-wrap">${esc(e.it.note)}</b></div>${mv}<button class="btn s sm" data-item="${e.it.id}">⋯</button></div>`;
      return(e.leg?`<div class="leg">${legTxt(e.leg)}</div>`:'')+`<div class="card"><span class="dot" style="background:${COL[e.a.c]}"></span><input type="time" value="${e.it.t}" data-time="${e.it.id}"><div class="nm" data-open="${e.a.id}"><b>${esc(e.a.n)}</b><small>${CT[e.a.c]}${e.a.d?' · '+fmtMin(e.a.d):''}${e.a.rate?' · '+'★'.repeat(e.a.rate):''}</small></div>${mv}<button class="btn s sm" data-item="${e.it.id}">⋯</button></div>`}).join('')||'<div class="empty">Vide — remplis depuis la carte ou avec « Remplir auto ».</div>')+
    `<div class="row" style="padding:4px 0"><button class="btn s sm" data-day="${i}" data-go>🗺 Carte</button><button class="btn s sm" data-addnote="${i}">＋ Note</button><button class="btn s sm" data-autofill="${i}">✨ Remplir auto</button><button class="btn s sm" data-optim="${i}">⇄ Optimiser</button>${url?`<a class="btn s sm" target="_blank" rel="noopener" href="${esc(url)}">🧭 Itinéraire</a>`:''}</div>`}).join('')}

function budgetData(){const total=S.exp.reduce((s,x)=>s+x.amt,0),byCat={},byDay={},paid={};let attr=0;
  S.exp.forEach(x=>{byCat[x.cat]=(byCat[x.cat]||0)+x.amt;const k=x.day==null?'x':x.day;byDay[k]=(byDay[k]||0)+x.amt;if(x.by){paid[x.by]=(paid[x.by]||0)+x.amt;attr+=x.amt}});
  const n=S.people.length,bal={},settle=[];
  if(n>=2){const share=attr/n;S.people.forEach(p=>{bal[p.id]=(paid[p.id]||0)-share});
    const deb=[],cre=[];S.people.forEach(p=>{const b=bal[p.id];if(b<-0.005)deb.push({p,a:-b});else if(b>0.005)cre.push({p,a:b})});deb.sort((x,y)=>y.a-x.a);cre.sort((x,y)=>y.a-x.a);
    let i=0,j=0;while(i<deb.length&&j<cre.length){const v=Math.min(deb[i].a,cre[j].a);settle.push({from:deb[i].p.name,to:cre[j].p.name,a:v});deb[i].a-=v;cre[j].a-=v;if(deb[i].a<.005)i++;if(cre[j].a<.005)j++}}
  return{total,byCat,byDay,paid,bal,settle}}
function infoBudget(){const B=budgetData();let h=`<div class="card blk"><small>Total dépensé</small><div style="font-size:32px;font-weight:800;letter-spacing:-1px">${fm(B.total)}</div>`;
  if(S.budget){const p=Math.min(100,B.total/S.budget*100);h+=`<div class="bar"><i style="width:${p}%;${B.total>S.budget?'background:var(--bad)':''}"></i></div><small>${B.total>S.budget?'Dépassé de '+fm(B.total-S.budget):'Reste '+fm(S.budget-B.total)} sur ${fm(S.budget)}</small>`}

  const days=Object.keys(B.byDay);if(days.length)h+=`<h3>Par jour</h3><div class="card blk">${days.sort((a,b)=>(a==='x'?1e9:+a)-(b==='x'?1e9:+b)).map(k=>`<div class="kv"><span>${k==='x'?'Non daté':esc(dl(+k))}</span><span>${fm(B.byDay[k])}</span></div>`).join('')}</div>`;
  if(S.people.length>=2&&Object.keys(B.paid).length)h+=`<h3>Qui doit quoi</h3><div class="card blk">${S.people.map(p=>`<div class="kv"><span>${esc(p.name)} a payé</span><span>${fm(B.paid[p.id]||0)}</span></div>`).join('')}<hr style="border:0;border-top:1px solid var(--ln)">${B.settle.length?B.settle.map(s=>`<div class="kv"><span>${esc(s.from)} doit à ${esc(s.to)}</span><span>${fm(s.a)}</span></div>`).join(''):'<div class="kv"><span>Tout est équilibré ✓</span><span></span></div>'}<small>Partage à parts égales des dépenses qui ont un payeur.</small></div>`;
  else if(S.people.length<2)h+=`<div class="note" style="cursor:default"><b>Partager les dépenses ?</b><br>Ajoute au moins deux voyageurs dans « Aperçu » et indique qui paie : l’app calcule qui doit quoi.</div>`;
  h+=`<h3>Dépenses (${S.exp.length})</h3>`+(S.exp.map(x=>`<div class="card" data-expid="${x.id}"><span style="font-size:22px">${EXC[x.cat][1]}</span><div class="nm"><b>${esc(x.t)}</b><small>${EXC[x.cat][0]} · ${x.day==null?'Non daté':esc(dl(x.day))}${x.by?' · '+esc((S.people.find(p=>p.id===x.by)||{}).name||''):''}</small></div><b>${fm(x.amt)}</b></div>`).join('')||'<div class="empty">Aucune dépense pour l’instant.</div>');return h}

function tripText(){const L=[`${S.flag} ${S.name} — ${rangeLbl(S)}`,`📍 ${S.dest}`,''];
  cal().days.forEach((d,i)=>{const es=dayEntries(i);L.push(`— ${dl(i)}${d.hotel?' · 🏨 '+d.hotel:''}`);if(!es.length)L.push('   (libre)');
    es.forEach(e=>{if(e.k==='act'){L.push(`   ${e.t} ${e.a.n}${e.a.d?' ('+fmtMin(e.a.d)+')':''}`);const u=e.a.lat!=null?`https://www.google.com/maps/search/?api=1&query=${e.a.lat},${e.a.lng}`:(e.a.maps||'');if(u)L.push('      '+u)}
      else if(e.k==='note')L.push(`   ${e.t} 📝 ${e.it.note}`);else L.push(`   ${e.r.time||'  —  '} ${RT[e.r.k][1]} ${e.r.t}${e.r.ref?' (Réf. '+e.r.ref+')':''}`)});L.push('')});
  return L.join('\n').trim()}

async function saveTrip(id){
  const name=$('#tn').value.trim(),dest=$('#td').value.trim()||name,flag=$('#tf').value.trim()||'🌍',money=$('#tc').value.trim()||'€',a=pISO($('#ts').value),b=pISO($('#te').value);
  if(!name)return toast('Donne un nom au voyage');if(!a||!b)return toast('Renseigne les deux dates');
  const n=Math.round((b-a)/864e5)+1;if(n<1)return toast('Le départ doit être après l’arrivée');if(n>MAXD)return toast('Maximum '+MAXD+' jours');
  const start=toISO(a);
  if(id){const t=DB.trips.find(x=>x.id===id);if(!t)return;
    const lost=n<t.n?t.cals.reduce((s,c)=>s+c.days.slice(n).reduce((x,d)=>x+d.items.length,0),0):0;
    if(lost&&!confirm(lost+' élément(s) des derniers jours seront supprimés. Continuer ?'))return;
    let ctr=t.center;if(dest!==t.dest){toast('Recherche de la destination…');try{const r=await geocode(dest,1,false);if(r[0])ctr=[r[0].lat,r[0].lng]}catch(e){}}
    mut(()=>{t.name=name;t.flag=flag;t.dest=dest;t.money=money.slice(0,6);t.start=start;t.center=ctr;t.cals.forEach(c=>{while(c.days.length<n)c.days.push({hotel:'',items:[]});c.days=c.days.slice(0,n)});t.exp.forEach(x=>{if(x.day!=null&&x.day>=n)x.day=null});t.n=n;day=Math.min(day,n-1)});
    close();bars();centerMap();toast('✓ Voyage mis à jour');return}
  toast('Création du voyage…');const t=mkTrip({name,flag,dest,start,n,money:money.slice(0,6)});
  try{const r=await geocode(dest,1,false);if(r[0]){t.center=[r[0].lat,r[0].lng];t.zoom=11}else toast('Destination introuvable : la carte se centrera sur tes lieux')}catch(e){}
  DB.trips.push(t);close();setTrip(t.id);toast('✓ Voyage créé')}
function setTrip(id){DB.cur=id;S=curTrip();undo=[];redo=[];day=0;fs.clear();fc.clear();hideO=false;hideU=false;placing=null;infoSub='apercu';AIM=aiWelcome();save();show()}

  DB.trips=DB.trips.filter(t=>t.id!==S.id);DB.cur=DB.trips[0]?DB.trips[0].id:'';S=curTrip();undo=[];redo=[];day=0;AIM=aiWelcome();save();show();toast('Voyage supprimé')}

function download(name,obj){const u=URL.createObjectURL(new Blob([JSON.stringify(obj,null,1)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
const slug=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase()||'voyage';
function doExport(all){if(all)download('trip-planner-sauvegarde.json',DB);else download(slug(S.name)+'.json',{v:2,cur:S.id,trips:[S]})}
function doImport(f){const r=new FileReader();r.onerror=()=>toast('Lecture du fichier impossible');
  r.onload=()=>{try{const j=JSON.parse(r.result);let trips=[];
    if(j&&Array.isArray(j.trips))trips=j.trips.map(norm).filter(Boolean);
    else if(j&&Array.isArray(j.acts)&&Array.isArray(j.cals)&&j.cals.length)trips=[fromLegacy(j,{name:f.name.replace(/\.json$/i,'')||'Voyage importé'})];
    else throw Error('fichier non reconnu');
    if(!trips.length)throw Error('aucun voyage dans le fichier');
    const rep=trips.filter(t=>DB.trips.some(x=>x.id===t.id)).length;
    if(rep&&!confirm(rep+' voyage(s) existant(s) seront remplacés par la sauvegarde. Continuer ?'))return;
    try{localStorage.setItem(K+'_backup',JSON.stringify(DB))}catch(e){}
    for(const t of trips){const i=DB.trips.findIndex(x=>x.id===t.id);if(i>=0)DB.trips[i]=t;else DB.trips.push(t)}
    close();setTrip(trips[0].id);toast(`✓ ${trips.length} voyage(s) importé(s) (copie de sécurité conservée)`)}
   catch(e){toast('Import impossible : '+e.message)}};r.readAsText(f)}

async function cloudAI(){const acts=S.acts.map(a=>({id:a.id,n:a.n,c:CT[a.c],s:a.s.join(''),lat:a.lat,lng:a.lng,prix:a.price,h:a.hrs,min:a.d}));const days=cal().days.map((d,i)=>({jour:i+1,date:dl(i),hotel:d.hotel,items:d.items.filter(x=>x.aid).map(x=>({id:x.aid,t:x.t}))}));
  const sys='Tu es l’assistant d’un voyage : '+S.name+' ('+S.dest+', '+rangeLbl(S)+'). Réponds en français, court et concret. Utilise uniquement les lieux fournis (champ id). N’invente jamais prix, horaires ni GPS. Respecte le meilleur moment de chaque lieu (s : m=matin, a=après-midi, s=coucher de soleil, e=soirée), regroupe les lieux proches, ne surcharge pas les journées. Pour proposer des changements, termine par un bloc ```actions [{"op":"add"|"remove","id":"…","day":1-'+S.n+',"time":"HH:MM"}] ```. Jour actuel : '+(day+1)+'. Données : '+JSON.stringify({acts,days});
  const hist=AIM.filter(m=>m.t).slice(-8).map(m=>({role:m.r==='u'?'user':'assistant',content:m.t}));
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':aiKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:900,system:sys,messages:hist})});
  const j=await r.json();if(!r.ok)throw Error(j.error&&j.error.message||('HTTP '+r.status));return(j.content||[]).map(c=>c.text||'').join('')}
function bubble(m,i){let h=m.h!=null?m.h:esc(m.t).replace(/\n/g,'<br>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');if(m.ops&&m.ops.length)h+=`<br><button class="mini" data-aiapply="${i}">✓ Appliquer ${m.ops.length} modification(s)</button>`;return`<div class="bub ${m.r}">${h}</div>`}
function addMsg(m){AIM.push(m);const el=$('#msgs');if(el){el.insertAdjacentHTML('beforeend',bubble(m,AIM.length-1));$('#ai').scrollTo(0,1e6)}}
function dropTmp(){while(AIM.length&&AIM[AIM.length-1].tmp)AIM.pop();$$('.bub.tmp').forEach(b=>b.remove())}
async function aiSend(text){text=(text||'').trim();if(!text||aiBusy)return;addMsg({r:'u',t:text});const q=$('#aiq');if(q)q.value='';
  if(!aiKey()){addMsg({r:'a',...localAI(text)});return}
  aiBusy=true;addMsg({r:'a',h:'…',tmp:1});{const bs=$$('.bub');if(bs.length)bs[bs.length-1].classList.add('tmp')}
  try{const out=await cloudAI();dropTmp();let ops=[];const m=out.match(/```actions\s*([\s\S]*?)```/);if(m){try{ops=JSON.parse(m[1])}catch(e){}}addMsg({r:'a',t:out.replace(/```actions[\s\S]*?```/,'').trim(),ops})}
  catch(e){dropTmp();addMsg({r:'a',h:'⚠ IA indisponible : '+esc(e.message)+'. Mode local :<br>'+localAI(text).h})}
  aiBusy=false}
function applyOps(ops){undo.push(snap());if(undo.length>25)undo.shift();redo=[];let n=0;
  for(const o of ops){const d=cal().days[(+o.day||0)-1],a=get(o.id);if(!d||!a)continue;
    if(o.op==='add'&&!d.items.some(i=>i.aid===o.id)){d.items.push({id:uid(),aid:o.id,t:/^\d\d:\d\d$/.test(o.time||'')?o.time:(SL[a.s[0]]?SL[a.s[0]][1]:'15:00')});n++}

  if('ren' in d){const n=prompt('Nouveau nom',cal().name);if(n&&n.trim())mut(()=>{cal().name=n.trim()});return}
  if('dup' in d){mut(()=>{const c=JSON.parse(JSON.stringify(cal()));c.id=uid();c.name+=' (copie)';c.days.forEach(x=>x.items.forEach(i=>i.id=uid()));S.cals.push(c);S.cur=c.id});return}
  if('delcal' in d){if(S.cals.length<2){toast('Garde au moins un calendrier');return}if(confirm('Supprimer ce calendrier ?'))mut(()=>{S.cals=S.cals.filter(c=>c.id!==S.cur);S.cur=S.cals[0].id});return}
  if(d.export){doExport(d.export==='all');return}}
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='aiq'){e.preventDefault();aiSend(e.target.value)}else if(e.target.dataset&&e.target.dataset.li){e.preventDefault();const b=document.querySelector(`[data-addli="${e.target.dataset.li}"]`);if(b)b.click()}else if(e.target.id==='pn'){e.preventDefault();const b=$('[data-addperson]');if(b)b.click()}else if(e.target.id==='sq'){e.preventDefault();clearTimeout(sqT);runSearch()}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
  if(d.time&&S){mut(()=>cal().days.forEach(x=>x.items.forEach(i=>{if(i.id===d.time&&t.value)i.t=t.value})))}
  else if(d.hotel!==undefined&&S){mut(()=>{cal().days[+d.hotel].hotel=t.value})}
  else if('imp' in d&&t.files[0]){doImport(t.files[0]);t.value=''}});
let rt;document.addEventListener('input',e=>{const id=e.target.id;
  if(id==='ema'){clearTimeout(rt);const v=e.target.value.trim();if(/^https?:\/\//i.test(v)||parseGPS(v))rt=setTimeout(doResolve,450)}
  else if(id==='sq'){clearTimeout(sqT);sqT=setTimeout(runSearch,650)}});
window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});

/* ================= Démarrage ================= */
const boot=loadDB();DB=boot.db;S=curTrip();AIM=aiWelcome();applyTheme();
try{localStorage.setItem(K+'_t','1');localStorage.removeItem(K+'_t')}catch(e){setTimeout(()=>toast('⚠ Stockage du navigateur bloqué : exporte régulièrement ta sauvegarde'),800)}
initMap();show();
if(boot.migrated){save();setTimeout(()=>toast('✓ Données de l’ancienne version importées : Égypte 2026'),700)}
if(!S)setTimeout(tripForm,300);
window.__tp={get DB(){return DB},get S(){return S},parseGPS,fromHtml,nameFromUrl,norm,resolveLink,budgetData,leg,tripText,optimizeDay,dayEntries,get themePref(){return themePref}};
})();
