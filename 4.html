<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Trip Planner">
<meta name="theme-color" content="#f2f4f9">
<title>Trip Planner</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f97316' stroke-width='2'><circle cx='12' cy='12' r='10'/><polygon points='16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76'/></svg>">
<script>
try{
  var p=localStorage.getItem('tripkit_theme')||'light';
  if(p==='auto')p=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  document.documentElement.dataset.theme=p;
}catch(e){document.documentElement.dataset.theme='light'}
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{
  color-scheme:light;
  --bg:#f4f6fa;
  --sf:#ffffff;
  --sf2:#eef2f8;
  --tx:#0f172a;
  --mu:#64748b;
  --ln:#e2e8f0;
  --glass:rgba(255,255,255,0.88);
  --sh:0 10px 28px rgba(15,23,42,0.12);
  --shs:0 2px 6px rgba(15,23,42,0.06);
  --acc:linear-gradient(135deg,#ff7043,#f97316);
  --accTx:#ffffff;
  --gold:#f59e0b;
  --ok:#10b981;
  --bad:#ef4444;
  --sheet:#ffffff;
  --ov:rgba(15,23,42,0.5);
  --inp:#f8fafc;
  --tint:rgba(245,158,11,0.12);
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#0f172a;
  --sf:#1e293b;
  --sf2:#27354f;
  --tx:#f8fafc;
  --mu:#94a3b8;
  --ln:rgba(255,255,255,0.12);
  --glass:rgba(30,41,59,0.88);
  --sh:0 12px 32px rgba(0,0,0,0.48);
  --shs:0 2px 6px rgba(0,0,0,0.3);
  --gold:#fbbf24;
  --ok:#34d399;
  --bad:#f87171;
  --sheet:#1e293b;
  --ov:rgba(0,0,0,0.7);
  --inp:rgba(255,255,255,0.06);
  --tint:rgba(251,191,36,0.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;margin:0;
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--tx);overflow:hidden;background:var(--bg);
}
html[dir=rtl] body{direction:rtl;text-align:right}
button,input,select,textarea{font-family:inherit}

#map{position:fixed;inset:0;background:var(--bg)}
:root[data-theme=dark] .leaflet-tile-pane{filter:invert(1) hue-rotate(195deg) brightness(.92) contrast(.9) saturate(.7)}

.glass{
  background:var(--glass);
  backdrop-filter:blur(20px) saturate(1.7);
  -webkit-backdrop-filter:blur(20px) saturate(1.7);
  border:1px solid var(--ln);
  box-shadow:var(--sh);
}

/* Header haut */
#top{
  position:fixed;left:12px;right:12px;
  top:calc(12px + env(safe-area-inset-top));
  z-index:500;display:flex;flex-direction:column;gap:8px;
}
#brandrow{
  display:flex;gap:8px;align-items:center;justify-content:space-between;
}
#brand{
  display:inline-flex;align-items:center;gap:8px;
  max-width:65vw;width:fit-content;flex:none;
  border-radius:999px;padding:9px 15px;
  font-weight:700;font-size:15px;color:var(--tx);
  cursor:pointer;white-space:nowrap;overflow:hidden;
  border:1px solid var(--ln);
}
#brand span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#brand svg{flex:none;color:var(--mu);transition:transform .2s}

.top-actions{display:flex;align-items:center;gap:6px;flex:none}
.btn-icon{
  width:40px;height:40px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--ln);background:var(--glass);
  color:var(--tx);cursor:pointer;transition:transform .15s,background .15s;
}
.btn-icon:active{transform:scale(0.92)}
.btn-icon:disabled{opacity:0.35;pointer-events:none}
.btn-icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#filtertoggle{
  border-radius:999px;padding:9px 14px;font-size:13.5px;
  font-weight:700;color:var(--tx);cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);
}
#filtertoggle.on{background:var(--acc);color:var(--accTx);border-color:transparent}

#filterbox{display:flex;flex-direction:column;gap:8px;transition:all .2s ease}
#filterbox.collapsed{display:none}
.row{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.row.wrap{flex-wrap:wrap;overflow:visible}

.chip{
  flex:none;border:1px solid var(--ln);background:var(--glass);
  border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:600;
  color:var(--tx);cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  box-shadow:var(--shs);transition:transform .15s;
}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--acc);color:var(--accTx);border-color:transparent}
.pane .chip,#sheet .chip{background:var(--sf2);box-shadow:none}
.pane .chip.on,#sheet .chip.on{background:var(--acc);color:#fff}

/* Dock bas de carte */
#dock{
  position:fixed;left:0;right:0;bottom:68px;z-index:450;
  border-radius:24px 24px 0 0;padding:10px 0 calc(6px + env(safe-area-inset-bottom));
}
#dock.hide{display:none}
#days{display:flex;gap:8px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none}
#days::-webkit-scrollbar{display:none}
.dt{
  flex:none;width:52px;height:72px;border-radius:18px;
  border:1px solid var(--ln);background:var(--sf);color:var(--tx);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;cursor:pointer;padding:0;box-shadow:var(--shs);
}
.dt small{font-size:11px;color:var(--mu);font-weight:600}
.dt .mo{font-size:10px;text-transform:uppercase;letter-spacing:.3px;font-weight:700}
.dt b{font-size:20px;font-weight:800;line-height:1.1}
.dt i{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.dt.on{background:var(--acc);color:var(--accTx);border-color:transparent;transform:translateY(-2px)}
.dt.on small{color:rgba(255,255,255,.85)}
.dt.on i{background:#ffffff}

#tl{display:flex;gap:8px;overflow-x:auto;padding:0 12px 6px;scrollbar-width:none}
#tl::-webkit-scrollbar{display:none}
.tk{
  flex:none;min-width:170px;max-width:230px;border-radius:16px;
  padding:8px 12px;background:var(--sf);border:1px solid var(--ln);
  border-inline-start:4px solid var(--c,var(--gold));
  box-shadow:var(--shs);cursor:pointer;position:relative;
}
.tk b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-inline-end:22px}
.tk small{color:var(--mu);font-size:11.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk.ghost{border:1px dashed var(--ln);border-inline-start:1px dashed var(--ln);color:var(--mu);cursor:default;min-width:240px}
.tk-rm-btn{
  position:absolute;top:6px;right:6px;width:20px;height:20px;
  border-radius:50%;border:0;background:var(--sf2);color:var(--mu);
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
}
.tk-rm-btn:hover{background:var(--bad);color:#fff}
.tk-rm-btn svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.5}

/* Boutons flottants carte (côte à côte) */
#floating-actions{
  position:fixed;right:14px;
  bottom:calc(185px + env(safe-area-inset-bottom));
  z-index:520;display:flex;align-items:center;gap:10px;
}
#unp{
  position:fixed;left:14px;
  bottom:calc(185px + env(safe-area-inset-bottom));
  z-index:520;border-radius:999px;box-shadow:var(--sh);
}
.fab{
  width:52px;height:52px;border-radius:50%;border:0;
  display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:var(--sh);transition:transform .15s;
}
.fab:active{transform:scale(.92)}
.fab.main{background:var(--acc);color:var(--accTx)}
.fab.sub{background:var(--glass);color:var(--tx);border:1px solid var(--ln)}
.fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* Barre de navigation inférieure */
#nav{
  position:fixed;left:0;right:0;bottom:0;z-index:700;
  display:flex;align-items:center;justify-content:space-around;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  border-top:1px solid var(--ln);
}
#nav button{
  flex:1;border:0;background:none;border-radius:14px;
  padding:5px 0 3px;font-size:10px;font-weight:700;color:var(--mu);
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
}
#nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:#f97316}

/* Panneaux */
.pane{
  position:fixed;inset:0;z-index:400;background:var(--bg);overflow:auto;
  padding:calc(16px + env(safe-area-inset-top)) 14px calc(80px + env(safe-area-inset-bottom));
  display:none;-webkit-overflow-scrolling:touch;
}
.pane.on{display:block}
#welcome{z-index:800;padding-top:calc(40px + env(safe-area-inset-top))}

h2{font-size:26px;font-weight:800;letter-spacing:-.6px;margin:8px 0 14px}
h3{margin:18px 0 8px;font-size:13px;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.4px}

/* Accordéons planning */
.day-acc{
  background:var(--sf);border:1px solid var(--ln);
  border-radius:18px;margin-bottom:12px;overflow:hidden;box-shadow:var(--shs);
}
.day-header{
  padding:14px 16px;cursor:pointer;display:flex;align-items:center;
  justify-content:space-between;gap:12px;user-select:none;
}
.day-header-info{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.day-header-info b{font-size:16px;font-weight:800}
.day-header-info small{color:var(--mu);font-size:12.5px;line-height:1.3}
.day-chevron{color:var(--mu);transition:transform .25s ease;flex:none}
.day-chevron svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5}
.day-acc.open .day-chevron{transform:rotate(180deg)}
.day-body{display:none;padding:0 14px 14px;border-top:1px solid var(--ln);background:var(--inp)}
.day-acc.open .day-body{display:block}

/* Cartes dans le planning */
.plan-card{
  background:var(--sf);border:1px solid var(--ln);border-radius:14px;
  padding:12px;margin:10px 0;box-shadow:var(--shs);display:flex;flex-direction:column;gap:8px;
}
.plan-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.plan-time-wrap{display:flex;align-items:center;gap:6px}
.plan-actions{display:flex;align-items:center;gap:5px}
.plan-card-title{font-size:15px;font-weight:700;line-height:1.35;word-break:break-word}
.plan-card-sub{color:var(--mu);font-size:12px}

.card{
  background:var(--sf);border:1px solid var(--ln);border-radius:16px;
  padding:12px;margin-bottom:10px;display:flex;gap:10px;align-items:center;box-shadow:var(--shs);
}
.card.blk{display:block}
.card .nm{flex:1;min-width:0}
.card small{display:block;color:var(--mu);font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}

.btn{
  border:0;border-radius:14px;padding:10px 16px;font-size:14px;font-weight:700;
  background:var(--acc);color:var(--accTx);min-height:42px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;flex:none;text-decoration:none;
}
.btn.s{background:var(--sf2);color:var(--tx)}
.btn.r{background:var(--bad);color:#fff}
.btn.sm{min-height:34px;padding:6px 10px;font-size:12.5px;border-radius:10px}
.btn.ic{width:34px;height:34px;min-height:34px;padding:0;border-radius:10px}
.btn.ic svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2}

input,select,textarea{
  width:100%;padding:12px;border:1px solid var(--ln);border-radius:12px;
  font-size:15px;margin:4px 0 10px;background:var(--inp);color:var(--tx);
}
input[type=time]{width:auto;margin:0;padding:6px 10px;border-radius:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sp{display:flex;gap:8px;align-items:center}.sp input{margin:0;flex:1}
.seg{display:flex;background:var(--sf2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:8px 0;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--sf);color:var(--tx);box-shadow:var(--shs)}

/* Pin et balise radar Leaflet */
.pin{
  width:36px;height:36px;border-radius:50%;
  background:var(--c,#f97316);border:2.5px solid #fff;
  box-shadow:0 4px 10px rgba(0,0,0,0.3);display:flex;align-items:center;
  justify-content:center;position:relative;color:#fff;
}
.pin svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5}
.pin em{
  position:absolute;top:-7px;right:-7px;background:var(--gold);color:#000;
  border-radius:10px;min-width:18px;height:18px;font-size:10px;
  font-weight:800;line-height:18px;text-align:center;font-style:normal;border:2px solid #fff;
}
.pin-beacon{
  position:absolute;inset:-10px;border-radius:50%;
  border:3px solid #f97316;animation:radar 1.4s ease-out infinite;pointer-events:none;
}
@keyframes radar{0%{transform:scale(0.6);opacity:1}100%{transform:scale(2.2);opacity:0}}

/* Modales bottom sheet */
#sheet{position:fixed;inset:0;z-index:900;background:var(--ov);display:none;align-items:flex-end}
#sheet.on{display:flex}
#sheet>div{
  background:var(--sheet);border-top:1px solid var(--ln);width:100%;
  border-radius:24px 24px 0 0;padding:12px 18px calc(24px + env(safe-area-inset-bottom));
  max-height:88%;overflow:auto;animation:up .25s ease-out;
}
.sheet-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-top h2{font-size:20px;margin:0}
.sheet-close-btn{
  width:32px;height:32px;border-radius:50%;border:0;
  background:var(--sf2);color:var(--mu);display:flex;align-items:center;
  justify-content:center;cursor:pointer;padding:0;
}
.sheet-close-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5}
@keyframes up{from{transform:translateY(60px);opacity:0}}

#toast{
  position:fixed;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  background:var(--tx);color:var(--bg);font-weight:700;padding:9px 16px;border-radius:999px;
  z-index:1200;opacity:0;transition:.25s;pointer-events:none;font-size:13.5px;max-width:90%;
}
#toast.on{opacity:1}

.stars button{border:0;background:none;font-size:24px;color:var(--ln);cursor:pointer;padding:2px}
.stars .on{color:var(--gold)}
.note{background:var(--tint);border:1px solid var(--gold);border-radius:14px;padding:12px;margin-bottom:10px}
.empty{color:var(--mu);padding:10px 0;font-size:13.5px}

/* Galerie lightbox */
#gallery-modal{
  position:fixed;inset:0;background:rgba(0,0,0,0.9);
  z-index:1300;display:none;flex-direction:column;align-items:center;justify-content:center;padding:14px;
}
#gallery-modal.on{display:flex}
#gal-img-wrap{position:relative;max-width:94%;max-height:75vh;display:flex;align-items:center;justify-content:center}
#gal-img{max-width:100%;max-height:75vh;border-radius:14px;object-fit:contain}
.gal-btn{
  position:absolute;top:50%;transform:translateY(-50%);
  background:rgba(255,255,255,0.25);color:#fff;border:0;border-radius:50%;
  width:42px;height:42px;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
#gal-prev{left:-10px}#gal-next{right:-10px}
#gal-close{position:absolute;top:20px;right:20px;background:rgba(255,255,255,0.2);color:#fff;border:0;border-radius:50%;width:38px;height:38px;cursor:pointer}
#gal-caption{color:#fff;font-size:13.5px;margin-top:12px;text-align:center}
.act-thumb{width:80px;height:80px;border-radius:12px;object-fit:cover;cursor:pointer;border:1px solid var(--ln);flex:none}
</style>
</head>
<body>

<div id="map"></div>

<!-- Top Bar -->
<div id="top">
  <div id="brandrow">
    <button id="brand" class="glass" aria-label="Changer de voyage">
      <span class="nm">Voyage</span>
      <svg width="14" height="14" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </button>
    <div class="top-actions">
      <button id="filtertoggle" class="glass" aria-label="Filtres">
        <svg width="15" height="15" viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
        <span>Filtres</span>
      </button>
      <button class="btn-icon" id="settingsbtn" aria-label="Paramètres">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
      <button class="btn-icon" id="undo" aria-label="Annuler" disabled>
        <svg viewBox="0 0 24 24"><polyline points="9 14 4 9 9 4"></polyline><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path></svg>
      </button>
    </div>
  </div>
  <div id="filterbox" class="collapsed">
    <div class="row" id="flt"></div>
    <div class="row" id="tg"></div>
  </div>
</div>

<!-- Boutons flottants côte à côte -->
<div id="floating-actions">
  <button class="fab sub" id="recenter-map" aria-label="Recentrer la carte">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"></circle><line x1="12" y1="2" x2="12" y2="5"></line><line x1="12" y1="19" x2="12" y2="22"></line><line x1="2" y1="12" x2="5" y2="12"></line><line x1="19" y1="12" x2="22" y2="12"></line></svg>
  </button>
  <button class="fab main" id="new" aria-label="Ajouter un lieu">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
  </button>
</div>

<button class="btn s glass" id="unp" style="display:none"></button>

<!-- Dock carte -->
<div id="dock" class="glass">
  <div id="days"></div>
  <div id="tl"></div>
</div>

<!-- Panneaux d'onglets -->
<div class="pane" id="plan"></div>
<div class="pane" id="list"></div>
<div class="pane" id="discover"></div>
<div class="pane" id="info"></div>
<div class="pane" id="ai"></div>

<!-- Accueil / Premier voyage -->
<div class="pane" id="welcome">
  <div style="text-align:center;padding:40px 10px">
    <h2>Trip Planner</h2>
    <p style="color:var(--mu);margin-bottom:24px">Organisez vos journées, vos réservations et vos visites sur une carte interactive.</p>
    <button class="btn" data-newtrip>Créer mon premier voyage</button>
    <div style="margin-top:14px">
      <label class="btn s"><input type="file" data-imp accept="application/json" hidden>Importer une sauvegarde</label>
    </div>
  </div>
</div>

<!-- Bottom Navigation Bar -->
<div id="nav" class="glass">
  <button data-t="map" class="on">

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(()=>{'use strict';

/* --- ICÔNES SVG --- */
const ICONS = {
  v: '<svg viewBox="0 0 24 24"><path d="M4 10h16M2 10l10-7 10 7M6 10v9M10 10v9M14 10v9M18 10v9M3 19h18"></path></svg>',
  a: '<svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>',
  f: '<svg viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8zM6 1v3M10 1v3M14 1v3"></path></svg>',
  n: '<svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>',
  map: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"></circle><line x1="12" y1="2" x2="12" y2="5"></line><line x1="12" y1="19" x2="12" y2="22"></line><line x1="2" y1="12" x2="5" y2="12"></line><line x1="19" y1="12" x2="22" y2="12"></line></svg>',
  trash: '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>',
  up: '<svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"></polyline></svg>',
  down: '<svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>',
  more: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>',
  chevron: '<svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>',
  plus: '<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>',
  note: '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>',
  close: '<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>'
};

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const K = 'tripkit_v1', KT = 'tripkit_theme', MAXD = 60;
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const CT = {v:'Visite',a:'Activité',f:'Food',n:'Sortie'};
const COL = {v:'#0284c7',a:'#f97316',f:'#8b5cf6',n:'#ec4899'};
const SLOTS = {m:'Matin',a:'Après-midi',s:'Coucher de soleil',e:'Soirée'};

const tm = t => {const[a,b]=t.split(':');return+a*60+ +b};
const mt = m => String(Math.floor(Math.max(0,Math.min(1439,m))/60)).padStart(2,'0')+':'+String(Math.max(0,Math.min(1439,m))%60).padStart(2,'0');
const pISO = s => {const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const toISO = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays = (d,n) => new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const fmtD = d => d.getDate()+' '+['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'][d.getMonth()];
const fmtMin = m => m<60?m+' min':Math.floor(m/60)+' h'+(m%60?' '+String(m%60).padStart(2,'0'):'');
const fmtKm = k => k<1?Math.round(k*1000)+' m':k.toFixed(1).replace('.',',')+' km';
const byT = (a,b) => a.t.localeCompare(b.t);

/* --- Thème & Apparence --- */
let themePref = 'light';
try { themePref = localStorage.getItem(KT) || 'light'; } catch(e){}
const resolved = () => themePref === 'auto' ? (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : themePref;
function applyTheme(){
  const r = resolved();
  document.documentElement.dataset.theme = r;
  const m = $('meta[name=theme-color]');
  if(m) m.content = r === 'dark' ? '#0f172a' : '#f4f6fa';
}
function setTheme(p){
  themePref = p;
  try { localStorage.setItem(KT, p); } catch(e){}
  applyTheme();
}

/* --- Modèle et données --- */
const X = (n,c='v',s='',o={}) => Object.assign({id:uid(),n,c,s:Array.isArray(s)?s:String(s).split('').filter(Boolean),lat:null,lng:null,price:null,hrs:null,note:null,src:'Saisie manuelle',maps:null,rate:0,fav:false,d:90},o);
const mkCal = (name,n) => ({id:uid(),name,days:Array.from({length:n},()=>({hotel:'',items:[]}))});
function mkTrip(o){
  const t = {id:o.id||uid(),name:o.name,dest:o.dest||o.name,start:o.start,n:o.n,center:o.center||null,zoom:o.zoom||12,acts:[],cals:[],cur:'',notes:[],money:o.money||'€',budget:null,people:[],exp:[],res:[],lists:[]};
  const c = mkCal('Planning principal', t.n);
  t.cals.push(c);t.cur = c.id;return t;
}

function norm(t){
  if(!t||typeof t!=='object')return null;
  t.id=t.id||uid();t.name=String(t.name||'Voyage');t.dest=t.dest||t.name;
  if(!pISO(t.start))t.start=toISO(new Date());
  t.acts=Array.isArray(t.acts)?t.acts:[];
  t.notes=Array.isArray(t.notes)?t.notes:[];
  t.cals=Array.isArray(t.cals)?t.cals:[];
  let n=Math.round(+t.n);if(!(n>=1))n=Math.max(1,...t.cals.map(c=>c.days?c.days.length:0));t.n=Math.min(MAXD,n);
  t.money=String(t.money||'€').slice(0,6);
  t.people=Array.isArray(t.people)?t.people:[];
  t.exp=Array.isArray(t.exp)?t.exp:[];
  t.res=Array.isArray(t.res)?t.res:[];
  t.lists=Array.isArray(t.lists)?t.lists:[];
  if(!t.cals.length)t.cals.push(mkCal('Planning principal',t.n));
  t.cals.forEach(c=>{
    while(c.days.length<t.n)c.days.push({hotel:'',items:[]});
    c.days=c.days.slice(0,t.n);
  });
  if(!t.cals.some(c=>c.id===t.cur))t.cur=t.cals[0].id;
  return t;
}

function loadDB(){
  let raw=null;try{raw=localStorage.getItem(K)}catch(e){}
  if(raw){
    try{
      const j=JSON.parse(raw);
      if(j&&Array.isArray(j.trips)){
        j.trips=j.trips.map(norm).filter(Boolean);
        if(!j.trips.some(t=>t.id===j.cur))j.cur=j.trips[0]?j.trips[0].id:'';
        return{db:j};
      }
    }catch(e){}
  }
  return{db:{v:2,trips:[],cur:''}};
}

let DB, S = null, undo = [], day = 0;
let fs = new Set(), fc = new Set(), hideO = false, hideU = false, placing = null;
let map, layer, PTS = [], tabNow = 'map';
let filterOpen = false;
let discEngine = 'wiki', discType = 'all', discList = [], discLoading = false;
let openDays = new Set();

const curTrip = () => DB.trips.find(t=>t.id===DB.cur) || null;
const cal = () => S.cals.find(c=>c.id===S.cur) || S.cals[0];
const get = id => S.acts.find(a=>a.id===id);
const dayO = () => {const c=cal();return c.days[Math.min(day,c.days.length-1)]};
const dayDate = i => addDays(pISO(S.start)||new Date(), i);
const dl = i => {
  const d = dayDate(i);
  return ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'][d.getDay()]+' '+d.getDate()+' '+['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'][d.getMonth()];
};

function toast(tText){
  const e=$('#toast');e.textContent=tText;e.classList.add('on');
  clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2300);
}
function save(){try{localStorage.setItem(K,JSON.stringify(DB))}catch(e){toast('Sauvegarde locale impossible')}}
const snap = () => JSON.stringify(S);
function restore(js){const tTrip=norm(JSON.parse(js)),i=DB.trips.findIndex(x=>x.id===tTrip.id);if(i>=0){DB.trips[i]=tTrip;S=tTrip}}
function mut(fn){undo.push(snap());if(undo.length>25)undo.shift();fn();save();refresh()}

const used = () => new Set(cal().days.flatMap(d=>d.items.filter(i=>i.aid).map(i=>i.aid)));
const ok = a => (!fs.size||a.s.some(x=>fs.has(x)))&&(!fc.size||fc.has(a.c));
const vis = a => {
  if(!ok(a))return false;
  const inD=dayO().items.some(i=>i.aid===a.id);
  if(hideO&&!inD&&used().has(a.id))return false;
  if(hideU&&!inD)return false;
  return true;
};
const unp = () => S.acts.filter(a=>a.lat==null&&vis(a));

/* --- Géolocalisation & distances --- */
function hav(a,b){if(!a||!b||a.lat==null||b.lat==null)return null;const r=x=>x*Math.PI/180,p=r(b.lat-a.lat),q=r(b.lng-a.lng),h=Math.sin(p/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(q/2)**2;return 12742*Math.asin(Math.sqrt(h))}
function leg(a,b){const d=hav(a,b);if(d==null)return null;const km=d*1.3,w=km<=1.5,min=Math.max(1,Math.round(km/(w?4.8:25)*60));return{km,min,w}}
const legTxt = l => (l.w?'À pied ':'En voiture ')+fmtMin(l.min)+' · '+fmtKm(l.km);

async function geocode(q, lim=5){
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit='+lim+'&accept-language=fr&q='+encodeURIComponent(q));
  if(!r.ok)return[];const j=await r.json();
  return j.map(x=>({lat:+(+x.lat).toFixed(6),lng:+(+x.lon).toFixed(6),short:x.name||String(x.display_name||'').split(',')[0],name:x.display_name||''}));
}

/* --- Navigation & Barres --- */
function bars(){
  if(!S)return;
  const c=cal();
  $('#brand span.nm').textContent = S.name;
  $('#undo').disabled = !undo.length;

  $('#days').innerHTML = c.days.map((d,i)=>{
    const tDate = dayDate(i);
    return `<button class="dt ${i===day?'on':''}" data-day="${i}">
      <small>${['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'][tDate.getDay()]}</small>
      <b>${tDate.getDate()}</b>
      <small class="mo">${['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'][tDate.getMonth()]}</small>
      ${d.items.length?'<i></i>':''}
    </button>`;
  }).join('');

  $('#flt').innerHTML = Object.entries(SLOTS).map(([k,v])=>`<button class="chip ${fs.has(k)?'on':''}" data-s="${k}">${v}</button>`).join('')+
    Object.entries(CT).map(([k,v])=>`<button class="chip ${fc.has(k)?'on':''}" data-c="${k}">${ICONS[k]||''} ${v}</button>`).join('');

  $('#tg').innerHTML = `<button class="chip ${hideO?'on':''}" data-tg="o">Masquer déjà prévues</button><button class="chip ${hideU?'on':''}" data-tg="u">Masquer sans position</button>`;
  
  const btnFilt=$('#filtertoggle');
  if(btnFilt)btnFilt.classList.toggle('on',filterOpen||fs.size>0||fc.size>0||hideO||hideU);
  const boxFilt=$('#filterbox');
  if(boxFilt)boxFilt.classList.toggle('collapsed',!filterOpen);

  renderTL();
  const n = unp().length;
  $('#unp').style.display = n && tabNow==='map' ? '' : 'none';
  $('#unp').textContent = n + ' sans position';
}

function dayEntries(i){
  const d=cal().days[i],out=[];if(!d)return out;
  d.items.forEach(it=>{if(it.aid){const a=get(it.aid);if(a)out.push({k:'act',it,a,t:it.t})}else if(typeof it.note==='string')out.push({k:'note',it,t:it.t})});
  out.sort(byT);
  let prev=null;
  out.forEach(e=>{if(e.k==='act'){if(prev)e.leg=leg(prev.a,e.a);prev=e}});
  return out;
}

function renderTL(){
  const es = dayEntries(Math.min(day,S.n-1));
  $('#tl').innerHTML = es.length ? es.map(e=>{
    if(e.k==='act') return `<div class="tk" data-open="${e.a.id}" style="--c:${COL[e.a.c]}">
      <button class="tk-rm-btn" data-rmitem="${e.it.id}" title="Retirer">${ICONS.close}</button>
      <small>${e.t}</small>
      <b>${esc(e.a.n)}</b>
      <small>${e.leg ? legTxt(e.leg) : (CT[e.a.c]||e.a.c)}</small>
    </div>`;
    return `<div class="tk" data-item="${e.it.id}" style="--c:var(--gold)">
      <button class="tk-rm-btn" data-rmitem="${e.it.id}" title="Retirer">${ICONS.close}</button>
      <small>${e.t}</small>
      <b>${esc(e.it.note)}</b>
    </div>`;
  }).join('') : `<div class="tk ghost">Aucune visite prévue pour ce jour.</div>`;
}

/* --- Carte Leaflet --- */
function initMap(){
  map = L.map('map',{zoomControl:false}).setView([20,0],2);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);
  layer = L.layerGroup().addTo(map);

  map.on('click',e=>{
    if(!placing||!S)return;
    const a=get(placing);
    if(!a){placing=null;return;}
    mut(()=>{a.lat=+e.latlng.lat.toFixed(6);a.lng=+e.latlng.lng.toFixed(6)});
    placing=null;toast('Emplacement enregistré');
    drawMap();
  });
}

function drawMap(){
  if(!layer||!S)return;
  layer.clearLayers();PTS=[];
  const u=used(),route=[],es=dayEntries(Math.min(day,S.n-1)).filter(e=>e.k==='act');

  S.acts.filter(a=>a.lat!=null&&vis(a)).forEach(a=>{
    const n = es.findIndex(e=>e.a.id===a.id)+1;
    const other = u.has(a.id)&&!n;
    const icon = L.divIcon({
      className:'',iconSize:[36,36],iconAnchor:[18,18],
      html:`<div class="pin" id="pin-${a.id}" style="--c:${COL[a.c]};opacity:${other?0.45:1}">
        ${ICONS[a.c]||ICONS.v}
        ${n?`<em>${n}</em>`:other?'<em>✓</em>':''}
      </div>`
    });
    L.marker([a.lat,a.lng],{icon}).addTo(layer).on('click',()=>actSheet(a.id));
    PTS.push([a.lat,a.lng]);
  });

  es.forEach(e=>{if(e.a.lat!=null)route.push([e.a.lat,e.a.lng])});
  if(route.length>1)L.polyline(route,{color:'#f97316',weight:4,dashArray:'3 8',lineCap:'round'}).addTo(layer);
}

function fitMap(){
  if(!map)return;
  if(PTS.length) map.fitBounds(PTS,{padding:[60,60],maxZoom:14});
  else if(S.center) map.setView(S.center,S.zoom||12);
  else map.setView([20,0],2);
}

function focusPlaceOnMap(id){
  const a = get(id);
  if(!a||a.lat==null||a.lng==null){toast('Ce lieu n’est pas encore positionné');return;}
  tab('map');
  map.flyTo([a.lat,a.lng],15,{duration:1});
  setTimeout(()=>{
    const pinEl = document.getElementById('pin-'+a.id);
    if(pinEl){
      const b = document.createElement('div');
      b.className = 'pin-beacon';
      pinEl.appendChild(b);
      setTimeout(()=>b.remove(),3500);
    }
  },800);
}

/* --- Modales Bottom Sheet --- */
function sheet(title, bodyHtml){
  $('#sheet').innerHTML = `<div>
    <div class="sheet-top">
      <h2>${esc(title)}</h2>
      <button class="sheet-close-btn" data-close>${ICONS.close}</button>
    </div>
    ${bodyHtml}
  </div>`;
  $('#sheet').classList.add('on');
}
const close = () => $('#sheet').classList.remove('on');

function actSheet(id){
  const a = get(id);if(!a)return;
  const inD = dayO().items.some(i=>i.aid===id);
  const gmUrl = `https://www.google.com/maps/search/?api=1&query=${a.lat!=null?a.lat+','+a.lng:encodeURIComponent(a.n)}`;

  sheet(a.n, `
    <div class="row" style="margin-bottom:10px">
      <span class="chip on">${CT[a.c]||a.c}</span>
      ${a.s.map(x=>`<span class="chip">${SLOTS[x]||x}</span>`).join('')}
    </div>
    <div class="stars">${[1,2,3,4,5].map(n=>`<button class="${n<=a.rate?'on':''}" data-rate="${id}\vert{}${n}">★</button>`).join('')}</div>
    ${a.price?`<p>Tarif : ${esc(a.price)}</p>`:''}
    ${a.hrs?`<p>Horaires : ${esc(a.hrs)}</p>`:''}
    ${a.note?`<p style="background:var(--sf2);padding:10px;border-radius:10px">${esc(a.note)}</p>`:''}
    
    <div class="row wrap" style="margin-top:16px">
      <button class="btn ${inD?'r':'g'}" data-${inD?'rmday':'add'}="${id}">${inD?'Retirer du jour':'Ajouter au jour'}</button>
      <button class="btn s" data-focusmap="${id}">Sur la carte</button>
      <a class="btn s" target="_blank" rel="noopener" href="${esc(gmUrl)}">Itinéraire</a>
      <button class="btn s" data-edit="${id}">Modifier</button>
    </div>
  `);
}

function addPlaceSheet(){
  sheet('Ajouter un lieu', `
    <input id="sq" placeholder="Rechercher une visite, un restaurant…" autocomplete="off">
    <div id="sst" style="font-size:13px;color:var(--mu);margin-bottom:8px">Tapez au moins 3 lettres pour chercher autour de la destination.</div>
    <div id="sres"></div>
    <div class="row wrap" style="margin-top:10px">
      <button class="btn s" data-addman>Saisie manuelle</button>
    </div>
  `);
  setTimeout(()=>{const q=$('#sq');if(q)q.focus()},300);
}

function editSheet(id){
  const a = id ? get(id) : X('','v','');
  sheet(id ? 'Modifier le lieu' : 'Nouveau lieu', `
    <input id="en" placeholder="Nom du lieu" value="${esc(a.n)}">
    <select id="ec">
      ${Object.entries(CT).map(([k,v])=>`<option value="${k}" ${k===a.c?'selected':''}>${v}</option>`).join('')}
    </select>
    <div class="row" style="padding-bottom:8px">
      ${Object.entries(SLOTS).map(([k,v])=>`<label class="chip"><input type="checkbox" class="es" value="${k}" ${a.s.includes(k)?'checked':''}>${v}</label>`).join('')}
    </div>
    <input id="ell" placeholder="Coordonnées GPS : lat, lng" value="${a.lat!=null?a.lat+', '+a.lng:''}">
    <input id="edu" type="number" placeholder="Durée conseillée (minutes)" value="${a.d||''}">
    <input id="epr" placeholder="Tarif indicatif" value="${esc(a.price||'')}">
    <input id="eho" placeholder="Horaires" value="${esc(a.hrs||'')}">
    <textarea id="eno" rows="3" placeholder="Notes personnelles">${esc(a.note||'')}</textarea>

    <div class="row wrap">
      <button class="btn" data-save="${id||''}">Enregistrer</button>
      <button class="btn s" data-place="${id||''}">Placer sur la carte</button>
      ${id?`<button class="btn r" data-del="${id}">Supprimer</button>`:''}
    </div>
  `);
}

function settingsSheet(){
  sheet('Paramètres & Apparence', `
    <h3>Thème</h3>
    <div class="seg" style="margin-bottom:16px">
      <button class="${themePref==='light'?'on':''}" data-settheme="light">Clair</button>
      <button class="${themePref==='dark'?'on':''}" data-settheme="dark">Sombre</button>
      <button class="${themePref==='auto'?'on':''}" data-settheme="auto">Auto</button>
    </div>
    <h3>Sauvegardes</h3>
    <div class="row wrap">
      <button class="btn s" data-export="one">Exporter ce voyage</button>
      <button class="btn s" data-export="all">Tout exporter</button>
      <label class="btn s"><input type="file" data-imp accept="application/json" hidden>Restaurer</label>
    </div>
  `);
}

function tripsSheet(){
  sheet('Mes voyages', `
    ${DB.trips.map(tItem=>`<div class="card" data-trip="${tItem.id}">
      <div class="nm"><b>${esc(tItem.name)}</b><small>${esc(tItem.dest)} · ${tItem.n} jours</small></div>${tItem.id===DB.cur?'<span>✓</span>':''}
    </div>`).join('')}
    <button class="btn" data-newtrip style="width:100%;margin-top:10px">Nouveau voyage</button>
  `);
}

function tripForm(id){
  const tTrip = id ? DB.trips.find(x=>x.id===id) : null;
  const end = tTrip ? toISO(addDays(pISO(tTrip.start),tTrip.n-1)) : '';
  sheet(tTrip ? 'Modifier le voyage' : 'Nouveau voyage', `
    <input id="tn" placeholder="Nom du séjour" value="${esc(tTrip?tTrip.name:'')}">
    <input id="td" placeholder="Destination (ville, pays)" value="${esc(tTrip?tTrip.dest:'')}">
    <div class="two">
      <div><label style="font-size:12px;color:var(--mu)">Début</label><input id="ts" type="date" value="${tTrip?tTrip.start:''}"></div>
      <div><label style="font-size:12px;color:var(--mu)">Fin</label><input id="te" type="date" value="${end}"></div>
    </div>
    <input id="tc" placeholder="Devise (€, $, CHF)" maxlength="6" value="${esc(tTrip?tTrip.money:'€')}">
    <div class="row">
      <button class="btn" data-savetrip="${id||''}">Enregistrer</button>
    </div>
  `);
}

async function saveTrip(id){
  const name=$('#tn').value.trim(), dest=$('#td').value.trim()||name;
  const a=pISO($('#ts').value), b=pISO($('#te').value);
  if(!name||!a||!b){toast('Remplissez tous les champs obligatoires');return;}
  const n = Math.round((b-a)/864e5)+1;
  if(n<1||n>MAXD){toast('Dates invalides (max 60 jours)');return;}
  const money=$('#tc').value.trim()||'€';

  if(id){
    const tTrip=DB.trips.find(x=>x.id===id);
    mut(()=>{
      tTrip.name=name;tTrip.dest=dest;tTrip.start=toISO(a);tTrip.money=money;
      tTrip.n=n;
    });
    close();bars();toast('Voyage mis à jour');
  } else {
    toast('Création...');
    const tTrip = mkTrip({name,dest,start:toISO(a),n,money});
    try{
      const rs=await geocode(dest,1);
      if(rs[0])tTrip.center=[rs[0].lat,rs[0].lng];
    }catch(e){}
    DB.trips.push(tTrip);
    close();
    setTrip(tTrip.id);
  }
}

function setTrip(id){
  DB.cur=id;S=curTrip();undo=[];day=0;openDays=new Set();
  save();show();
}

function show(){
  $('#welcome').classList.toggle('on',!S);
  if(!S)return;
  bars();tab('map');
  setTimeout(()=>{fitMap();drawMap()},120);
}

/* --- Planning (Accordéons fermés par défaut) --- */
function renderPlan(){
  const c = cal();
  $('#plan').innerHTML = `
    <h2>Planning</h2>
    <div class="row" style="padding-bottom:12px">
      ${S.cals.map(x=>`<button class="chip ${x.id===c.id?'on':''}" data-cal="${x.id}">${esc(x.name)}</button>`).join('')}
    </div>
    ${c.days.map((d,i)=>{
      const es = dayEntries(i);
      const isOpen = openDays.has(i);
      const totalKm = es.filter(e=>e.leg).reduce((s,e)=>s+e.leg.km,0);
      const summary = `${es.length} étape${es.length>1?'s':''}${totalKm>0?' · ≈ '+fmtKm(totalKm):''}`;

      return `<div class="day-acc ${isOpen?'open':''}" data-dayacc="${i}">
        <div class="day-header" data-toggleacc="${i}">
          <div class="day-header-info">
            <b>${dl(i)}</b>
            <small>${summary}</small>
          </div>
          <div class="day-chevron">${ICONS.chevron}</div>
        </div>
        <div class="day-body">
          <input data-hotel="${i}" value="${esc(d.hotel)}" placeholder="Où logez-vous ce soir ?" style="margin-top:10px">
          ${es.map(e=>{
            if(e.k==='note') {
              return `<div class="plan-card">
                <div class="plan-card-top">
                  <div class="plan-time-wrap">
                    <input type="time" value="${e.it.t}" data-time="${e.it.id}">
                  </div>
                  <div class="plan-actions">
                    <button class="btn s ic" data-mv="${e.it.id}|-1" title="Monter">${ICONS.up}</button>
                    <button class="btn s ic" data-mv="${e.it.id}|1" title="Descendre">${ICONS.down}</button>
                    <button class="btn r ic" data-rmitem="${e.it.id}" title="Supprimer">${ICONS.trash}</button>
                  </div>
                </div>
                <div class="plan-card-title">${esc(e.it.note)}</div>
              </div>`;
            }
            return `<div class="plan-card">
              <div class="plan-card-top">
                <div class="plan-time-wrap">
                  <span class="dot" style="background:${COL[e.a.c]}"></span>
                  <input type="time" value="${e.it.t}" data-time="${e.it.id}">
                </div>
                <div class="plan-actions">
                  <button class="btn s ic" data-mv="${e.it.id}|-1" title="Monter">${ICONS.up}</button>
                  <button class="btn s ic" data-mv="${e.it.id}|1" title="Descendre">${ICONS.down}</button>
                  <button class="btn s ic" data-focusmap="${e.a.id}" title="Sur la carte">${ICONS.map}</button>
                  <button class="btn s ic" data-open="${e.a.id}" title="Fiche">${ICONS.more}</button>
                  <button class="btn r ic" data-rmitem="${e.it.id}" title="Retirer du jour">${ICONS.trash}</button>
                </div>
              </div>
              <div class="plan-card-title">${esc(e.a.n)}</div>
              <div class="plan-card-sub">${CT[e.a.c]||e.a.c}${e.a.d?' · '+fmtMin(e.a.d):''}</div>
            </div>`;
          }).join('') || '<div class="empty">Journée libre.</div>'}
          <div class="row" style="margin-top:8px">
            <button class="btn s sm" data-addnote="${i}">${ICONS.note} Note</button>
            <button class="btn s sm" data-day="${i}" data-go>${ICONS.map} Voir le jour sur la carte</button>
          </div>
        </div>
      </div>`;
    }).join('')}
  `;
}

/* --- Lieux (Ouverture directe au clic, sans "...") --- */
function renderList(){
  $('#list').innerHTML = `
    <h2>Mes adresses</h2>
    <div class="row wrap" style="margin-bottom:12px">
      <button class="btn sm" data-newact>Ajouter un lieu</button>
    </div>
    ${S.acts.map(a=>`
      <div class="card" data-open="${a.id}">
        <span class="dot" style="background:${COL[a.c]}"></span>
        <div class="nm">
          <b>${esc(a.n)}</b>
          <small>${CT[a.c]\vert{}\vert{}a.c}${a.lat==null?' · À positionner':''}</small>
        </div>
        ${a.lat!=null ? `<button class="btn s ic" data-focusmap="${a.id}" title="Voir sur la carte">${ICONS.map}</button>` : ''}
      </div>
    `).join('') || '<div class="empty">Aucun lieu enregistré.</div>'}
  `;
}

/* --- Explorer --- */
async function loadDiscover(){
  if(discList.length||discLoading)return;
  discLoading=true;
  $('#discover').innerHTML = '<h2>Explorer</h2><div class="empty">Recherche des meilleures idées...</div>';
  try{
    const r=await fetch(`https://fr.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(S.dest)}&gsrlimit=18&prop=coordinates|extracts|pageimages&piprop=thumbnail&pithumbsize=400&exintro=1&explaintext=1&format=json&origin=*`);
    if(r.ok){
      const j=await r.json();
      const pages=Object.values((j.query&&j.query.pages)||{});
      discList = pages.filter(p=>p.coordinates&&p.coordinates[0]).map(p=>({
        name:p.title,
        desc:p.extract||'',
        lat:+p.coordinates[0].lat.toFixed(6),
        lng:+p.coordinates[0].lon.toFixed(6),
        thumb:p.thumbnail?p.thumbnail.source:null,
        cat:'v'
      }));
    }
  }catch(e){}
  discLoading=false;
  renderDiscover();
}

function renderDiscover(){
  $('#discover').innerHTML = `
    <h2>Explorer ${esc(S.dest)}</h2>
    ${discList.map((item,i)=>`
      <div class="card blk" style="margin-bottom:12px">
        <div style="display:flex;gap:12px;align-items:flex-start">
          ${item.thumb?`<img class="act-thumb" src="${esc(item.thumb)}" data-opnegal="${i}">`:''}
          <div style="flex:1;min-width:0">
            <b>${esc(item.name)}</b>
            <p style="font-size:12.5px;color:var(--mu);margin:4px 0 0;line-height:1.3">${esc(item.desc.slice(0,160))}...</p>
          </div>
        </div>
        <div class="row" style="margin-top:10px;justify-content:flex-end">
          <button class="btn s sm" data-adddisc="${i}">Ajouter à mes lieux</button>
        </div>
      </div>
    `).join('') || '<div class="empty">Aucune idée trouvée pour cette destination.</div>'}
  `;
}

/* --- Voyage & Assistant --- */
function renderInfo(){
  $('#info').innerHTML = `
    <h2>Mon Voyage</h2>
    <div class="card blk">
      <b>${esc(S.name)}</b>
      <small>${esc(S.dest)} · ${S.n} jours</small>
      <div class="row" style="margin-top:10px">
        <button class="btn s sm" data-edittrip>Modifier</button>
        <button class="btn s sm" data-trips>Tous mes voyages</button>
      </div>
    </div>
  `;
}
function renderAI(){
  $('#ai').innerHTML = `
    <h2>Assistant</h2>
    <div style="background:var(--sf);border:1px solid var(--ln);padding:14px;border-radius:14px">
      Bonjour ! Je peux vous aider à organiser vos journées, trouver des adresses ou équilibrer vos trajets.
    </div>
  `;
}

/* --- Gestion des onglets --- */
function tab(tName){
  tabNow = tName;
  $('#dock').classList.toggle('hide',tName!=='map');
  $('#top').style.display = tName==='map' ? '' : 'none';
  $('#floating-actions').style.display = tName==='map' ? 'flex' : 'none';   $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tName));
  ['plan','list','discover','info','ai'].forEach(p=>$('#'+p).classList.toggle('on',p===tName));

  if(tName==='map'){setTimeout(()=>{map.invalidateSize();drawMap()},60)}
  if(tName==='plan') renderPlan();
  if(tName==='list') renderList();
  if(tName==='discover') loadDiscover();
  if(tName==='info') renderInfo();
  if(tName==='ai') renderAI();
}

function refresh(){
  if(!S)return;
  bars();drawMap();
  if(tabNow==='plan')renderPlan();
  if(tabNow==='list')renderList();
}

/* --- Événements globaux & Clics --- */
document.addEventListener('click',e=>{
  const tEl = e.target.closest('button, [data-open], [data-trip], [data-toggleacc], [data-focusmap], [data-rmitem], [data-opnegal], #sheet');
  if(!tEl)return;
  const d = tEl.dataset;

  if(tEl.id==='sheet' && e.target===tEl){close();return;}
  if('close' in d){close();return;}
  if(tEl.id==='brand'){tripsSheet();return;}
  if(tEl.id==='settingsbtn'){settingsSheet();return;}
  if(tEl.id==='filtertoggle'){filterOpen=!filterOpen;bars();return;}
  if(tEl.id==='recenter-map'){fitMap();toast('Carte recentrée');return;}
  if(tEl.id==='new'){addPlaceSheet();return;}
  if(tEl.id==='undo'){if(undo.length){restore(undo.pop());save();refresh()}return;}

  if('toggleacc' in d){
    const i = +d.toggleacc;
    if(openDays.has(i)) openDays.delete(i);
    else openDays.add(i);
    renderPlan();
    return;
  }

  if(d.focusmap){
    close();
    focusPlaceOnMap(d.focusmap);
    return;
  }

  if(d.rmitem){
    mut(()=>{
      cal().days.forEach(dayObj=>{
        dayObj.items = dayObj.items.filter(x=>x.id!==d.rmitem);
      });
    });
    toast('Élément retiré');
    return;
  }

  if(d.settheme){setTheme(d.settheme);settingsSheet();return;}
  if(d.t){tab(d.t);return;}
  if('newtrip' in d){tripForm();return;}
  if('trips' in d){tripsSheet();return;}
  if(d.trip){setTrip(d.trip);close();return;}
  if(d.savetrip!==undefined){saveTrip(d.savetrip);return;}
  if('edittrip' in d){tripForm(S.id);return;}

  if(d.s){fs.has(d.s)?fs.delete(d.s):fs.add(d.s);bars();drawMap();return;}
  if(d.c){fc.has(d.c)?fc.delete(d.c):fc.add(d.c);bars();drawMap();return;}
  if(d.tg){if(d.tg==='o')hideO=!hideO;else hideU=!hideU;bars();drawMap();return;}

  if(d.day!==undefined){
    day=Math.min(+d.day,S.n-1);
    bars();drawMap();
    if('go' in d)tab('map');
    return;
  }

  if(d.open){actSheet(d.open);return;}
  if(d.edit){editSheet(d.edit);return;}
  if('newact' in d){editSheet();return;}
  if('addman' in d){editSheet();return;}
  if(d.rate){const[id,r]=d.rate.split('|');mut(()=>{get(id).rate=+r});actSheet(id);return;}

  if(d.save!==undefined){
    const n=$('#en').value.trim();
    if(!n){toast('Nom obligatoire');return;}
    let lat=null,lng=null;
    const ll=$('#ell').value.trim();
    if(ll){const pt=ll.split(',').map(Number);if(pt.length===2&&!isNaN(pt[0])){lat=pt[0];lng=pt[1]}}
    const o = {
      n,c:$('#ec').value,s:$$('.es:checked').map(x=>x.value),
      lat,lng,d:parseInt($('#edu').value,10)\vert{}\vert{}90,price:$('#epr').value.trim()||null,
      hrs:$('#eho').value.trim()\vert{}\vert{}null,note:$('#eno').value.trim()||null
    };
    mut(()=>{
      if(d.save){Object.assign(get(d.save),o)}
      else{S.acts.push(X(o.n,o.c,o.s,o))}
    });
    close();toast('Enregistré');
    return;
  }

  if(d.add){
    const a=get(d.add);
    mut(()=>{
      dayO().items.push({id:uid(),aid:a.id,t:'10:00'});
    });
    close();toast('Ajouté à la journée');
    return;
  }
  if(d.rmday){
    mut(()=>{
      dayO().items = dayO().items.filter(i=>i.aid!==d.rmday);
    });
    close();toast('Retiré de la journée');
    return;
  }

  if(d.place!==undefined){
    placing = d.place;
    close();tab('map');
    toast('Touchez la carte à l’endroit souhaité');
    return;
  }

  if(d.del){
    if(confirm('Supprimer ce lieu ?')){
      mut(()=>{
        S.acts=S.acts.filter(a=>a.id!==d.del);
        S.cals.forEach(c=>c.days.forEach(dayObj=>{dayObj.items=dayObj.items.filter(i=>i.aid!==d.del)}));
      });
      close();
    }
    return;
  }

  if(d.mv){
    const[id,dir]=d.mv.split('|');
    const items = dayO().items;
    const idx = items.findIndex(x=>x.id===id);
    const nIdx = idx + (+dir);
    if(nIdx>=0 && nIdx<items.length){
      mut(()=>{
        const tmp = items[idx];
        items[idx] = items[nIdx];
        items[nIdx] = tmp;
      });
    }
    return;
  }

  if(d.adddisc!==undefined){
    const it = discList[+d.adddisc];
    mut(()=>{
      S.acts.push(X(it.name,it.cat,'',{lat:it.lat,lng:it.lng,note:it.desc}));
    });
    toast('Lieu enregistré');
    return;
  }

  if(d.addnote!==undefined){
    const txt = prompt('Texte de la note :');
    if(txt&&txt.trim()){
      mut(()=>{cal().days[+d.addnote].items.push({id:uid(),note:txt.trim(),t:'09:00'})});
    }
    return;
  }

  if(d.export){
    const data = d.export==='all' ? DB : S;
    const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (d.export==='all'?'tous-mes-voyages':S.name)+'.json';
    a.click();
    return;
  }
});

document.addEventListener('change',e=>{
  const tEl=e.target,d=tEl.dataset;
  if(d.time&&S){
    mut(()=>{
      cal().days.forEach(dayObj=>{
        const it = dayObj.items.find(x=>x.id===d.time);
        if(it) it.t = tEl.value;
      });
    });
  } else if(d.hotel!==undefined&&S){
    mut(()=>{cal().days[+d.hotel].hotel = tEl.value;});
  } else if('imp' in d && tEl.files[0]){
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const j = JSON.parse(reader.result);
        if(j&&Array.isArray(j.trips)){
          DB = j;
          setTrip(DB.trips[0].id);
        } else if(j&&j.id){
          DB.trips.push(norm(j));
          setTrip(j.id);
        }
        toast('Sauvegarde restaurée');
      }catch(err){toast('Fichier invalide');}
    };
    reader.readAsText(tEl.files[0]);
  }
});

let sqTimer;
document.addEventListener('input',e=>{
  if(e.target.id==='sq'){
    clearTimeout(sqTimer);
    const q=e.target.value.trim();
    if(q.length<3)return;
    sqTimer=setTimeout(async()=>{
      $('#sst').textContent='Recherche en cours...';
      const rs=await geocode(q+' '+(S?S.dest:''),5);
      if(!$('#sres'))return;
      $('#sst').textContent=rs.length?'Résultats :':'Aucun résultat.';
      $('#sres').innerHTML=rs.map((r,i)=>`
        <div class="card" style="margin-bottom:8px">
          <div class="nm"><b>${esc(r.short)}</b><small>${esc(r.name)}</small></div>
          <button class="btn s sm" data-pickgeo="${r.lat}|${r.lng}|${esc(r.short)}">Ajouter</button>
        </div>
      `).join('');
    },500);
  }
});

document.addEventListener('click',e=>{
  const b = e.target.closest('[data-pickgeo]');
  if(b){
    const[lat,lng,name]=b.dataset.pickgeo.split('|');
    mut(()=>{
      S.acts.push(X(name,'v','',{lat:+lat,lng:+lng}));
    });
    close();toast('Lieu ajouté');
  }
});

/* --- Démarrage --- */
const boot = loadDB();
DB = boot.db;
S = curTrip();
applyTheme();
initMap();
show();
if(!S) setTimeout(tripForm, 200);

})();
</script>
</body>
</html>
