<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trip Planner">
<meta name="theme-color" content="#f8fafc">
<title>Trip Planner</title>
<script>
try{
  var p=localStorage.getItem('tripkit_theme')||'light';
  if(p==='auto')p=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  document.documentElement.dataset.theme=p;
}catch(e){document.documentElement.dataset.theme='light'}
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root {
  color-scheme: light;
  --bg: #f8fafc;
  --sf: #ffffff;
  --sf-card: #ffffff;
  --sf2: #f1f5f9;
  --sf3: #e2e8f0;
  --tx: #0f172a;
  --tx-muted: #64748b;
  --ln: #e2e8f0;
  --glass: rgba(255, 255, 255, 0.88);
  --glass-border: rgba(226, 232, 240, 0.8);
  --primary: #0284c7;
  --primary-rgb: 2, 132, 199;
  --primary-tx: #ffffff;
  --primary-surface: #e0f2fe;
  --gold: #d97706;
  --ok: #059669;
  --bad: #e11d48;
  --sh-sm: 0 1px 3px rgba(15, 23, 42, 0.04), 0 1px 2px rgba(15, 23, 42, 0.02);
  --sh-md: 0 4px 12px -2px rgba(15, 23, 42, 0.06), 0 2px 6px -1px rgba(15, 23, 42, 0.03);
  --sh-lg: 0 12px 32px -4px rgba(15, 23, 42, 0.12), 0 4px 12px -2px rgba(15, 23, 42, 0.04);
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 22px;
  --radius-xl: 30px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

:root[data-theme=dark] {
  color-scheme: dark;
  --bg: #0b0f19;
  --sf: #131b2e;
  --sf-card: #182239;
  --sf2: #1e2b47;
  --sf3: #2b3a5d;
  --tx: #f8fafc;
  --tx-muted: #94a3b8;
  --ln: #24304c;
  --glass: rgba(19, 27, 46, 0.88);
  --glass-border: rgba(36, 48, 76, 0.8);
  --primary: #38bdf8;
  --primary-rgb: 56, 189, 248;
  --primary-tx: #0b0f19;
  --primary-surface: rgba(56, 189, 248, 0.15);
  --gold: #fbbf24;
  --ok: #34d399;
  --bad: #fb7185;
  --sh-sm: 0 1px 3px rgba(0, 0, 0, 0.25);
  --sh-md: 0 4px 14px rgba(0, 0, 0, 0.4);
  --sh-lg: 0 14px 36px rgba(0, 0, 0, 0.6);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--tx);
  background: var(--bg);
  overflow: hidden;
  letter-spacing: -0.01em;
}
html[dir=rtl] body { direction: rtl; text-align: right; }
button, input, select, textarea { font-family: inherit; }

/* Base utility icons */
.svg-icon {
  width: 18px;
  height: 18px;
  display: inline-block;
  vertical-align: middle;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}
.svg-icon.fill { fill: currentColor; stroke: none; }
.svg-icon-sm { width: 14px; height: 14px; }
.svg-icon-lg { width: 22px; height: 22px; }

#map {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 1;
}
:root[data-theme=dark] .leaflet-tile-pane {
  filter: invert(1) hue-rotate(200deg) brightness(0.92) contrast(0.9) saturate(0.7);
}

.glass-panel {
  background: var(--glass);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid var(--glass-border);
  box-shadow: var(--sh-md);
}

/* Header & Top Filters */
#top {
  position: fixed;
  left: 14px;
  right: 14px;
  top: calc(14px + var(--safe-top));
  z-index: 500;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
#top > * { pointer-events: auto; }

#brandrow {
  display: flex;
  gap: 8px;
  align-items: center;
}
#brand {
  flex: 1;
  min-width: 0;
  border-radius: var(--radius-xl);
  padding: 10px 16px;
  font-weight: 700;
  font-size: 15px;
  color: var(--tx);
  border: 1px solid var(--glass-border);
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  box-shadow: var(--sh-md);
}
#brand .brand-title {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 700;
}
#brand .brand-sub {
  color: var(--tx-muted);
  font-size: 12px;
  font-weight: 500;
  margin-inline-start: 4px;
}

.top-actions {
  display: flex;
  gap: 6px;
  align-items: center;
  flex: none;
}
.icon-btn-header {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid var(--glass-border);
  background: var(--glass);
  color: var(--tx);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: var(--sh-md);
  transition: transform 0.15s ease, background 0.15s ease;
}
.icon-btn-header:active { transform: scale(0.94); }
.icon-btn-header.on {
  background: var(--primary);
  color: var(--primary-tx);
  border-color: transparent;
}
.icon-btn-header:disabled {
  opacity: 0.35;
  cursor: default;
}

#filterbox {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px;
  border-radius: var(--radius-lg);
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
#filterbox.collapsed { display: none; }

.chip {
  flex: none;
  border: 1px solid var(--ln);
  background: var(--sf);
  border-radius: var(--radius-xl);
  padding: 8px 14px;
  font-weight: 600;
  font-size: 13px;
  color: var(--tx);
  transition: all 0.15s ease;
  box-shadow: var(--sh-sm);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.chip:active { transform: scale(0.96); }
.chip.on {
  background: var(--primary);
  color: var(--primary-tx);
  border-color: transparent;
  box-shadow: 0 4px 12px rgba(var(--primary-rgb), 0.35);
}

.sw {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--ln);
  background: var(--sf);
  border-radius: var(--radius-xl);
  padding: 7px 12px 7px 8px;
  font-weight: 600;
  font-size: 12.5px;
  color: var(--tx);
  box-shadow: var(--sh-sm);
  cursor: pointer;
}
.sw i {
  width: 28px;
  height: 16px;
  border-radius: 9px;
  background: var(--sf3);
  position: relative;
  transition: 0.2s;
}
.sw i:after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  transition: 0.2s;
}
.sw.on i { background: var(--primary); }
.sw.on i:after { left: 14px; }

/* Bottom Dock for Map */
#dock {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(64px + var(--safe-bottom));
  z-index: 450;
  border-radius: 24px 24px 0 0;
  padding: 12px 0 4px;
  transition: transform 0.25s ease;
}
#dock.hide { display: none; }

#days {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 0 14px 10px;
  scrollbar-width: none;
}
#days::-webkit-scrollbar { display: none; }
.dt {
  flex: none;
  width: 52px;
  height: 70px;
  border-radius: var(--radius-md);
  border: 1px solid var(--ln);
  background: var(--sf);
  color: var(--tx);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: var(--sh-sm);
  cursor: pointer;
  padding: 0;
}
.dt small { font-size: 11px; color: var(--tx-muted); font-weight: 600; }
.dt .mo { font-size: 10px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.2px; }
.dt b { font-size: 18px; font-weight: 800; line-height: 1.1; margin: 1px 0; }
.dt i {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--primary);
}
.dt.on {
  background: var(--primary);
  color: var(--primary-tx);
  border-color: transparent;
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(var(--primary-rgb), 0.35);
}
.dt.on small { color: rgba(255, 255, 255, 0.85); }
.dt.on i { background: #ffffff; }

#tl {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 0 14px 8px;
  scrollbar-width: none;
}
#tl::-webkit-scrollbar { display: none; }
.tk {
  flex: none;
  min-width: 160px;
  max-width: 220px;
  border-radius: var(--radius-md);
  padding: 10px 14px;
  background: var(--sf);
  border: 1px solid var(--ln);
  border-inline-start: 4px solid var(--c, var(--primary));
  box-shadow: var(--sh-sm);
  cursor: pointer;
}
.tk b {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13.5px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tk small {
  color: var(--tx-muted);
  font-size: 11.5px;
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px;
}
.tk.ghost {
  border: 1px dashed var(--ln);
  border-inline-start: 1px dashed var(--ln);
  color: var(--tx-muted);
  font-size: 13px;
  min-width: 220px;
  background: transparent;
  box-shadow: none;
  cursor: default;
}

/* Bottom iOS-style Tab Bar */
#nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 600;
  display: flex;
  align-items: center;
  padding: 6px 8px calc(6px + var(--safe-bottom));
  border-top: 1px solid var(--glass-border);
  gap: 2px;
}
#navw {
  flex: 1;
  min-width: 0;
  position: relative;
}
#navs {
  display: flex;
  justify-content: space-around;
  gap: 2px;
  overflow-x: auto;
  scrollbar-width: none;
}
#navs::-webkit-scrollbar { display: none; }
#nav button {
  flex: 1;
  min-width: 52px;
  border: 0;
  background: none;
  border-radius: var(--radius-md);
  padding: 6px 2px 4px;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--tx-muted);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
  transition: all 0.15s ease;
}
#nav button svg {
  width: 22px;
  height: 22px;
  stroke-width: 2.1;
  transition: transform 0.15s ease;
}
#nav button.on {
  color: var(--primary);
}
#nav button.on svg {
  stroke-width: 2.3;
  transform: translateY(-1px);
}
#nav .sep {
  width: 1px;
  height: 24px;
  background: var(--ln);
  margin: 0 4px;
}
#navg {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: none;
}
#nav .ib {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--ln);
  background: var(--sf);
  color: var(--tx);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: var(--sh-sm);
}
#nav .ib:disabled { opacity: 0.35; }

/* Floating action buttons */
#new {
  position: fixed;
  right: 18px;
  bottom: calc(265px + var(--safe-bottom));
  z-index: 520;
  border-radius: 50%;
  width: 54px;
  height: 54px;
  padding: 0;
  box-shadow: var(--sh-lg);
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--primary);
  color: var(--primary-tx);
  border: 0;
  cursor: pointer;
}
#unp {
  position: fixed;
  left: 18px;
  bottom: calc(265px + var(--safe-bottom));
  z-index: 520;
  border-radius: var(--radius-xl);
  box-shadow: var(--sh-md);
  padding: 10px 16px;
  font-weight: 600;
  font-size: 13.5px;
}

/* Full Pane Views */
.pane {
  position: fixed;
  inset: 0;
  z-index: 550;
  background: var(--bg);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: calc(20px + var(--safe-top)) 16px calc(80px + var(--safe-bottom));
  display: none;
}
.pane.on { display: block; }
#welcome { z-index: 800; display: none; }
#welcome.on { display: block; }

.hero {
  text-align: center;
  padding: 8vh 16px 24px;
  max-width: 480px;
  margin: 0 auto;
}
.hero-icon {
  width: 68px;
  height: 68px;
  border-radius: 20px;
  background: var(--primary-surface);
  color: var(--primary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 20px;
}
.hero h2 {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.03em;
  margin: 0 0 10px;
}
.hero p {
  color: var(--tx-muted);
  font-size: 15px;
  line-height: 1.5;
  margin: 0 auto 28px;
}

h2 {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.025em;
  margin: 12px 0 16px;
  color: var(--tx);
}
h3 {
  margin: 24px 0 10px;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--tx-muted);
  font-weight: 700;
}
.dh {
  display: flex;
  flex-direction: column;
  margin: 24px 0 8px;
}
.dh b {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.dh small {
  color: var(--tx-muted);
  font-size: 12.5px;
  margin-top: 2px;
}

.card {
  background: var(--sf-card);
  border: 1px solid var(--ln);
  border-radius: var(--radius-md);
  padding: 14px;
  margin-bottom: 10px;
  display: flex;
  gap: 12px;
  align-items: center;
  box-shadow: var(--sh-sm);
}
.card.blk { display: block; }
.card .nm { flex: 1; min-width: 0; }
.card .nm b { font-size: 15px; font-weight: 700; display: block; }
.card small { display: block; color: var(--tx-muted); font-size: 12.5px; margin-top: 2px; }
.card.tint { background: var(--primary-surface); border-color: rgba(var(--primary-rgb), 0.2); }

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex: none;
}
.leg {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: -4px 0 6px 18px;
  color: var(--tx-muted);
  font-size: 12px;
  font-weight: 500;
}
.leg:before {
  content: "";
  width: 2px;
  height: 18px;
  background: var(--ln);
  border-radius: 1px;
}
.mv {
  display: flex;
  flex-direction: column;
  gap: 3px;
  flex: none;
}
.mv button {
  border: 1px solid var(--ln);
  background: var(--sf2);
  color: var(--tx);
  width: 28px;
  height: 22px;
  border-radius: 6px;
  font-size: 10px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

/* Touch-optimized Buttons */
.btn {
  border: 0;
  border-radius: var(--radius-md);
  padding: 12px 18px;
  font-weight: 700;
  font-size: 14.5px;
  background: var(--primary);
  color: var(--primary-tx);
  min-height: 44px;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  flex: none;
  transition: transform 0.1s ease, opacity 0.15s ease;
}
.btn:active { transform: scale(0.97); }
.btn.s {
  background: var(--sf2);
  color: var(--tx);
  border: 1px solid var(--ln);
}
.btn.g {
  background: var(--primary);
  color: var(--primary-tx);
}
.btn.r {
  background: var(--bad);
  color: #ffffff;
}
.btn.sm {
  min-height: 36px;
  padding: 6px 12px;
  font-size: 13px;
  border-radius: var(--radius-sm);
}
.btn.ic {
  width: 38px;
  height: 38px;
  min-height: 38px;
  padding: 0;
  border-radius: 50%;
  border: 1px solid var(--ln);
}

/* Form Controls */
input, select, textarea {
  width: 100%;
  padding: 13px 14px;
  border: 1px solid var(--ln);
  border-radius: var(--radius-md);
  font-size: 15px;
  margin: 6px 0 12px;
  background: var(--sf);
  color: var(--tx);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(var(--primary-rgb), 0.15);
}
input::placeholder, textarea::placeholder { color: var(--tx-muted); opacity: 0.8; }
input[type=time] { width: auto; margin: 0; padding: 7px 10px; border-radius: var(--radius-sm); font-size: 13.5px; }
input[type=checkbox] { width: auto; margin: 0 6px 0 0; }
.lb { display: block; font-size: 12.5px; color: var(--tx-muted); margin: 6px 0 0; font-weight: 600; }
.gst { font-size: 12.5px; color: var(--primary); min-height: 18px; margin: -4px 0 8px; word-break: break-word; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sp { display: flex; gap: 8px; align-items: center; }
.sp input { margin: 0; flex: 1; }

/* Segmented Control iOS */
.seg {
  display: flex;
  background: var(--sf2);
  border-radius: var(--radius-md);
  padding: 3px;
  gap: 3px;
}
.seg button {
  flex: 1;
  border: 0;
  background: none;
  color: var(--tx-muted);
  padding: 9px 4px;
  border-radius: 13px;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.seg button.on {
  background: var(--sf);
  color: var(--tx);
  box-shadow: var(--sh-sm);
  font-weight: 700;
}

.bar {
  height: 7px;
  border-radius: 4px;
  background: var(--sf2);
  overflow: hidden;
  margin: 6px 0;
}
.bar i {
  display: block;
  height: 100%;
  background: var(--primary);
  border-radius: 4px;
}
.kv {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 0;
  font-size: 14px;
}
.kv span:last-child { font-weight: 700; }

.pin {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--c, var(--primary));
  border: 2.5px solid #ffffff;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  color: #ffffff;
}
.pin em {
  position: absolute;
  top: -8px;
  right: -8px;
  background: #0f172a;
  color: #ffffff;
  border-radius: 999px;
  min-width: 20px;
  height: 20px;
  font-weight: 800;
  font-size: 11px;
  line-height: 16px;
  text-align: center;
  font-style: normal;
  border: 2px solid #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
}

#sheet {
  position: fixed;
  inset: 0;
  z-index: 900;
  background: rgba(15, 23, 42, 0.45);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: none;
  align-items: flex-end;
}
#sheet.on { display: flex; }
#sheet > div {
  background: var(--sf);
  border-top: 1px solid var(--ln);
  width: 100%;
  border-radius: 28px 28px 0 0;
  padding: 12px 20px calc(24px + var(--safe-bottom));
  max-height: 88vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  animation: sheetUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: var(--sh-lg);
}
#sheet > div:before {
  content: "";
  display: block;
  width: 38px;
  height: 5px;
  border-radius: 3px;
  background: var(--sf3);
  margin: 0 auto 16px;
}

.ck {

}

  background: none;
  color: var(--tx);

let curLang='fr';
try{const sl=localStorage.getItem('tripkit_lang');if(sl&&I18N[sl])curLang=sl}catch(e){}
const t=(k,o={})=>{
  let s=(I18N[curLang]&&I18N[curLang][k])||(I18N.fr[k]||k);
  for(const[x,v] of Object.entries(o))s=s.replace(new RegExp('\\{'+x+'\\}','g'),v);
  return s;
};

function applyLang(lang){
  if(!I18N[lang])return;
  curLang=lang;
  try{localStorage.setItem('tripkit_lang',lang)}catch(e){}
  document.documentElement.lang=lang;
  document.documentElement.dir=I18N[lang].dir;
  $$('[data-i18n]').forEach(el=>{
    const k=el.dataset.i18n;
    if(k)el.textContent=t(k);
  });
  if(S){
    bars();renderPlan();renderList();renderInfo();renderAI();loadDiscover(true);
  }
}

function focusPlaceOnMap(lat, lng, actId){
  if(lat == null || lng == null) {
    if(actId) actSheet(actId);
    return;
  }
  tab('map');
  close();
  setTimeout(()=>{
    if(map){
      map.setView([lat, lng], Math.max(map.getZoom(), 15), {animate:true});
      if(actId) actSheet(actId);
    }
  }, 100);
}

  sheet(`
    <h2 style="font-size:20px;margin:0 0 12px">Paramètres & Affichage</h2>
    <label class="lb">Langue</label>
    <div class="seg" style="margin:6px 0 14px">
      ${Object.entries(I18N).map(([k,v])=>`<button class="${curLang===k?'on':''}" data-setlang="${k}"><b>${v.badge}</b> ${v.name}</button>`).join('')}
    </div>
    <label class="lb">Apparence</label>
    <div class="seg" style="margin:6px 0 14px">
      ${[['light','Clair'],['dark','Sombre'],['auto','Système']].map(([k,l])=>`<button class="${themePref===k?'on':''}" data-theme="${k}">${l}</button>`).join('')}
    </div>
    <button class="btn s" data-close style="width:100%;margin-top:6px">Fermer</button>
  `);
}

function bars(){
  if(!S)return; const c=cal();
  $('#brand').innerHTML=`<div class="brand-title">${esc(S.name)}</div><span class="brand-sub">${esc(c.name)}</span>`;
  $('#undo').disabled=!undo.length;
  $('#days').innerHTML=c.days.map((d,i)=>{
    const tDate=dayDate(i);
    return`<button class="dt ${i===day?'on':''}" data-day="${i}">
      <small>${I18N[curLang].days_short[tDate.getDay()]}</small>
      <b>${tDate.getDate()}</b>
      <small class="mo">${I18N[curLang].months_short[tDate.getMonth()]}</small>
      ${d.items.length?'<i></i>':''}
    </button>`;
  }).join('');

  $('#flt').innerHTML=Object.entries(I18N[curLang].slots).map(([k,v])=>`<button class="chip ${fs.has(k)?'on':''}" data-s="${k}">${SLOT_ICONS[k]} ${v}</button>`).join('')+
    Object.entries(I18N[curLang].cat_names).map(([k,v])=>`<button class="chip ${fc.has(k)?'on':''}" data-c="${k}">${CAT_ICONS[k]} ${v}</button>`).join('');

  $('#tg').innerHTML=`<button class="sw ${hideO?'on':''}" data-tg="o"><i></i>${t('hide_planned')}</button><button class="sw ${hideU?'on':''}" data-tg="u"><i></i>${t('hide_unplaced')}</button>`;
  
  const btnFilt=$('#filtertoggle');
  if(btnFilt){
    btnFilt.classList.toggle('on',filterOpen||fs.size>0||fc.size>0||hideO||hideU);
  }
  const boxFilt=$('#filterbox');if(boxFilt)boxFilt.classList.toggle('collapsed',!filterOpen);
  renderTL();
  const n=unp().length;
  $('#unp').style.display=n&&tabNow==='map'?'flex':'none';
  $('#unp').innerHTML=`${ICONS.pin} <span>${t('unplaced_btn',{n})}</span>`;
}

function renderTL(){
  const es=dayEntries(Math.min(day,S.n-1));
  $('#tl').innerHTML=es.length?es.map(e=>{
    if(e.k==='act')return`<div class="tk" data-open="${e.a.id}" style="--c:${COL[e.a.c]}"><small>${e.t}</small><b>${CAT_ICONS[e.a.c]} ${esc(e.a.n)}</b><small>${e.leg?legTxt(e.leg):(e.a.rate?`Note ${e.a.rate}/5`:I18N[curLang].cat_names[e.a.c])}</small></div>`;
    if(e.k==='note')return`<div class="tk" data-item="${e.it.id}" style="--c:var(--primary)"><small>${e.t}</small><b>${ICONS.note} ${esc(e.it.note)}</b></div>`;
    return`<div class="tk" data-resid="${e.r.id}" style="--c:var(--tx-muted)"><small>${e.r.time||'—'}</small><b>${RT[e.r.k][1]} ${esc(e.r.t)}</b></div>`;
  }).join(''):`<div class="tk ghost">${S.acts.length?t('empty_day'):'Appuyez sur + pour ajouter des étapes.'}</div>`;
}

function initMap(){
  map=L.map('map',{zoomControl:false}).setView([20,0],2);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);
  layer=L.layerGroup().addTo(map);
  map.on('click',e=>{
    if(!placing||!S)return;
    const a=get(placing);if(!a){placing=null;return}
    mut(()=>{a.lat=+e.latlng.lat.toFixed(6);a.lng=+e.latlng.lng.toFixed(6)});
    placing=null;toast('Emplacement enregistré');afterPos();
  });
}

function drawMap(){
  if(!layer||!S)return;layer.clearLayers();PTS=[];const u=used(),route=[],es=dayEntries(Math.min(day,S.n-1)).filter(e=>e.k==='act');
  S.acts.filter(a=>a.lat!=null&&vis(a)).forEach(a=>{
    const n=es.findIndex(e=>e.a.id===a.id)+1,other=u.has(a.id)&&!n;
    L.marker([a.lat,a.lng],{
      icon:L.divIcon({
        className:'',
        iconSize:[38,38],
        iconAnchor:[19,19],
        html:`<div class="pin" style="--c:${COL[a.c]};opacity:${other?0.45:1}">${CAT_ICONS[a.c]}${n?`<em>${n}</em>`:other?`<em>${ICONS.check}</em>`:''}</div>`
      })
    }).addTo(layer).on('click',()=>actSheet(a.id));
    PTS.push([a.lat,a.lng]);
  });
  es.forEach(e=>{if(e.a.lat!=null)route.push([e.a.lat,e.a.lng])});
  if(route.length>1)L.polyline(route,{color:'#0284c7',weight:4,dashArray:'4 8',lineCap:'round'}).addTo(layer);
}

const fit=()=>{if(map&&PTS.length)map.fitBounds(PTS,{padding:[60,60],maxZoom:14})};
function centerMap(){if(!map||!S)return;map.invalidateSize();drawMap();if(PTS.length)fit();else if(S.center)map.setView(S.center,S.zoom||11);else map.setView([20,0],2)}
function afterPos(){if(S.acts.filter(a=>a.lat!=null).length<=1)setTimeout(()=>{drawMap();fit()},60)}

function sheet(h){$('#sheet').innerHTML='<div>'+h+'</div>';$('#sheet').classList.add('on')}
const close=()=>$('#sheet').classList.remove('on');
const gm=a=>a.maps&&/^https?:\/\//.test(a.maps)?a.maps:`https://www.google.com/maps/search/?api=1&query=${a.lat!=null?a.lat+','+a.lng:encodeURIComponent(a.n)}`;

function actSheet(id){
  const a=get(id);if(!a)return;const inD=dayO().items.some(i=>i.aid===id);
  sheet(`
    ${a.img&&/^https?:/.test(a.img)?`<img src="${esc(a.img)}" alt="" style="width:100%;max-height:190px;object-fit:cover;border-radius:18px;margin-bottom:12px">`:''}
    <h2 style="font-size:22px;margin:0 0 8px">${esc(a.n)}</h2>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">
      <span class="chip on">${CAT_ICONS[a.c]} ${I18N[curLang].cat_names[a.c]||a.c}</span>
      ${a.sub?`<span class="chip">${esc(a.sub)}</span>`:''}
      ${a.s.map(x=>`<span class="chip">${SLOT_ICONS[x]} ${I18N[curLang].slots[x]||esc(x)}</span>`).join('')}
    </div>
    <div class="stars" style="display:flex;align-items:center;gap:4px;margin-bottom:10px">
      ${[1,2,3,4,5].map(n=>`<button class="${n<=a.rate?'on':''}" data-rate="${id}|${n}">${ICONS.star}</button>`).join('')}
      <button data-fav="${id}" style="color:${a.fav?'var(--gold)':'var(--ln)'};margin-inline-start:8px">${ICONS.heart}</button>
    </div>
    ${a.price?`<p class="kv"><span>Tarif indicatif</span><span>${esc(a.price)}</span></p>`:''}
    ${a.hrs?`<p class="kv"><span>Horaires</span><span>${esc(a.hrs)}</span></p>`:''}

function placeInDay(d,a){
  const last=d.items.filter(i=>i.aid&&get(i.aid)).sort(byT).pop();let tVal='15:00';
  if(last){const e=tm(last.t)+(get(last.aid).d||60)+30;if(e>tm(tVal))tVal=mt(e)}
  d.items.push({id:uid(),aid:a.id,t:tVal});
}
function addToDay(aid){const a=get(aid),d=dayO();if(!a||d.items.some(i=>i.aid===aid))return;mut(()=>placeInDay(d,a))}
const rankOf=a=>({m:0,a:1,s:2,e:3}[a.s[0]]??1);
const routeKm=list=>{let k=0;for(let i=1;i<list.length;i++){const l=leg(get(list[i-1].aid),get(list[i].aid));if(l)k+=l.km}return k};

function optimizeDay(n){
  const d=cal().days[n],acts=d.items.filter(i=>i.aid&&get(i.aid)).sort(byT);if(acts.length<2)return null;const before=routeKm(acts);
  const groups=[[],[],[],[]];acts.forEach(i=>groups[rankOf(get(i.aid))].push(i));
  let anchor=null;const order=[];
  groups.forEach(g=>{
    const rest=[...g];
    while(rest.length){
      let bi=0;
      if(anchor){
        let bd=1e9;rest.forEach((x,k)=>{const dd=hav(anchor,get(x.aid)),v=dd==null?500:dd;if(v<bd){bd=v;bi=k}});
      }
      const x=rest.splice(bi,1)[0];order.push(x);anchor=get(x.aid);
    }
  });
  let end=0;order.forEach(i=>{const a=get(i.aid),st=tm('15:00'),tVal=Math.max(end,st);i.t=mt(tVal);end=tVal+(a.d||60)+30});
  d.items=[...d.items.filter(i=>!(i.aid&&get(i.aid))),...order];return{before,after:routeKm(order)};
}

function autofill(n){
  const d=cal().days[n],u=used(),pool=S.acts.filter(a=>!u.has(a.id));if(!pool.length)return[];
  const ex=d.items.filter(i=>i.aid&&get(i.aid)).sort(byT),cnt={m:0,a:0,s:0,e:0},cap={m:1,a:2,s:1,e:1};ex.forEach(i=>{const r=get(i.aid).s[0];if(cnt[r]!=null)cnt[r]++});
  let anchor=ex.length?get(ex[ex.length-1].aid):null;const chosen=[];
  for(const slot of ['m','a','a','s','e']){
    if(cnt[slot]>=cap[slot])continue;
    const c=pool.filter(a=>!chosen.includes(a)&&a.s.includes(slot));if(!c.length)continue;
    let best=null,bs=1e9;c.forEach(a=>{const dd=anchor?hav(anchor,a):null;const sc=(anchor?(dd==null?8:dd):0)-(a.fav?1.5:0)-(a.rate||0)*.3;if(sc<bs){bs=sc;best=a}});
    chosen.push(best);cnt[slot]++;anchor=best;
  }
  chosen.forEach(a=>placeInDay(d,a));return chosen;
}

function swapItem(id,dir){
  const f=findItem(id);if(!f)return;
  const arr=f.d.items.filter(x=>x.aid||typeof x.note==='string').slice().sort(byT),k=arr.findIndex(x=>x.id===id),j=k+dir;
  if(k<0||j<0||j>=arr.length){toast(dir<0?'Déjà en premier':'Déjà en dernier');return}
  mut(()=>{const times=arr.map(x=>x.t),[m]=arr.splice(k,1);arr.splice(j,0,m);arr.forEach((x,ix)=>{x.t=times[ix]});f.d.items=arr.concat(f.d.items.filter(x=>!arr.includes(x)))});
}

async function loadDiscover(force=false, query='', loadMore=false){
  if(!S)return;
  if(!loadMore && discList.length && !force && !query)return;
  if(!loadMore)discQuery=query||'';
  discLoading=true;
  renderDiscover();
  
  let newPlaces = [];
  if (discEngine === 'otm') {
    newPlaces = await fetchOtmActivities(S.center, S.dest, discType, query, loadMore);
  } else if (discEngine === 'osm') {
    newPlaces = await fetchOsmActivities(S.center, S.dest, discType, query);
  } else {
    newPlaces = await fetchWikiActivities(S.dest, discType, query);
  }
  
  if (loadMore && discEngine === 'otm') {
    discList.push(...newPlaces);
  } else {
    discList = newPlaces;
  }
  
  discLoading=false;
  renderDiscover();
}

function findExistingAct(item){
  return S.acts.find(a=>(a.lat!=null&&hav(a,item)!=null&&hav(a,item)<.04)||a.n.toLowerCase()===item.name.toLowerCase());
}

const DCATS=['v','a','f','n'];
function discActive(){return discFlt.cats.size+(discFlt.photo?1:0)+(discFlt.hideAdded?1:0)+((discFlt.q&&discFlt.q!==discQuery)?1:0)}
function discVisible(){
  const live=(discFlt.q&&discFlt.q!==discQuery)?NF(discFlt.q):'';
  let arr=discList.map((item,i)=>({item,i})).filter(({item})=>{
    if(discFlt.cats.size&&!discFlt.cats.has(item.cat))return false;
    if(discFlt.photo&&!item.thumb)return false;
    if(discFlt.hideAdded&&findExistingAct(item))return false;
    if(live&&!NF(item.name+' '+(item.desc||'')).includes(live))return false;
    return true;
  });
  if(discFlt.sort==='dist'&&S.center){
    const c={lat:S.center[0],lng:S.center[1]};arr.sort((x,y)=>(hav(c,x.item)??1e9)-(hav(c,y.item)??1e9));
  } else if(discFlt.sort==='name') {
    arr.sort((x,y)=>x.item.name.localeCompare(y.item.name,curLang));
  }
  return arr;
}

function budgetData(){
  const total=S.exp.reduce((s,x)=>s+x.amt,0),byCat={},byDay={},paid={};let attr=0;
  S.exp.forEach(x=>{byCat[x.cat]=(byCat[x.cat]||0)+x.amt;const k=x.day==null?'x':x.day;byDay[k]=(byDay[k]||0)+x.amt;if(x.by){paid[x.by]=(paid[x.by]||0)+x.amt;attr+=x.amt}});
  const n=S.people.length,bal={},settle=[];
  if(n>=2){
    const share=attr/n;S.people.forEach(p=>{bal[p.id]=(paid[p.id]||0)-share});
    const deb=[],cre=[];S.people.forEach(p=>{const b=bal[p.id];if(b<-0.005)deb.push({p,a:-b});else if(b>0.005)cre.push({p,a:b})});
    deb.sort((x,y)=>y.a-x.a);cre.sort((x,y)=>y.a-x.a);
    let i=0,j=0;
    while(i<deb.length&&j<cre.length){
      const v=Math.min(deb[i].a,cre[j].a);
      settle.push({from:deb[i].p.name,to:cre[j].p.name,a:v});
      deb[i].a-=v;cre[j].a-=v;
      if(deb[i].a<.005)i++;if(cre[j].a<.005)j++;
    }
  }
  return{total,byCat,byDay,paid,bal,settle};
}

async function saveTrip(id){

      tTrip.exp.forEach(x=>{if(x.day!=null&&x.day>=n)x.day=null});tTrip.n=n;day=Math.min(day,n-1);

  }

}

const STOP=new Set('ajoute ajouter rajoute mets mettre met place placer retire retirer supprime supprimer enleve enlever pour dans sur jour journee des les une propose proposer suggere idee idees autour pres proche cote quoi faire infos info prix horaires organise organiser optimise optimiser resume planning programme avec moi'.split(' '));

  const tk=NF(q).split(/[^\p{L}\p{N}]+/u).filter(w=>w.length>2&&!STOP.has(w));if(!tk.length)return null;let b=null,bs=0;
  for(const a of S.acts){const h=NF(a.n+' '+(a.ar||''));const sc=tk.filter(w=>h.includes(w)).length;if(sc>bs){bs=sc;b=a}}return bs?b:null;
}

function localAI(text){
  const q=NF(text),n=dayFrom(text),a=findAct(text),D=cal().days[n];
  if(/retire|supprim|enleve/.test(q)){
    if(!a)return{h:'Quelle étape souhaitez-vous enlever ?'};
    if(!D.items.some(i=>i.aid===a.id))return{h:`« ${esc(a.n)} » n’est pas prévu pour le ${dl(n)}.`};
    mut(()=>{D.items=D.items.filter(i=>i.aid!==a.id)});return{h:`« ${esc(a.n)} » a été retiré de votre journée du ${dl(n)}.`};
  }
  if(/ajoute|rajoute|mets|met |place|programme/.test(q)&&!/resume/.test(q)){
    if(!a)return{h:'Lieu non reconnu.'};
    if(D.items.some(i=>i.aid===a.id))return{h:`« ${esc(a.n)} » est déjà prévu ce jour-là.`};
    addAt(a.id,n);return{h:`« ${esc(a.n)} » a été ajouté à votre journée du ${dl(n)}.`};
  }
  if(/organis|optimis|ordonn|range/.test(q)){
    if(D.items.filter(i=>i.aid).length<2)return{h:`Au moins deux étapes sont nécessaires pour optimiser.`};
    let r;mut(()=>{r=optimizeDay(n)});const gain=r?r.before-r.after:0;
    return{h:`Parcours réorganisé chronologiquement${gain>0.05?' (gain de ≈ '+fmtKm(gain)+')':''}.`};
  }
  if(/pres|proche|autour|cote|alentour/.test(q)){
    let b=a;if(!b){const l=D.items.filter(i=>i.aid).sort(byT).pop();b=l&&get(l.aid)}
    if(!b)return{h:'Autour de quel endroit ?'};
    const u=used();const l=S.acts.filter(x=>x.id!==b.id&&!u.has(x.id)).map(x=>({x,d:hav(b,x)})).filter(z=>z.d!=null).sort((p,r)=>p.d-r.d).slice(0,5);
    return{h:`Autour de <b>${esc(b.n)}</b> :<br>`+(l.map(z=>`${z.d.toFixed(1).replace('.',',')} km : ${esc(z.x.n)} ${mini(z.x.id,n,'Ajouter')}`).join('<br>')||'Aucun autre lieu à proximité.')};
  }
  if(/resume|planning|journee|programme/.test(q)){
    const l=dayEntries(n).map(e=>e.k==='act'?`${e.t} ${esc(e.a.n)}`:e.k==='note'?`${e.t} ${esc(e.it.note)}`:`${e.r.time||'—'} ${esc(e.r.t)}`);
    return{h:`<b>Programme du ${dl(n)}</b>${D.hotel?' · '+esc(D.hotel):''}<br>`+(l.join('<br>')||'Journée libre.')};
  }
  return{h:'Vous pouvez me demander : « ajoute le musée au jour 2 », « que faire ce soir ? » ou « optimise la journée ».'};
}

    </div>
    <div class="aibar">
      <input id="aiq" placeholder="Posez une question sur votre séjour…" autocomplete="off">
      <button class="btn" data-send>Envoyer</button>
    </div>
    <details class="note" style="margin-top:12px;cursor:default">
      <summary><b>Clé API Anthropic (Optionnel)</b></summary>
      <p style="font-size:13.5px;color:var(--tx-muted);margin:8px 0">Sans clé, l’assistant utilise un modèle local rapide calculé sur vos étapes.</p>
      <input id="aik" type="password" placeholder="sk-ant-…" value="${esc(k)}">
      <div class="row" style="gap:6px">
        <button class="btn s sm" data-aisave>Enregistrer</button>
        <button class="btn s sm" data-aiclear>Retirer</button>
      </div>
    </details>`;
  $('#ai').scrollTo(0,1e6);
}

function tab(tName){
  tabNow=tName;
  $('#dock').classList.toggle('hide',tName!=='map');
  $('#top').style.display=tName==='map'?'':'none';
  $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tName));
  ['plan','list','discover','info','ai'].forEach(p=>$('#'+p).classList.toggle('on',p===tName));
  $('#new').style.display=tName==='map'?'flex':'none';
  $('#unp').style.display=tName==='map'&&S&&unp().length?'flex':'none';
  if(!S)return;
  if(tName==='plan')renderPlan();
  if(tName==='list')renderList();
  if(tName==='discover'){loadDiscover();if(discList.length&&!discLoading)renderDiscover()}
  if(tName==='info')renderInfo();
  if(tName==='ai')renderAI();
  if(tName==='map')setTimeout(()=>{map.invalidateSize();drawMap()},60);
}

function refresh(){
  if(!S)return;bars();drawMap();
  if(tabNow==='plan')renderPlan();
  if(tabNow==='list')renderList();
  if(tabNow==='discover')renderDiscover();
  if(tabNow==='info')renderInfo();
}

document.addEventListener('click',e=>{try{onClick(e)}catch(err){console.error(err);toast('Erreur: '+err.message)}});

function onClick(e){
  const inlineBtn=e.target.closest('[data-toggleinline]');
  if(inlineBtn){
    const idx=+inlineBtn.dataset.toggleinline;
    const box=$('#inline-'+idx);
    if(box)box.classList.toggle('on');
    return;
  }
  if(e.target.closest('a'))return;
  if(e.target.closest('#gal-close')||e.target.id==='gallery-modal'){closeGallery();return}
  if(e.target.closest('#gal-prev')){if(curGallery.length){curGalIdx=(curGalIdx-1+curGallery.length)%curGallery.length;updateGalUI()}return}
  if(e.target.closest('#gal-next')){if(curGallery.length){curGalIdx=(curGalIdx+1)%curGallery.length;updateGalUI()}return}

  const sug=e.target.closest('[data-destll]');
  if(sug){
    const d=sug.dataset;
    const inp=$('#td');if(inp)inp.value=d.destname;
    const [la,lo]=d.destll.split(',');
    lastChosenCoords=[+la,+lo];
    const list=$('#td-sug');if(list){list.style.display='none';list.innerHTML=''}
    return;
  }

  const CLK='button,[data-open],[data-geopick],[data-trip],[data-note],[data-item],[data-resid],[data-expid],[data-opnegal],[data-focusmap],#sheet';
  const tEl=e.target.closest(CLK);if(!tEl)return;const d=tEl.dataset;
  if(tEl.id==='sheet'){if(e.target===tEl)close();return}

  if(d.focusmap){
    const [lat, lng, actId] = d.focusmap.split('|');
    focusPlaceOnMap(+lat, +lng, actId||null);
    return;
  }

  if(tEl.id==='settingsbtn' || 'settings' in d){
    settingsSheet();
    return;
  }

  if(d.setlang){applyLang(d.setlang);return}
  if(tEl.id==='filtertoggle'){filterOpen=!filterOpen;bars();return}
  if(tEl.id==='new'){if(!S)return;addSheet();return}
  if(tEl.id==='brand'){tripsSheet();return}
  if(tEl.id==='unp'){
    sheet(`
      <h2 style="font-size:20px;margin:0 0 10px">Lieux sans position</h2>
      ${unp().map(a=>`
        <div class="near" data-open="${a.id}">
          <div><b>${esc(a.n)}</b><small>${I18N[curLang].cat_names[a.c]||a.c}</small></div>
          <button class="btn s sm">Choisir</button>
        </div>`).join('')}
    `);
    return;
  }
  if(tEl.id==='undo'){if(undo.length){restore(undo.pop());save();refresh()}return}
  if(d.opnegal!==undefined){
    const item=discList[+d.opnegal];
    if(item)openGallery(item.pageTitle||item.name,item.thumb,item.name);
    return;
  }
  if(d.deldisc){removeActivityFromDiscover(d.deldisc);return}
  if(d.listfilter){listFilterCat=d.listfilter;renderList();return}
  if(d.t){tab(d.t);return}
  if('close' in d){close();return}
  if('newtrip' in d){tripForm();return}
  if('trips' in d){tripsSheet();return}
  if(d.trip){if(d.trip!==DB.cur)setTrip(d.trip);close();return}
  if(d.savetrip!==undefined){saveTrip(d.savetrip);return}
  if(!S)return;
  
  if(d.discengine){discEngine=d.discengine;discList=[];loadDiscover(true);return}
  if(d.discflt){
    const k=d.discflt;
    if(k.startsWith('cat:')){const c=k.slice(4);discFlt.cats.has(c)?discFlt.cats.delete(c):discFlt.cats.add(c)}
    else if(k==='photo')discFlt.photo=!discFlt.photo;
    else if(k==='added')discFlt.hideAdded=!discFlt.hideAdded;
    else if(k==='sort'){const o=['rel','dist','name'];discFlt.sort=o[(o.indexOf(discFlt.sort)+1)%o.length]}
    else if(k==='reset')discFlt=newFlt();
    renderDiscover();return;
  }
  if('discclear' in d){discFlt.q='';renderDiscover();return}
  if(d.discview){discView=d.discview;renderDiscover();return}
  if(d.disctype){discType=d.disctype;discList=[];loadDiscover(true);return}
  if('discsearch' in d){const q=($('#discq')||{}).value||'';discList=[];loadDiscover(true,q);return}
  if('otmmore' in d){loadDiscover(true,discQuery,true);return}
  if(d.adddisc!==undefined){addActivityFromDisc(+d.adddisc);return}
  if(d.theme){setTheme(d.theme);return}
  if(d.sub){infoSub=d.sub;renderInfo();return}
  if('edittrip' in d){tripForm(S.id);return}
  if('deltrip' in d){deleteTrip();return}
  if('addlink' in d){editSheet(null,true);return}
  if('addman' in d){editSheet();return}
  if(d.spick!==undefined){const[i,m]=d.spick.split('|');addFromSearch(+i,m==='day');return}
  if(d.note!==undefined){noteSheet(d.note);return}
  if(d.savenote!==undefined){
    const ti=$('#nt').value.trim(),b=$('#nb').value.trim();if(!ti&&!b){toast('Note vide');return}
    const id=d.savenote;
    mut(()=>{if(id){const n=S.notes.find(x=>x.id===id);if(n){n.t=ti;n.b=b}}else S.notes.push({id:uid(),t:ti,b})});
    close();return;
  }
  if(d.delnote){mut(()=>{S.notes=S.notes.filter(x=>x.id!==d.delnote)});close();return}
  if('addperson' in d){const v=$('#pn').value.trim();if(!v){toast('Prénom requis');return}mut(()=>{S.people.push({id:uid(),name:v.slice(0,30)})});return}
  if(d.delperson){mut(()=>{S.people=S.people.filter(x=>x.id!==d.delperson);S.exp.forEach(x=>{if(x.by===d.delperson)x.by=null})});return}
  if('addres' in d){resSheet();return}
  if(d.resid){resSheet(d.resid);return}
  if(d.saveres!==undefined){
    const ti=$('#rt').value.trim();if(!ti){toast('Intitulé requis');return}
    const id=d.saveres,o={k:$('#rk').value,t:ti,date:$('#rd').value,time:$('#rh').value,ref:$('#rr').value.trim(),url:$('#ru').value.trim(),note:$('#rn').value.trim()};
    if(o.url&&!/^https?:\/\//i.test(o.url))o.url='https://'+o.url;
    mut(()=>{if(id){const r=S.res.find(x=>x.id===id);if(r)Object.assign(r,o)}else S.res.push({id:uid(),...o})});
    close();toast('Réservation enregistrée');return;
  }
  if(d.delres){mut(()=>{S.res=S.res.filter(x=>x.id!==d.delres)});close();return}
  if('addexp' in d){expSheet();return}
  if(d.expid){expSheet(d.expid);return}
  if(d.saveexp!==undefined){
    const a=num($('#xa').value);if(!(a>0)){toast('Montant invalide');return}
    const ti=$('#xt').value.trim()||EXC[$('#xc').value][0],id=d.saveexp,dd=$('#xd').value,o={t:ti,amt:Math.round(a*100)/100,cat:$('#xc').value,day:dd===''?null:+dd,by:$('#xb').value||null};
    mut(()=>{if(id){const x=S.exp.find(z=>z.id===id);if(x)Object.assign(x,o)}else S.exp.push({id:uid(),...o})});
    close();toast('Dépense enregistrée');return;
  }
  if(d.delexp){mut(()=>{S.exp=S.exp.filter(x=>x.id!==d.delexp)});close();return}
  if('setbudget' in d){const v=prompt('Budget ('+S.money+')',S.budget||'');if(v===null)return;const a=num(v);mut(()=>{S.budget=a>0?a:null});return}
  if(d.newlist!==undefined){
    const tp=TPL[d.newlist];let name=tp?tp[0]:prompt('Nom de la liste');if(!name||!name.trim())return;
    mut(()=>{S.lists.push({id:uid(),name:name.trim(),items:(tp?tp[1]:[]).map(x=>({id:uid(),t:x,done:false}))})});return;
  }
  if(d.dellist){mut(()=>{S.lists=S.lists.filter(l=>l.id!==d.dellist)});return}
  if(d.chk){const[l,i]=d.chk.split('|');mut(()=>{const it=(S.lists.find(x=>x.id===l)||{items:[]}).items.find(x=>x.id===i);if(it)it.done=!it.done});return}
  if(d.delli){const[l,i]=d.delli.split('|');mut(()=>{const ls=S.lists.find(x=>x.id===l);if(ls)ls.items=ls.items.filter(x=>x.id!==i)});return}
  if(d.addli){
    const inp=document.getElementById('li-'+d.addli),v=inp?inp.value.trim():'';if(!v)return;
    mut(()=>{const ls=S.lists.find(x=>x.id===d.addli);if(ls)ls.items.push({id:uid(),t:v.slice(0,120),done:false})});
    setTimeout(()=>{const n=document.getElementById('li-'+d.addli);if(n)n.focus()},30);return;
  }
  if('share' in d){shareTrip();return}
  if('print' in d){printTrip();return}
  if(d.mv){const[i,s]=d.mv.split('|');swapItem(i,+s);return}
  if(d.item){itemSheet(d.item);return}
  if(d.mvto){const[i,k]=d.mvto.split('|');moveItem(i,+k);return}
  if(d.saveitem){
    const f=findItem(d.saveitem);if(!f)return;const tv=$('#itt').value,tx=$('#itx');
    mut(()=>{if(/^\d\d:\d\d$/.test(tv))f.it.t=tv;if(tx&&typeof f.it.note==='string')f.it.note=tx.value.trim()||f.it.note});
    close();return;
  }
  if(d.addnote!==undefined){
    const n=prompt('Note pour ce jour :');
    if(n&&n.trim()){
      const i=+d.addnote;
      mut(()=>{const last=dayEntries(i).pop();cal().days[i].items.push({id:uid(),note:n.trim(),t:last?mt(Math.min(1380,tm(last.t)+30)):'09:00'})});
    }
    return;
  }
  if(d.autofill!==undefined){const i=+d.autofill;let ch=[];mut(()=>{ch=autofill(i)});toast(ch.length?ch.length+' visite(s) ajoutée(s)':'Aucun lieu à suggérer');return}
  if('resolve' in d){doResolve();return}
  if('geo' in d){doGeo();return}
  if(d.geopick!==undefined){pickGeo(d.geopick);return}
  if('bulk' in d){bulkSheet();return}
  if('bulkgo' in d){bulkGo();return}
  if(d.day!==undefined){day=Math.min(+d.day,S.n-1);bars();drawMap();if('go' in d)tab('map');return}
  if(d.send!==undefined){aiSend($('#aiq').value);return}
  if(d.ask){aiSend(d.ask);return}
  if(d.aiadd){const[i,n]=d.aiadd.split('|');addAt(i,+n);toast('Ajouté au '+dl(+n));return}
  if(d.aiapply){const m=AIM[+d.aiapply];const c=applyOps(m.ops||[]);m.ops=[];toast(c+' modification(s) enregistrée(s)');renderAI();return}
  if('aisave' in d){try{localStorage.setItem(K+'_ai',$('#aik').value.trim())}catch(e){}toast('Clé enregistrée');renderAI();return}
  if('aiclear' in d){try{localStorage.removeItem(K+'_ai');localStorage.removeItem(KL+'_ai')}catch(e){}renderAI();toast('Clé supprimée');return}
  if(d.tg){if(d.tg==='o')hideO=!hideO;else hideU=!hideU;bars();drawMap();return}
  if(d.s){fs.has(d.s)?fs.delete(d.s):fs.add(d.s);bars();drawMap();fit();return}
  if(d.c){fc.has(d.c)?fc.delete(d.c):fc.add(d.c);bars();drawMap();fit();return}
  if(d.rmday){mut(()=>{const dd=dayO();dd.items=dd.items.filter(i=>i.aid!==d.rmday)});close();toast('Retiré du jour');return}
  if(d.add){addToDay(d.add);const a=get(d.add);if(a&&a.lat!=null)nearSheet(d.add);else close();return}
  if(d.add2){addToDay(d.add2);nearSheet(d.add2);return}
  if(d.open){actSheet(d.open);return}
  if(d.edit){editSheet(d.edit);return}
  if('newact' in d){addSheet();return}
  if(d.rate){const[i,n]=d.rate.split('|');mut(()=>{get(i).rate=get(i).rate==+n?0:+n});actSheet(i);return}
  if(d.fav){mut(()=>{get(d.fav).fav=!get(d.fav).fav});actSheet(d.fav);return}
  if(d.save!==undefined){const r=readForm(d.save);if(r){close();toast('Lieu enregistré')}return}
  if(d.place!==undefined){let id=d.place;if($('#en')){const r=readForm(id||'');if(!r)return;id=r.id}placing=id;close();tab('map');toast('Touchez la carte pour placer');return}
  if(d.del){mut(()=>{S.acts=S.acts.filter(a=>a.id!==d.del);S.cals.forEach(c=>c.days.forEach(x=>x.items=x.items.filter(i=>i.aid!==d.del)))});close();return}
  if(d.rm){mut(()=>cal().days.forEach(x=>x.items=x.items.filter(i=>i.id!==d.rm)));close();return}
  if(d.cal){S.cur=d.cal;day=Math.min(day,S.n-1);save();refresh();return}
  if('newcal' in d){const n=prompt('Nom du programme :');if(n&&n.trim())mut(()=>{const c=mkCal(n.trim(),S.n);S.cals.push(c);S.cur=c.id});return}
  if('ren' in d){const n=prompt('Renommer le programme :',cal().name);if(n&&n.trim())mut(()=>{cal().name=n.trim()});return}
  if('dup' in d){mut(()=>{const c=JSON.parse(JSON.stringify(cal()));c.id=uid();c.name+=' (copie)';c.days.forEach(x=>x.items.forEach(i=>i.id=uid()));S.cals.push(c);S.cur=c.id});return}
  if('delcal' in d){if(S.cals.length<2){toast('Conservez au moins un programme');return}mut(()=>{S.cals=S.cals.filter(c=>c.id!==S.cur);S.cur=S.cals[0].id});return}
  if(d.export){doExport(d.export==='all');return}
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeGallery();return}
  if(e.key==='ArrowLeft'&&$('#gallery-modal').classList.contains('on')){
    if(curGallery.length){curGalIdx=(curGalIdx-1+curGallery.length)%curGallery.length;updateGalUI()}return;
  }
  if(e.key==='ArrowRight'&&$('#gallery-modal').classList.contains('on')){
    if(curGallery.length){curGalIdx=(curGalIdx+1)%curGallery.length;updateGalUI()}return;
  }
  if(e.key!=='Enter')return;
  if(e.target.id==='aiq'){e.preventDefault();aiSend(e.target.value)}
  else if(e.target.id==='discq'){e.preventDefault();discList=[];loadDiscover(true,e.target.value)}
  else if(e.target.dataset&&e.target.dataset.li){e.preventDefault();const b=document.querySelector(`[data-addli="${e.target.dataset.li}"]`);if(b)b.click()}
  else if(e.target.id==='pn'){e.preventDefault();const b=$('[data-addperson]');if(b)b.click()}
  else if(e.target.id==='sq'){e.preventDefault();clearTimeout(sqT);runSearch()}
});

document.addEventListener('change',e=>{
  const tEl=e.target,d=tEl.dataset;
  if(d.time&&S){mut(()=>cal().days.forEach(x=>x.items.forEach(i=>{if(i.id===d.time&&tEl.value)i.t=tEl.value})))}
  else if(d.hotel!==undefined&&S){mut(()=>{cal().days[+d.hotel].hotel=tEl.value})}
  else if('imp' in d&&tEl.files[0]){doImport(tEl.files[0]);tEl.value=''}
});

let rt;
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='ema'){clearTimeout(rt);const v=e.target.value.trim();if(/^https?:\/\//i.test(v)||parseGPS(v))rt=setTimeout(doResolve,450)}
  else if(id==='sq'){clearTimeout(sqT);sqT=setTimeout(runSearch,650)}
  else if(id==='discq'){discFlt.q=e.target.value;renderDiscResults();const c=$('[data-discclear]');if(c)c.hidden=!discFlt.q}
});

window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});

/* Bootstrap */
const boot=loadDB();DB=boot.db;S=curTrip();AIM=aiWelcome();applyTheme();applyLang(curLang);
initMap();show();
if(!S)setTimeout(tripForm,300);
window.__tp={get DB(){return DB},get S(){return S},parseGPS,fromHtml,nameFromUrl,norm,resolveLink,budgetData,leg,tripText,optimizeDay,dayEntries,get themePref(){return themePref},applyLang};
})();
</script>
</body>
</html>
