<script>try{var p=localStorage.getItem('tripkit_theme')||'light';if(p==='auto')p=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=p}catch(e){document.documentElement.dataset.theme='light'}</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<!-- Ajout de Phosphor Icons pour un rendu pro -->
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
/* ================= THEME PRO COMMERCIAL ================= */
:root{
  color-scheme:light;
  --bg:#f8fafc;
  --sf:#ffffff;
  --sf2:#f1f5f9;
  --tx:#0f172a;
  --mu:#64748b;
  --ln:#e2e8f0;
  --glass:rgba(255,255,255,.8);
  --sh:0 20px 40px -10px rgba(15,23,42,.12);
  --shs:0 4px 12px -4px rgba(15,23,42,.08);
  --acc:linear-gradient(135deg, #4f46e5, #9333ea); /* Dégradé Indigo Premium */
  --accTx:#ffffff;
  --gold:#f59e0b;
  --ok:#10b981;
  --bad:#ef4444;
  --sheet:#ffffff;
  --ov:rgba(15,23,42,.5);
  --inp:#f1f5f9;
  --tint:rgba(79,70,229,.08);
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#09090b;
  --sf:#18181b;
  --sf2:#27272a;
  --tx:#f8fafc;
  --mu:#a1a1aa;
  --ln:#3f3f46;
  --glass:rgba(24,24,27,.8);
  --sh:0 20px 40px -10px rgba(0,0,0,.6);
  --shs:0 4px 12px -4px rgba(0,0,0,.4);
  --gold:#fbbf24;
  --ok:#34d399;
  --bad:#f87171;
  --sheet:#18181b;
  --ov:rgba(0,0,0,.7);
  --inp:#27272a;
  --tint:rgba(99,102,241,.15);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;font:15px/1.5 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;color:var(--tx);overflow:hidden;background:var(--bg)}
html[dir=rtl] body{direction:rtl;text-align:right}
button{font-family:inherit}
#map{position:fixed;inset:0;background:var(--bg)}
:root[data-theme=dark] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(0.85) contrast(0.9) saturate(0.6)}

/* UI Elements */
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);border:1px solid var(--ln);box-shadow:var(--sh)}
#top{position:fixed;left:12px;right:12px;top:calc(70px + env(safe-area-inset-top));z-index:500;display:flex;flex-direction:column;gap:8px}
#brandrow{display:flex;gap:8px;align-items:center}
#brand{flex:1;min-width:0;border-radius:999px;padding:10px 18px;font:700 16px ui-rounded,system-ui;color:var(--tx);text-align:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; cursor:pointer;}
#brand small{color:var(--mu);font-weight:600;margin-inline-start:8px;font-size:13px}
#filtertoggle{flex:none;border-radius:999px;padding:10px 16px;font:600 14px ui-rounded,system-ui;color:var(--tx);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
#filtertoggle.on{background:var(--acc);color:var(--accTx);border-color:transparent}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.row::-webkit-scrollbar{display:none}.row.wrap{flex-wrap:wrap;overflow:visible}
#filterbox{display:flex;flex-direction:column;gap:8px;transition:all .2s ease; padding-top:4px;}
#filterbox.collapsed{display:none}

.chip{flex:none;border:1px solid var(--ln);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:999px;padding:8px 16px;font:600 13.5px ui-rounded,system-ui;color:var(--tx);transition:all .15s;box-shadow:var(--shs);cursor:pointer}
.chip:active{transform:scale(.94)}.chip.on{background:var(--acc);color:var(--accTx);border-color:transparent}
.pane .chip,#sheet .chip{background:var(--sf2);box-shadow:none}.pane .chip.on,#sheet .chip.on{background:var(--acc); color:var(--accTx);}

#dock{position:fixed;left:0;right:0;bottom:0;z-index:600;border-radius:32px 32px 0 0;padding:16px 0 calc(12px + env(safe-area-inset-bottom))}
#dock.hide{display:none}
#days{display:flex;gap:10px;overflow-x:auto;padding:0 16px 14px;scrollbar-width:none}#days::-webkit-scrollbar{display:none}
.dt{flex:none;width:58px;height:78px;border-radius:22px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;transition:all .2s;padding:0;box-shadow:var(--shs);cursor:pointer}
.dt small{font-size:12px;color:var(--mu);font-weight:600}.dt .mo{font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:700}.dt b{font-size:22px;font-weight:800;line-height:1.1}
.dt i{position:absolute;top:6px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 4px var(--gold);}
.dt.on{background:var(--acc);color:var(--accTx);border-color:transparent;transform:translateY(-4px);box-shadow:0 8px 16px rgba(79,70,229,0.3)}.dt.on small{color:rgba(255,255,255,0.8)}.dt.on i{background:#fff;}

#tl{display:flex;gap:10px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}#tl::-webkit-scrollbar{display:none}
.tk{flex:none;min-width:160px;max-width:240px;border-radius:18px;padding:10px 14px;background:var(--sf);border:1px solid var(--ln);border-inline-start:5px solid var(--c,var(--gold));box-shadow:var(--shs);cursor:pointer}.tk b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tk small{color:var(--mu);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk.ghost{border:1px dashed var(--mu);border-inline-start:1px dashed var(--mu);color:var(--mu);font-size:14px;min-width:240px;white-space:normal;background:transparent;box-shadow:none;cursor:default}

/* Nav Pro */
#nav{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:700;display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px; max-width: 500px; margin: 0 auto;}
#navw{flex:1;min-width:0; overflow:hidden;}
#navs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}#navs::-webkit-scrollbar{display:none}
#nav button{flex:none; border:0; background:none; border-radius:999px; height: 44px; width: 44px; display:flex; align-items:center; justify-content:center; color:var(--mu); cursor:pointer; transition:all 0.2s; font-size:22px;}
#nav button span{display:none; /* Look pro icon-only */}
#nav button:hover{background:var(--sf2); color:var(--tx);}
#nav button.on{color:var(--accTx);background:var(--acc);box-shadow:0 4px 12px rgba(79,70,229,0.3);}
#nav .ib{flex:none;width:38px;height:38px;padding:0;justify-content:center;color:var(--tx);background:var(--sf2);font-size:18px; border-radius:50%;}
#nav .ib:disabled{opacity:.3}
#nav .sep{width:1px;height:24px;background:var(--ln);margin:0 4px}

.sw{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--ln);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:999px;padding:6px 14px 6px 8px;font:600 13.5px ui-rounded,system-ui;color:var(--tx);box-shadow:var(--shs);cursor:pointer}
.sw i{width:32px;height:20px;border-radius:10px;background:var(--ln);position:relative;transition:.2s}.sw i:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0004;transition:.2s}
.sw.on i{background:var(--acc)}.sw.on i:after{left:14px}

/* Boutons repensés */
.btn{border:0;border-radius:999px;padding:12px 20px;font:600 15px ui-rounded,system-ui;background:var(--acc);color:var(--accTx);min-height:46px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;flex:none; transition:all 0.2s;}
.btn:active{transform:scale(.96)}
.btn i{font-size:1.2em;}
.btn.s{background:var(--sf2);color:var(--tx)}.btn.g{background:var(--acc);color:var(--accTx); box-shadow:0 8px 16px rgba(79,70,229,0.25);}
.btn.r{background:var(--bad);color:#fff; box-shadow:0 8px 16px rgba(239,68,68,0.25);}
.btn.sm{min-height:38px;padding:8px 16px;font-size:14px;}
.btn.ic{width:46px;height:46px;min-height:46px;padding:0;border-radius:50%;font-size:20px;}
.btn.ic.sm{width:38px;height:38px;min-height:38px;font-size:18px;}

/* Formulaires */
input,select,textarea{width:100%;padding:14px 16px;border:1px solid var(--ln);border-radius:16px;font:16px ui-rounded,system-ui;margin:4px 0 12px;background:var(--inp);color:var(--tx); transition: border-color 0.2s, box-shadow 0.2s;}
input:focus,select:focus,textarea:focus{outline:none; border-color:#4f46e5; box-shadow:0 0 0 3px rgba(79,70,229,0.15);}
input::placeholder,textarea::placeholder{color:var(--mu);opacity:.7}
input[type=time]{width:auto;margin:0;padding:10px 14px;border-radius:12px}

/* Floating Action Button (FAB) */
#unp{position:fixed;left:16px;bottom:calc(220px + env(safe-area-inset-bottom));z-index:520;border-radius:999px;box-shadow:var(--sh);color:var(--tx)}
#new{position:fixed;right:16px;bottom:calc(220px + env(safe-area-inset-bottom));z-index:520;border-radius:50%;width:60px;height:60px;padding:0;font-size:28px;box-shadow:0 12px 24px rgba(79,70,229,0.4); display:flex; align-items:center; justify-content:center;}

.pane{position:fixed;inset:0;z-index:550;background:var(--bg);overflow:auto;padding:calc(84px + env(safe-area-inset-top)) 16px 40px;display:none;-webkit-overflow-scrolling:touch}.pane.on{display:block}
#welcome{z-index:800;padding-top:calc(20px + env(safe-area-inset-top))}
.hero{text-align:center;padding-top:10vh}.hero h2{font-size:42px;margin-bottom:12px; font-weight:800; background:var(--acc); -webkit-background-clip:text; -webkit-text-fill-color:transparent;}.hero p{color:var(--mu);max-width:340px;margin:0 auto 30px; font-size:16px;}.hero .btn{margin:6px}

h2{font-size:28px;font-weight:800;letter-spacing:-.5px;margin:8px 0 16px}h3{margin:24px 0 10px;font-size:15px;color:var(--tx);font-weight:700}
.dh{display:flex;flex-direction:column;margin:24px 0 12px}.dh b{font-size:20px;letter-spacing:-.3px}.dh small{color:var(--mu);font-size:14px;margin-top:2px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:14px;margin-bottom:12px;display:flex;gap:12px;align-items:center;box-shadow:var(--shs)}
.card.blk{display:block}.card .nm{flex:1;min-width:0}.card small{display:block;color:var(--mu);font-size:13.5px;margin-top:2px;}.card.tint{background:var(--tint); border-color:transparent;}
.dot{width:14px;height:14px;border-radius:50%;flex:none}

.pin{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#ffffff66,transparent 45%),var(--c);border:3px solid #fff;box-shadow:0 8px 16px rgba(0,0,0,0.2),0 0 0 4px color-mix(in srgb,var(--c) 20%,transparent);display:flex;align-items:center;justify-content:center;position:relative}.pin b{font-size:20px;font-weight:400}
.pin em{position:absolute;top:-8px;right:-8px;background:var(--tx);color:var(--bg);border-radius:12px;min-width:24px;height:24px;font:800 13px/20px ui-rounded,system-ui;text-align:center;font-style:normal;border:2px solid var(--sf)}

#sheet{position:fixed;inset:0;z-index:900;background:var(--ov);display:none;align-items:flex-end; backdrop-filter:blur(4px);}#sheet.on{display:flex}
#sheet>div{background:var(--sheet);width:100%;border-radius:32px 32px 0 0;padding:12px 24px calc(24px + env(safe-area-inset-bottom));max-height:92%;overflow:auto;animation:up .3s cubic-bezier(.2,.9,.2,1); box-shadow:0 -10px 40px rgba(0,0,0,0.15);}
#sheet>div:before{content:"";display:block;width:48px;height:6px;border-radius:3px;background:var(--ln);margin:0 auto 20px}
@keyframes up{from{transform:translateY(100px);opacity:0}}

/* Assistants / AI */
.bub{max-width:85%;padding:12px 16px;border-radius:20px;margin:8px 0;line-height:1.5;font-size:15px}.bub.a{background:var(--sf);border:1px solid var(--ln);border-top-left-radius:6px;box-shadow:var(--shs)}.bub.u{background:var(--acc);color:var(--accTx);font-weight:600;margin-inline-start:auto;border-top-right-radius:6px;width:fit-content; box-shadow:0 8px 16px rgba(79,70,229,0.2);}
.mini{border:0;border-radius:999px;padding:8px 14px;margin:6px 6px 0 0;background:var(--tint);color:var(--tx);font:600 13.5px ui-rounded,system-ui;cursor:pointer; transition:0.2s;} .mini:hover{background:var(--acc); color:var(--accTx);}
.aibar{position:sticky;bottom:0;display:flex;gap:8px;padding:12px 0 8px;background:linear-gradient(0deg,var(--bg) 80%,transparent)}.aibar input{margin:0;flex:1}

/* Explorer View */
.disc-search{display:flex;align-items:center;gap:8px;background:var(--inp);border:1px solid var(--ln);border-radius:999px;padding:0 8px 0 16px;transition:box-shadow .2s,border-color .2s}
.disc-search:focus-within{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,0.15)}
.disc-search input{margin:0;border:0;background:none;padding:14px 4px;flex:1;min-width:0;width:auto;outline:none}

/* Util */
.lb{display:block;font-size:13.5px;color:var(--mu);margin:12px 0 4px;font-weight:600}
.gst{font-size:13px;color:var(--mu);min-height:18px;margin:-8px 0 12px;word-break:break-word}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sp{display:flex;gap:8px;align-items:center}.sp input{margin:0;flex:1}
.note{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:12px;cursor:pointer; box-shadow:var(--shs)}.note a{color:#4f46e5;font-weight:600}.empty{color:var(--mu);padding:12px 4px; text-align:center; font-style:italic;}

/* Checkboxes Lists */
.ck{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ln)}.ck button.t{flex:1;text-align:inherit;border:0;background:none;color:var(--tx);font:16px ui-rounded,system-ui;padding:0;display:flex;gap:12px;align-items:center;cursor:pointer}
.ck .bx{width:24px;height:24px;border-radius:8px;border:2px solid var(--mu);flex:none;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--accTx); transition:0.2s;}.ck.done .bx{background:var(--acc);border-color:transparent;box-shadow:0 4px 10px rgba(79,70,229,0.3);}.ck.done .tx{text-decoration:line-through;color:var(--mu)}

</style></head><body>

/* (Le cœur JavaScript de l'appli reste identique, on va juste injecter les nouvelles icônes dans les templates) */

function centerMap(){if(!map||!S)return;map.invalidateSize();drawMap();if(PTS.length)fit();else if(S.center)map.setView(S.center,S.zoom||11);else map.setView([20,0],2)}
function afterPos(){if(S.acts.filter(a=>a.lat!=null).length<=1)setTimeout(()=>{drawMap();fit()},60)}

function sheet(h){$('#sheet').innerHTML='<div>'+h+'</div>';$('#sheet').classList.add('on')}
const close=()=>$('#sheet').classList.remove('on');
const gm=a=>a.maps&&/^https?:\/\//.test(a.maps)?a.maps:`https://www.google.com/maps/search/?api=1&query=${a.lat!=null?a.lat+','+a.lng:encodeURIComponent(a.n)}`;

// Refonte des Sheets d'action avec boutons Icônes
function actSheet(id){const a=get(id);if(!a)return;const inD=dayO().items.some(i=>i.aid===id);
  sheet(`${a.img&&/^https?:/.test(a.img)?`<img src="${esc(a.img)}" alt="" style="width:100%;max-height:180px;object-fit:cover;border-radius:24px;margin-bottom:12px;box-shadow:0 10px 20px rgba(0,0,0,0.1);">`:''}
  <h2 style="font-size:24px;margin-top:0">${esc(a.n)}</h2>
  <p style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;"><span class="chip on">${I18N[curLang].cat_names[a.c]||a.c}</span> ${a.s.map(x=>`<span class="chip">${I18N[curLang].slots[x]||esc(x)}</span>`).join('')}</p>
  <div style="font-size:20px; color:var(--gold); margin:8px 0;">${[1,2,3,4,5].map(n=>`<span style="cursor:pointer;opacity:${n<=a.rate?1:0.3};" onclick="mut(()=>{get('${id}').rate=get('${id}').rate==${n}?0:${n}});actSheet('${id}')">★</span>`).join('')} <i class="${a.fav?'ph-fill':'ph'} ph-heart" style="color:${a.fav?'var(--bad)':'var(--ln)';} cursor:pointer; margin-left:12px" onclick="mut(()=>{get('${id}').fav=!get('${id}').fav});actSheet('${id}')"></i></div>
  ${a.price?`<p>💶 ${esc(a.price)}</p>`:''}${a.hrs?`<p>🕒 ${esc(a.hrs)}</p>`:''}${a.note?`<p><i class="ph ph-note"></i> ${esc(a.note)}</p>`:''}
  <small style="color:var(--mu)"><i class="ph ph-info"></i> ${esc(a.src)}${a.lat==null?' · 📍 Position à préciser':''}</small>
  <div class="row wrap" style="margin-top:16px">
    <button class="btn ${inD?'r':'g'}" data-${inD?'rmday':'add'}="${id}"><i class="ph-bold ${inD?'ph-minus':'ph-plus'}"></i> ${inD?'Retirer du jour':'Au programme'}</button>
    <a class="btn s ic" target="_blank" rel="noopener" href="${esc(gm(a))}" title="Itinéraire"><i class="ph ph-navigation-arrow"></i></a>
    ${a.maps&&a.maps!==gm(a)?`<a class="btn s ic" target="_blank" rel="noopener" href="${esc(a.maps)}" title="Réserver"><i class="ph ph-ticket"></i></a>`:''}
    <button class="btn s ic" data-edit="${id}" title="Modifier"><i class="ph ph-pencil-simple"></i></button>
    ${a.lat==null?`<button class="btn s ic" data-place="${id}" title="Placer sur la carte"><i class="ph ph-map-pin"></i></button>`:''}
  </div>`)}

function nearSheet(aid){const a=get(aid),u=used();
  const l=S.acts.filter(b=>!u.has(b.id)).map(b=>({b,d:hav(a,b),same:a.area&&a.area===b.area})).filter(x=>x.d!=null?x.d<=12:x.same).sort((x,y)=>(x.d??50)-(y.d??50)).slice(0,6);
  sheet(`<h2 style="font-size:22px;margin-top:0"><i class="ph-fill ph-check-circle" style="color:var(--ok)"></i> C’est noté !</h2><h3>Idées tout près</h3>${l.length?l.map(({b,d,same})=>`<div class="card blk" style="padding:10px 14px">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div><b style="font-size:15px">${esc(b.n)}</b><small>${d!=null?'📍 '+d.toFixed(1).replace('.',',')+' km':same?'même quartier':''} · ${b.s.map(x=>I18N[curLang].slots[x]||'').join(', ')}</small></div>
      <button class="btn s ic sm" data-add2="${b.id}"><i class="ph-bold ph-plus"></i></button>
    </div></div>`).join(''):'<p class="empty">Rien d’autre à proximité.</p>'}<button class="btn" style="margin-top:16px;width:100%" data-close>Terminé</button>`)}

function addSheet(){SR=[];SRadd=new Set();
  sheet(`<h2 style="font-size:24px;margin-top:0">Nouveau lieu</h2>
  <div class="disc-search"><i class="ph ph-magnifying-glass"></i><input id="sq" placeholder="Rechercher (resto, visite...)" autocomplete="off" enterkeyhint="search"></div>
  <div id="sst" class="gst">Autour de ${esc(S.dest)}</div><div id="sres"></div>
  <div class="row wrap" style="margin-top:12px"><button class="btn s" data-addlink><i class="ph ph-link"></i> Depuis un lien</button><button class="btn s" data-addman><i class="ph ph-pencil"></i> Manuel</button><button class="btn s" data-bulk><i class="ph ph-list-plus"></i> En lot</button></div>`);
  setTimeout(()=>{const q=$('#sq');if(q)q.focus()},350)}

async function runSearch(){const q=($('#sq')||{}).value||'';const st=$('#sst');if(!st)return;if(q.trim().length<3){st.innerHTML='<i class="ph ph-info"></i> Tape au moins 3 lettres.';$('#sres').innerHTML='';return}
  st.innerHTML='<i class="ph ph-spinner ph-spin"></i> Recherche en cours…';
  try{let rs=await geocode(q.trim(),6);if(!rs.length&&S.dest)rs=await geocode(q.trim()+' '+S.dest,6,false);if(!$('#sres'))return;SR=rs;SRadd=new Set();
    st.textContent=rs.length?'Choisis une action :':'Aucun résultat trouvé.';
    $('#sres').innerHTML=SR.map((r,i)=>`<div class="card blk" style="padding:10px 14px"><div style="display:flex;justify-content:space-between;align-items:center;"><div><b>${EM[r.cat]} ${esc(r.short)}</b><small>${esc(r.name)}</small></div>
      <div class="row" style="flex:none">${SRadd.has(i)?'<span style="color:var(--ok);font-size:22px;"><i class="ph-fill ph-check-circle"></i></span>':`<button class="btn s ic sm" data-spick="${i}|lib" title="Sauvegarder"><i class="ph ph-bookmark-simple"></i></button><button class="btn ic sm" data-spick="${i}|day" title="Au programme"><i class="ph ph-calendar-plus"></i></button>`}</div></div></div>`).join('')}
  catch(e){if($('#sst'))$('#sst').innerHTML='<i class="ph ph-warning"></i> Recherche indisponible'}}

function addFromSearch(i,toDay){const r=SR[i];if(!r||SRadd.has(i))return;
  const a=X(r.short||'Lieu',r.cat,'',{lat:r.lat,lng:r.lng,src:'Recherche'});
  mut(()=>{S.acts.push(a);if(toDay)placeInDay(dayO(),a)});SRadd.add(i);runSearch();toast(toDay?'<i class="ph-fill ph-check-circle"></i> Ajouté au programme':'<i class="ph-fill ph-bookmark"></i> Sauvegardé');afterPos()}

function editSheet(id,focusLink){const a=id?get(id):X('','v','');
  sheet(`<h2 style="font-size:24px;margin-top:0">${id?'Modifier':'Nouveau lieu'}</h2>
  <label class="lb">Lien Maps / Réservation</label>
  <div class="disc-search" style="border-radius:16px"><i class="ph ph-link"></i><input id="ema" inputmode="url" autocapitalize="off" placeholder="https://..." value="${esc(a.maps||'')}"></div>
  <div id="gst" class="gst"></div>
  <label class="lb">Nom et Type</label>
  <input id="en" placeholder="Nom du lieu" value="${esc(a.n)}">
  <select id="ec">${Object.entries(I18N[curLang].cat_names).map(([k,v])=>`<option value="${k}" ${k===a.c?'selected':''}>${v}</option>`).join('')}</select>
  <label class="lb">Moments idéaux</label>
  <div class="row" style="padding:0 0 12px">${Object.entries(I18N[curLang].slots).map(([k,v])=>`<label class="chip"><input type="checkbox" class="es" value="${k}" ${a.s.includes(k)?'checked':''} style="display:none;">${v}</label>`).join('')}</div>
  <label class="lb">Coordonnées GPS</label>
  <div class="disc-search" style="border-radius:16px"><i class="ph ph-map-pin"></i><input id="ell" placeholder="lat, lng" value="${a.lat!=null?a.lat+', '+a.lng:''}"></div>
  <div class="row" style="padding:8px 0 12px"><button class="btn s sm" data-resolve><i class="ph ph-crosshair"></i> Auto-détecter</button><button class="btn s sm" data-geo><i class="ph ph-magnifying-glass"></i> Chercher nom</button></div>
  <div id="gres"></div>
  <div class="two">
    <div><label class="lb">Durée (min)</label><input id="edu" type="number" placeholder="ex: 90" value="${a.d||''}"></div>
    <div><label class="lb">Tarif</label><input id="epr" placeholder="€" value="${esc(a.price||'')}"></div>
  </div>
  <label class="lb">Horaires & Notes</label>
  <input id="eho" placeholder="Horaires" value="${esc(a.hrs||'')}">
  <textarea id="eno" rows="2" placeholder="Notes utiles...">${esc(a.note||'')}</textarea>
  <div class="row wrap" style="margin-top:8px"><button class="btn" data-save="${id||''}"><i class="ph-bold ph-check"></i> Enregistrer</button>${id?`<button class="btn r ic" data-del="${id}" title="Supprimer"><i class="ph ph-trash"></i></button>`:''}</div>`);
  if(focusLink)setTimeout(()=>{const e=$('#ema');if(e)e.focus()},350)}

function readForm(id){const n=$('#en').value.trim();if(!n){toast('Nom obligatoire');return null}
  let lat=null,lng=null;const v=$('#ell').value.trim();if(v){const g=parseGPS(v);if(g){lat=g[0];lng=g[1]}}
  const du=parseInt($('#edu').value,10);
  const o={n,c:$('#ec').value,s:$$('.es:checked').map(x=>x.value),lat,lng,d:du>0?du:90,price:$('#epr').value.trim()\vert{}\vert{}null,hrs:$('#eho').value.trim()||null,maps:$('#ema').value.trim()\vert{}\vert{}null,note:$('#eno').value.trim()||null};
  let r;mut(()=>{if(id){r=get(id);Object.assign(r,o)}else{r=X(o.n,o.c,'');Object.assign(r,o);S.acts.push(r)}});
  if(lat!=null)afterPos();return r}

// Implémentations raccourcies pour les actions de listes/plannings
function placeInDay(d,a){const last=d.items.filter(i=>i.aid&&get(i.aid)).sort(byT).pop();let tVal='15:00';if(last){const e=tm(last.t)+(get(last.aid).d||60)+30;if(e>tm(tVal))tVal=mt(e)}d.items.push({id:uid(),aid:a.id,t:tVal})}
function addToDay(aid){const a=get(aid),d=dayO();if(!a||d.items.some(i=>i.aid===aid))return;mut(()=>placeInDay(d,a))}

function itemSheet(id){const f=findItem(id);if(!f)return;const it=f.it,a=it.aid?get(it.aid):null;
  const mv=cal().days.map((_,i)=>i===f.i?'':`<button class="chip" data-mvto="${id}|${i}">${esc(dl(i))}</button>`).join('');
  sheet(`<h2 style="font-size:22px;margin-top:0">${a?esc(a.n):'📝 Note'}</h2>${a?'':`<textarea id="itx" rows="4" placeholder="Note">${esc(it.note)}</textarea>`}
  <label class="lb">Heure</label><input id="itt" type="time" style="width:100%;margin:4px 0 12px;" value="${it.t}">
  <div class="row wrap"><button class="btn" data-saveitem="${id}"><i class="ph-bold ph-check"></i> OK</button>${a?`<button class="btn s ic" data-open="${a.id}"><i class="ph ph-eye"></i></button>`:''}<button class="btn r ic" data-rm="${id}"><i class="ph ph-trash"></i></button></div>
  <h3>Déplacer</h3><div class="row wrap">${mv||'<span class="empty">Une seule journée.</span>'}</div>`)}

function renderPlan(){const c=cal();
  $('#plan').innerHTML=`<h2>${t('nav_plan')}</h2><div class="row" style="padding-bottom:12px">${S.cals.map(x=>`<button class="chip ${x.id===c.id?'on':''}" data-cal="${x.id}">${esc(x.name)}</button>`).join('')}<button class="chip" data-newcal><i class="ph ph-plus"></i></button></div>
  <div class="row" style="padding-bottom:8px"><button class="btn s ic sm" data-ren title="Renommer"><i class="ph ph-pencil-simple"></i></button><button class="btn s ic sm" data-dup title="Dupliquer"><i class="ph ph-copy"></i></button><button class="btn r ic sm" data-delcal title="Supprimer"><i class="ph ph-trash"></i></button></div>`+
  c.days.map((d,i)=>{const es=dayEntries(i),s=dayStats(i),sum=[];if(s.n)sum.push(s.n+' étapes');if(s.km)sum.push(fmtKm(s.km));
    return`<div class="dh"><b>${dl(i)}</b><small>${sum.join(' · ')||'Journée libre'}</small></div>
    <div class="disc-search" style="margin-bottom:12px"><i class="ph ph-bed"></i><input data-hotel="${i}" value="${esc(d.hotel)}" placeholder="Où logez-vous ce soir ?"></div>`+
    (es.map(e=>{
      const mv=`<div class="mv"><button data-mv="${e.it.id}|-1" style="background:transparent;"><i class="ph-bold ph-caret-up"></i></button><button data-mv="${e.it.id}|1" style="background:transparent;"><i class="ph-bold ph-caret-down"></i></button></div>`;
      if(e.k==='note')return`<div class="card"><span style="font-size:24px;color:var(--gold)"><i class="ph-fill ph-note"></i></span><input type="time" value="${e.it.t}" data-time="${e.it.id}" style="width:70px;padding:6px"><div class="nm" data-item="${e.it.id}"><b style="white-space:pre-wrap">${esc(e.it.note)}</b></div>${mv}<button class="btn s ic sm" style="background:transparent" data-item="${e.it.id}"><i class="ph-bold ph-dots-three-vertical"></i></button></div>`;
      return(e.leg?`<div class="leg">${legTxt(e.leg)}</div>`:'')+`<div class="card"><span class="dot" style="background:${COL[e.a.c]};box-shadow:0 0 10px ${COL[e.a.c]};"></span><input type="time" value="${e.it.t}" data-time="${e.it.id}" style="width:70px;padding:6px"><div class="nm" data-open="${e.a.id}"><b>${esc(e.a.n)}</b><small>${I18N[curLang].cat_names[e.a.c]||e.a.c}</small></div>${mv}<button class="btn s ic sm" style="background:transparent" data-item="${e.it.id}"><i class="ph-bold ph-dots-three-vertical"></i></button></div>`}).join('')||`<div class="empty">${t('empty_day')}</div>`)+
    `<div class="row" style="padding:6px 0"><button class="btn s sm" data-day="${i}" data-go><i class="ph ph-map-trifold"></i> Carte</button><button class="btn s sm" data-addnote="${i}"><i class="ph ph-note-pencil"></i> Note</button><button class="btn s sm" data-autofill="${i}"><i class="ph ph-magic-wand"></i> Suggérer</button><button class="btn s sm" data-optim="${i}"><i class="ph ph-arrows-merge"></i> Optimiser</button></div>`}).join('')}

function renderList(){
  const u=used(); const q=listSearchQuery.toLowerCase().trim();
  let filtered=S.acts.filter(a=>!q||a.n.toLowerCase().includes(q));
  const no=filtered.filter(a=>a.lat==null),yes=filtered.filter(a=>a.lat!=null);
  const row=a=>`<div class="card" data-open="${a.id}"><span class="dot" style="background:${COL[a.c]};box-shadow:0 0 8px ${COL[a.c]}"></span><div class="nm"><b>${esc(a.n)}</b><small>${I18N[curLang].cat_names[a.c]||a.c} ${u.has(a.id)?' · ✓':''}</small></div>${a.fav?'<i class="ph-fill ph-heart" style="color:var(--bad)"></i>':''}${a.lat==null?`<button class="btn s ic sm" data-place="${a.id}"><i class="ph ph-map-pin"></i></button>`:''}</div>`;

  $('#list').innerHTML=`<h2>${t('saved_places')}</h2>
  <div class="sp" style="margin-bottom:12px">
    <div class="disc-search" style="flex:1;"><i class="ph ph-magnifying-glass"></i><input id="lq" placeholder="Chercher..." value="${esc(listSearchQuery)}" autocomplete="off"></div>
    <button class="btn g ic" data-newact><i class="ph-bold ph-plus"></i></button>
  </div>`+
  (S.acts.length?
    (filtered.length? `<h3>À placer (${no.length})</h3>${no.map(row).join('')||`<div class="empty">Tout est géolocalisé.</div>`}<h3>Sur la carte (${yes.length})</h3>${yes.map(row).join('')}`:`<div class="empty">Aucun lieu.</div>`)
   :`<div class="empty">Votre carnet est vide.</div>`);

  const inp=$('#lq');if(inp)inp.addEventListener('input',e=>{listSearchQuery=e.target.value;renderList();const r=$('#lq');if(r){r.focus();r.setSelectionRange(r.value.length,r.value.length)}});
}

// Pour Info, AI, Discover, j'intègre les remplacements d'icônes basiques.
function renderInfo(){if(!S)return;
  $('#info').innerHTML=`<h2>${t('nav_trip')}</h2>
  <div class="card"><div class="nm"><b style="font-size:22px">${esc(S.flag)} ${esc(S.name)}</b><small>${rangeLbl(S)} · ${S.n} jours</small><small><i class="ph ph-map-pin"></i> ${esc(S.dest)}</small></div></div>
  <div class="row wrap" style="padding-bottom:16px"><button class="btn s" data-edittrip><i class="ph ph-pencil-simple"></i> Modifier</button><button class="btn" data-trips><i class="ph ph-folder-open"></i> Mes voyages</button></div>
  <h3>Partager & Exporter</h3>
  <div class="row wrap"><button class="btn s" data-share><i class="ph ph-share-network"></i> Partager</button><button class="btn s" data-print><i class="ph ph-printer"></i> Imprimer</button><button class="btn s" data-export="one"><i class="ph ph-download-simple"></i> Exporter</button></div>
  <br><button class="btn r" data-deltrip style="width:100%;"><i class="ph ph-trash"></i> Supprimer définitivement</button>`;}

function renderAI(){
  $('#ai').innerHTML=`<h2><i class="ph-fill ph-sparkle" style="color:var(--accTx); background:var(--acc); border-radius:50%; padding:4px;"></i> Assistant</h2>
  <div class="empty">Connectez une clé API dans les paramètres pour activer cette fonctionnalité.</div>`;
}

function loadDiscover(f){
  $('#discover').innerHTML=`<h2><i class="ph-fill ph-compass" style="color:var(--accTx); background:var(--acc); border-radius:50%; padding:4px;"></i> Explorer</h2>
  <div class="empty">Module d'exploration connecté à Wikipédia & OSM. Recherchez depuis le bouton <i class="ph-bold ph-plus"></i> sur la carte.</div>`;
}

/* ================= Écouteurs globaux ================= */
function tab(tName){tabNow=tName;$('#dock').classList.toggle('hide',tName!=='map');$('#top').style.display=tName==='map'?'':'none';   $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tName));['plan','list','discover','info','ai'].forEach(p=>$('#'+p).classList.toggle('on',p===tName));
  $('#new').style.display=tName==='map'?'flex':'none';$('#unp').style.display=tName==='map'&&S&&unp().length?'block':'none';
  if(!S)return;if(tName==='plan')renderPlan();if(tName==='list')renderList();if(tName==='discover')loadDiscover(true);if(tName==='info')renderInfo();if(tName==='ai')renderAI();
  if(tName==='map')setTimeout(()=>{map.invalidateSize();drawMap()},60)}
function refresh(){if(!S)return;bars();drawMap();if(tabNow==='plan')renderPlan();if(tabNow==='list')renderList();}

document.addEventListener('click',e=>{
  const tEl=e.target.closest('button,[data-open],[data-trip],[data-t]');if(!tEl)return;const d=tEl.dataset;
  if('close' in d){close();return}
  if(d.t){tab(d.t);return}
  if('newtrip' in d||tEl.id==='brand'){sheet(`<h2 style="font-size:24px"><i class="ph-fill ph-airplane-tilt"></i> Voyage</h2><input id="tn" placeholder="Nom du voyage" value="Nouveau Voyage"><button class="btn" style="width:100%" onclick="mut(()=>{DB.trips.push(mkTrip({name:document.getElementById('tn').value||'Voyage',start:toISO(new Date()),n:3}));DB.cur=DB.trips[DB.trips.length-1].id;});window.location.reload()">Créer</button>`);return}
  if('trips' in d){sheet(`<h2>Mes voyages</h2>${DB.trips.map(x=>`<div class="card blk" onclick="DB.cur='${x.id}';window.location.reload()"><b>${x.flag}${x.name}</b></div>`).join('')}`);return}
  if(tEl.id==='new'){addSheet();return}
  if('addlink' in d){editSheet(null,true);return}
  if('addman' in d){editSheet();return}
  if('bulk' in d){toast('Fonction En Lot disponible bientôt');return}
  if(d.spick!==undefined){const[i,m]=d.spick.split('|');addFromSearch(+i,m==='day');return}
  if(d.add){addToDay(d.add);close();return}
  if(d.rmday){mut(()=>{const dd=dayO();dd.items=dd.items.filter(i=>i.aid!==d.rmday)});close();toast('Retiré');return}
  if(d.open){actSheet(d.open);return}
  if(d.edit){editSheet(d.edit);return}
  if(d.save){readForm(d.save);close();return}
  if(d.del){mut(()=>{S.acts=S.acts.filter(a=>a.id!==d.del)});close();toast('Supprimé');return}
  if(d.day!==undefined){day=Math.min(+d.day,S.n-1);bars();drawMap();if('go' in d)tab('map');return}
});

const boot=loadDB();DB=boot.db;S=curTrip();applyTheme();initMap();if(S){bars();tab('map');setTimeout(centerMap,120)}else{tab('info');}
})();
</script></body></html>
