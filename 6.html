<style id="pro-skin">

:root[data-theme=dark]{--bg:#0a0b17;--sf:#141629;--sf2:#1e2140;--tx:#f4f3ff;--mu:#9a9cc4;--ln:rgba(255,255,255,.09);--glass:rgba(16,18,38,.74);

body *{font-family:"Plus Jakarta Sans",ui-rounded,system-ui,sans-serif!important}
:root[data-theme=dark] .leaflet-tile-pane{filter:invert(1) hue-rotate(218deg) brightness(.92) contrast(.92) saturate(.55)}

/* ---------- Icônes ---------- */
.ic{width:1.2em;height:1.2em;flex:none;vertical-align:-.22em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.f{fill:currentColor;stroke-width:1.5}
.ic[data-k=dots]{stroke-width:3.4}
.lbl{display:none}.num{font-weight:800;margin-inline-start:2px}

.btn{border-radius:18px;box-shadow:0 8px 20px var(--glow);transition:transform .18s cubic-bezier(.3,1.5,.5,1),box-shadow .2s;letter-spacing:.1px}
.btn:active{transform:scale(.94)}
.btn.s,.btn.r{box-shadow:none}.btn.s{background:var(--sf2);color:var(--tx)}
.btn.r{background:linear-gradient(135deg,#f03e5f,#ff7a59)}
.btn.sm{min-height:38px;border-radius:14px}
.btn.sm:has(.lbl),.fp:has(.lbl),#flt .chip:has(.lbl){min-width:40px;padding-inline:11px}
.btn.ic{border-radius:14px}
.btn.ic .ic,.btn.sm .ic{width:1.3em;height:1.3em}
.chip,.fp,.sw{box-shadow:var(--shs)}
.chip.on,.fp.on{box-shadow:0 8px 20px var(--glow)}
.fp.on em{background:rgba(255,255,255,.28)}
.fp .ic{width:1.25em;height:1.25em}
#flt .chip{padding:10px 13px}#flt .chip .ic{width:1.35em;height:1.35em}

input,select,textarea{border-radius:16px}

#nav{border-radius:28px;padding:6px;box-shadow:var(--sh)}

#nav #navs button.on span{display:inline}
#nav svg{width:23px;height:23px}
#nav button.on{color:#fff;background:var(--acc);box-shadow:0 8px 20px var(--glow)}
#nav .ib{border-radius:15px;width:38px;height:38px}
#nav .ib .ic,#nav .ib svg{width:20px;height:20px}

/* ---------- Carte, jours, dock ---------- */
#brand{background:var(--glass);font-weight:800;letter-spacing:-.2px}
#brand .ic{color:#a855f7;margin-inline-end:4px}
#filtertoggle{padding:10px 13px}#filtertoggle .ic{width:1.3em;height:1.3em}
#dock{border-radius:32px 32px 0 0;box-shadow:0 -10px 40px rgba(40,20,120,.2)}
.dt{width:56px;height:80px;border-radius:22px}
.dt.on{box-shadow:0 12px 24px var(--glow);transform:translateY(-4px) scale(1.03)}
.dt.on small{color:rgba(255,255,255,.82)}.dt.on i{background:#fff}.dt i{background:linear-gradient(135deg,#ff5fa2,#ff9f1c)}
.tk{border-radius:18px}.tk b .ic{vertical-align:-.25em;margin-inline-end:2px}
.pin{width:42px;height:42px;border:3px solid #fff;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.45),transparent 50%),linear-gradient(145deg,color-mix(in srgb,var(--c) 80%,#fff),var(--c))}

.pin em{background:linear-gradient(135deg,#ff5fa2,#ff9f1c);color:#fff}.pin em .ic{width:11px;height:11px;stroke-width:3.4;vertical-align:-1px}
#new{width:62px;height:62px;border-radius:24px;box-shadow:0 14px 34px var(--glow)}
#new .ic{width:30px;height:30px;stroke-width:2.6;vertical-align:middle}
#new:after{content:"";position:absolute;inset:-6px;border-radius:30px;border:2px solid var(--glow);animation:ring 2.6s ease-out infinite;pointer-events:none}
@keyframes ring{from{transform:scale(.9);opacity:.9}to{transform:scale(1.25);opacity:0}}
#new{position:fixed}
#unp{border-radius:999px;padding-inline:14px}
