<!doctype html><html lang="fr"><head><meta charset="utf-8">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--n0:#0b0f2e;--tx:#f4f2ff;--mu:#9aa1d4;--sun:linear-gradient(135deg,#ff8a5b,#ffc65c);--gold:#ffc65c;--ln:#ffffff1a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;font:16px/1.35 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;color:var(--tx);overflow:hidden;background:var(--n0)}
#map{position:fixed;inset:0;background:#0d1233}.leaflet-tile-pane{filter:invert(1) hue-rotate(195deg) brightness(.92) contrast(.9) saturate(.75)}
.glass{background:rgba(14,18,52,.74);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--ln);box-shadow:0 10px 34px #0008}
#top{position:fixed;left:10px;right:10px;top:calc(70px + env(safe-area-inset-top));z-index:500;display:flex;flex-direction:column;gap:8px}
#brand{align-self:flex-start;max-width:100%;border-radius:999px;padding:9px 16px;font:800 16px ui-rounded,system-ui;color:var(--tx);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#brand small{color:var(--mu);font-weight:600;margin-left:8px;font-size:13px}
.row{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--ln);background:rgba(14,18,52,.74);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:999px;padding:9px 14px;font:600 14px ui-rounded,system-ui;color:var(--tx);transition:transform .15s}
.chip:active{transform:scale(.92)}.chip.on{background:var(--sun);color:#1a1233;border-color:transparent}
.pane .chip,#sheet .chip{background:rgba(255,255,255,.08)}.pane .chip.on,#sheet .chip.on{background:var(--sun)}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:600;border-radius:30px 30px 0 0;padding:12px 0 calc(8px + env(safe-area-inset-bottom))}
#dock.hide{display:none}
#days{display:flex;gap:8px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}#days::-webkit-scrollbar{display:none}
.dt{flex:none;width:54px;height:76px;border-radius:20px;border:1px solid var(--ln);background:rgba(255,255,255,.06);color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;transition:transform .2s;padding:0}
.dt small{font-size:12px;color:var(--mu);font-weight:600}.dt .mo{font-size:10px;text-transform:uppercase;letter-spacing:.3px;font-weight:700}.dt b{font-size:21px;font-weight:800;line-height:1.1}
.dt i{position:absolute;top:5px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.dt.on{background:var(--sun);color:#1a1233;border-color:transparent;transform:translateY(-3px)}.dt.on small{color:#1a1233bb}.dt.on i{background:#1a1233;box-shadow:none}

.tk{flex:none;min-width:150px;max-width:210px;border-radius:16px;padding:9px 12px;background:rgba(255,255,255,.07);border-left:4px solid var(--c,var(--gold))}.tk b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tk small{color:var(--mu);font-size:12px}
.tk.rest{--c:#ffc65c;background:rgba(255,198,92,.13)}.tk.ghost{border:1px dashed var(--ln);color:var(--mu);font-size:14px;min-width:240px;white-space:normal}
#nav{position:fixed;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top));z-index:700;display:flex;align-items:center;gap:2px;padding:5px;border-radius:22px}
#nav button{flex:1;border:0;background:none;border-radius:16px;padding:6px 0 4px;font:700 9.5px ui-rounded,system-ui;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px}
#nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:#1a1233;background:var(--sun)}#nav .ib{flex:none;width:38px;height:38px;padding:0;justify-content:center;color:var(--tx);background:rgba(255,255,255,.08)}#nav .ib:disabled{opacity:.3}#nav .sep{width:1px;height:26px;background:var(--ln);margin:0 4px}
.sw{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--ln);background:rgba(14,18,52,.74);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:999px;padding:6px 12px 6px 8px;font:600 13px ui-rounded,system-ui;color:var(--tx)}
.sw i{width:30px;height:18px;border-radius:9px;background:#ffffff30;position:relative;transition:.2s}.sw i:after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s}
.sw.on i{background:var(--sun)}.sw.on i:after{left:14px}
.bub{max-width:88%;padding:10px 14px;border-radius:18px;margin:8px 0;line-height:1.45;font-size:15px}.bub.a{background:rgba(255,255,255,.09);border:1px solid var(--ln);border-top-left-radius:6px}.bub.u{background:var(--sun);color:#1a1233;font-weight:600;margin-left:auto;border-top-right-radius:6px;width:fit-content}
.mini{border:0;border-radius:12px;padding:7px 12px;margin:4px 4px 0 0;background:var(--sun);color:#1a1233;font:700 13px ui-rounded,system-ui}
.aibar{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 0 6px;background:linear-gradient(0deg,#0b0f2e 75%,transparent)}.aibar input{margin:0;flex:1}details summary{cursor:pointer}
#nlx{position:fixed;right:6px;bottom:calc(4px + env(safe-area-inset-bottom));z-index:1100;width:24px;height:24px;border-radius:50%;border:0;background:#0b0f2ecc;color:#fff;font-size:15px;line-height:22px;padding:0}
.pane{position:fixed;inset:0;z-index:550;background:radial-gradient(120% 60% at 80% 0%,#2a2170 0%,transparent 55%),linear-gradient(180deg,#10154a,#0b0f2e);overflow:auto;padding:calc(84px + env(safe-area-inset-top)) 14px 40px;display:none}.pane.on{display:block}
#welcome{z-index:800;padding-top:calc(20px + env(safe-area-inset-top))}
.hero{text-align:center;padding-top:10vh}.hero h2{font-size:40px;margin-bottom:10px}.hero p{color:var(--mu);max-width:340px;margin:0 auto 24px}.hero .btn{margin:5px}
h2{font-size:32px;font-weight:800;letter-spacing:-1px;margin:4px 0 14px}h3{margin:20px 0 8px;font-size:14px;color:var(--mu);font-weight:700}
.card{background:rgba(255,255,255,.07);border:1px solid var(--ln);border-radius:20px;padding:12px;margin-bottom:10px;display:flex;gap:11px;align-items:center}
.card .nm{flex:1;min-width:0}.card small{display:block;color:var(--mu);font-size:13px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.btn{border:0;border-radius:16px;padding:12px 17px;font:700 15px ui-rounded,system-ui;background:var(--sun);color:#1a1233;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.btn.s{background:rgba(255,255,255,.1);color:var(--tx)}.btn.g{background:var(--sun);color:#1a1233}.btn.r{background:#e5484d;color:#fff}
input,select,textarea{width:100%;padding:13px;border:1px solid var(--ln);border-radius:14px;font:16px ui-rounded,system-ui;margin:4px 0 10px;background:rgba(255,255,255,.08);color:var(--tx)}
input::placeholder,textarea::placeholder{color:#8087bd}select option{color:#000}
input[type=time]{width:auto;margin:0;padding:8px;border-radius:10px}
.lb{display:block;font-size:13px;color:var(--mu);margin:8px 0 0;font-weight:600}.gst{font-size:13px;color:var(--gold);min-height:18px;margin:-4px 0 8px;word-break:break-word}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pin{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#ffffff55,transparent 45%),var(--c);border:3px solid #fff;box-shadow:0 6px 16px #000a,0 0 0 5px color-mix(in srgb,var(--c) 35%,transparent);display:flex;align-items:center;justify-content:center;position:relative}.pin b{font-size:18px;font-weight:400}
.pin em{position:absolute;top:-9px;right:-9px;background:var(--gold);color:#1a1233;border-radius:10px;min-width:21px;height:21px;font:800 12px/17px ui-rounded,system-ui;text-align:center;font-style:normal;border:2px solid #fff}
#unp{position:fixed;left:14px;bottom:calc(205px + env(safe-area-inset-bottom));z-index:520;border-radius:999px;box-shadow:0 10px 24px #000a}
#new{position:fixed;right:14px;bottom:calc(205px + env(safe-area-inset-bottom));z-index:520;border-radius:50%;width:56px;height:56px;padding:0;justify-content:center;font-size:28px;box-shadow:0 10px 24px #000a}
#sheet{position:fixed;inset:0;z-index:900;background:#04061a99;display:none;align-items:flex-end}#sheet.on{display:flex}
#sheet>div{background:linear-gradient(180deg,#1a2060,#10154a);border-top:1px solid var(--ln);width:100%;border-radius:30px 30px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:90%;overflow:auto;animation:up .28s cubic-bezier(.2,.9,.2,1)}
#sheet>div:before{content:"";display:block;width:42px;height:5px;border-radius:3px;background:#ffffff33;margin:0 auto 14px}
@keyframes up{from{transform:translateY(70px);opacity:0}}
#toast{position:fixed;top:calc(200px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--sun);color:#1a1233;font-weight:700;padding:10px 18px;border-radius:999px;z-index:1200;opacity:0;transition:.3s;pointer-events:none;font-size:14px;max-width:90%;text-align:center}#toast.on{opacity:1}
.stars button{border:0;background:none;font-size:30px;padding:2px;color:#ffffff30}.stars .on{color:var(--gold)}
.note{background:rgba(255,198,92,.1);border:1px solid rgba(255,198,92,.25);border-radius:18px;padding:14px;margin-bottom:10px;cursor:pointer}.note a{color:var(--gold)}.empty{color:var(--mu);padding:8px 2px}
.near{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--ln);cursor:pointer}.near small{color:var(--mu);display:block}.near.cur b{color:var(--gold)}
.leaflet-control-attribution{font-size:9px!important;background:#0b0f2e99!important;color:#9aa1d4!important}.leaflet-control-attribution a{color:#cbd0ff!important}
</style></head><body>
<div id="map"></div>
<div id="top"><button id="brand" class="glass"></button><div class="row" id="flt"></div><div class="row" id="tg"></div></div>
<button class="btn" id="new" aria-label="Nouveau lieu">＋</button><button class="btn s glass" id="unp" style="display:none"></button>
<div class="pane" id="plan"></div><div class="pane" id="list"></div><div class="pane" id="info"></div><div class="pane" id="ai"></div>

<div id="nav" class="glass"><button data-t="map" class="on"><svg viewBox="0 0 24 24"><path d="M9 4 3 6.5V20l6-2.5 6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg>Carte</button><button data-t="plan"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>Planning</button><button data-t="list"><svg viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>Lieux</button><button data-t="info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.8v.2"/></svg>Voyage</button><button data-t="ai"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16v4M17 18h4"/></svg>Assistant</button><span class="sep"></span><button class="ib" id="undo" aria-label="Annuler"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button><button class="ib" id="redo" aria-label="Rétablir"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button></div>
<div class="pane" id="welcome"><div class="hero"><h2>🌍 Trip Planner</h2><p>Planifie n’importe quel voyage sur une carte : tes lieux, tes journées, tes filtres. Chaque destination démarre vierge.</p><button class="btn g" data-newtrip>Créer mon premier voyage</button><label class="btn s">Importer une sauvegarde<input type="file" data-imp accept="application/json" hidden></label></div></div>
<button id="nlx" aria-label="Fermer">×</button><div id="sheet"></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(()=>{'use strict';
/* ================= Constantes & utilitaires ================= */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const K='tripkit_v1',KL='egmap26d',MAXD=60;
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rich=s=>esc(s).replace(/\n/g,'<br>').replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
const SL={m:['Matin','09:30'],a:['Après-midi','15:00'],s:['Coucher de soleil','17:45'],e:['Soirée','20:30']};
const CT={v:'Visite',a:'Activité',f:'Food',n:'Night show'},COL={v:'#19c3d3',a:'#ff7a59',f:'#a78bfa',n:'#ff5fa2'},EM={v:'🏛',a:'⚡',f:'🍽',n:'🎭'},SE={m:'🌅',a:'☀️',s:'🌇',e:'🌙'};
const DN=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'],MN=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const tm=t=>{const[a,b]=t.split(':');return+a*60+ +b},mt=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const pISO=s=>{const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const toISO=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const fmtD=d=>d.getDate()+' '+MN[d.getMonth()];
const rangeLbl=t=>{const a=pISO(t.start);if(!a)return'';const b=addDays(a,t.n-1);return fmtD(a)+' – '+fmtD(b)+' '+b.getFullYear()};

/* ================= Modèle de données ================= */
const X=(n,c='v',s='',o={})=>Object.assign({id:uid(),n,c,s:Array.isArray(s)?s:String(s).split('').filter(Boolean),lat:null,lng:null,area:null,price:null,hrs:null,note:null,src:'Saisie manuelle',maps:null,rate:0,fav:false,d:90,tags:[]},o);
const mkCal=(name,n)=>({id:uid(),name,days:Array.from({length:n},()=>({hotel:'',items:[]}))});
function mkTrip(o){const t={id:o.id||uid(),name:o.name,flag:o.flag||'🌍',dest:o.dest||o.name,start:o.start,n:o.n,center:o.center||null,zoom:o.zoom||11,acts:[],cals:[],cur:'',notes:[]};const c=mkCal('Planning principal',t.n);t.cals.push(c);t.cur=c.id;return t}
function norm(t){ /* valide/répare un voyage (chargement, import, migration) */
  if(!t||typeof t!=='object')return null;
  t.id=t.id||uid();t.name=String(t.name||'Voyage');t.flag=t.flag||'🌍';t.dest=t.dest||t.name;
  if(!pISO(t.start))t.start=toISO(new Date());
  t.acts=Array.isArray(t.acts)?t.acts.filter(a=>a&&typeof a==='object'):[];t.notes=Array.isArray(t.notes)?t.notes.filter(n=>n&&typeof n==='object'):[];
  t.cals=Array.isArray(t.cals)?t.cals.filter(c=>c&&typeof c==='object'):[];
  let n=Math.round(+t.n);if(!(n>=1))n=Math.max(1,...t.cals.map(c=>Array.isArray(c.days)?c.days.length:0));t.n=Math.min(MAXD,n);
  if(!(Array.isArray(t.center)&&t.center.length===2&&t.center.every(Number.isFinite)))t.center=null;t.zoom=+t.zoom||11;
  t.acts.forEach(a=>{a.id=a.id||uid();a.n=String(a.n||'Lieu');if(!Array.isArray(a.s))a.s=typeof a.s==='string'?a.s.split(''):[];if(!Array.isArray(a.tags))a.tags=[];if(!CT[a.c])a.c='a';
    if(a.lat!=null&&!(Number.isFinite(+a.lat)&&Number.isFinite(+a.lng))){a.lat=null;a.lng=null}else if(a.lat!=null){a.lat=+a.lat;a.lng=+a.lng}else{a.lat=null;a.lng=null}a.rate=+a.rate||0;a.src=a.src||'Saisie manuelle'});
  t.notes.forEach(x=>{x.id=x.id||uid();x.t=String(x.t||'');x.b=String(x.b||'')});
  if(!t.cals.length)t.cals.push(mkCal('Planning principal',t.n));
  t.cals.forEach(c=>{c.id=c.id||uid();c.name=String(c.name||'Planning');c.days=Array.isArray(c.days)?c.days:[];
    while(c.days.length<t.n)c.days.push({hotel:'',items:[]});c.days=c.days.slice(0,t.n);
    c.days.forEach(d=>{d.hotel=String(d.hotel||'');d.items=(Array.isArray(d.items)?d.items:[]).filter(i=>i&&typeof i==='object').map(i=>{i.id=i.id||uid();if(!/^\d\d:\d\d$/.test(i.t||''))i.t='09:00';return i})})});
  if(!t.cals.some(c=>c.id===t.cur))t.cur=t.cals[0].id;
  return t}
/* anciennes sauvegardes (une seule destination, sans voyages) */
function fromLegacy(j,o){return norm(Object.assign({id:uid(),name:'Voyage importé',flag:'🌍',zoom:11,notes:[]},o,{acts:j.acts,cals:j.cals,cur:j.cur}))}
const EG_NOTES=[ /* uniquement pour la migration des données Égypte de l'ancienne version */
 {t:'Facture restaurant',b:'Si ajouts ou taxes inhabituels : demander une facture fiscale détaillée. Sans facture fiscale, ne pas payer la taxe. En cas de souci, filmer et mentionner @moiegy sur Instagram (infos reçues, à vérifier).\nاطلب فاتورة ضريبية'},
 {t:'Réclamation (à vérifier avant usage officiel)',b:'Ligne : 16528\nWhatsApp : 01555516528 / 01555525444\nInstagram : @moiegy\n1. Demander le détail de la facture\n2. Garder les justificatifs\n3. Demander un responsable\n4. Contacter l’organisme compétent'},
 {t:'Réservations',b:'Utiliser un compte Booking égyptien. Rabbit : code RABBIT-GL3. Safari pyramides : 900 EGP/pers. (à vérifier).'}];

/* ================= Stockage ================= */
function loadDB(){
  let raw=null;try{raw=localStorage.getItem(K)}catch(e){}
  if(raw){try{const j=JSON.parse(raw);if(j&&Array.isArray(j.trips)){j.trips=j.trips.map(norm).filter(Boolean);if(!j.trips.some(t=>t.id===j.cur))j.cur=j.trips[0]?j.trips[0].id:'';return{db:j}}}
    catch(e){try{localStorage.setItem(K+'_corrupt',raw)}catch(_){}}}
  try{const r=localStorage.getItem(KL); /* migration de l'ancienne app Égypte */
    if(r){const j=JSON.parse(r);if(j&&Array.isArray(j.acts)&&Array.isArray(j.cals)&&j.cals.length){
      const t=fromLegacy(j,{id:'egypt-2026',name:'Égypte 2026',flag:'🇪🇬',dest:'Le Caire, Égypte',start:'2026-12-01',n:8,center:[30.04,31.24],zoom:11,notes:EG_NOTES.map(n=>({id:uid(),...n}))});
      return{db:{v:2,trips:[t],cur:t.id},migrated:true}}}}catch(e){console.error(e)}
  return{db:{v:2,trips:[],cur:''}}}
let DB,S=null,undo=[],redo=[],day=0,fs=new Set(),fc=new Set(),hideO=false,hideU=false,placing=null,map,layer,PTS=[],tabNow='map',AIM=[],aiBusy=false,GR=[],bulkBusy=false,saveT;
const curTrip=()=>DB.trips.find(t=>t.id===DB.cur)||null;
const cal=()=>S.cals.find(c=>c.id===S.cur)||S.cals[0],get=id=>S.acts.find(a=>a.id===id),dayO=()=>{const c=cal();return c.days[Math.min(day,c.days.length-1)]};
const dayDate=i=>addDays(pISO(S.start)||new Date(),i),dl=i=>{const d=dayDate(i);return DN[d.getDay()]+' '+d.getDate()+' '+MN[d.getMonth()]};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400)}
function save(){try{localStorage.setItem(K,JSON.stringify(DB))}catch(e){toast('Sauvegarde impossible : exporte tes données')}}
const snap=()=>JSON.stringify(S);
function restore(js){const t=norm(JSON.parse(js)),i=DB.trips.findIndex(x=>x.id===t.id);if(i>=0){DB.trips[i]=t;S=t}}
function mut(fn){undo.push(snap());if(undo.length>25)undo.shift();redo=[];fn();save();refresh()}

const ok=a=>(!fs.size||a.s.some(x=>fs.has(x)))&&(!fc.size||fc.has(a.c));
const vis=a=>{if(!ok(a))return false;const inD=dayO().items.some(i=>i.aid===a.id);if(hideO&&!inD&&used().has(a.id))return false;if(hideU&&!inD)return false;return true};

/* ================= Géo : coordonnées depuis un lien Google Maps ================= */
const okLL=(la,lo)=>Number.isFinite(la)&&Number.isFinite(lo)&&Math.abs(la)<=90&&Math.abs(lo)<=180&&!(la===0&&lo===0);
const RXS=[/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,/@(-?\d+\.\d+),(-?\d+\.\d+)/,/[?&](?:q|ll|query|destination|daddr|center|sll)=(-?\d+\.\d+)[,+ ]+(-?\d+\.\d+)/,/\/place\/(-?\d+\.\d+),(-?\d+\.\d+)/,/#map=\d+\/(-?\d+\.\d+)\/(-?\d+\.\d+)/,/mlat=(-?\d+\.\d+)&(?:amp;)?mlon=(-?\d+\.\d+)/];
function parseGPS(txt){
  const t=String(txt||'').trim();if(!t)return null;const c=[t];try{const d=decodeURIComponent(t);if(d!==t)c.push(d)}catch(e){}
  for(const s of c)for(const r of RXS){const m=r.exec(s);if(m&&okLL(+m[1],+m[2]))return[+m[1],+m[2]]}
  if(!/:\/\//.test(t)){
    let m=/^(-?\d+(?:\.\d+)?)\s*°?\s*([NSns])?\s*[,;\s]\s*(-?\d+(?:\.\d+)?)\s*°?\s*([EWew])?$/.exec(t);
    if(m){let la=+m[1],lo=+m[3];if(/s/i.test(m[2]||''))la=-Math.abs(la);if(/w/i.test(m[4]||''))lo=-Math.abs(lo);if(okLL(la,lo))return[la,lo]}
    m=/^(-?\d+,\d+)\s*[;\s]\s*(-?\d+,\d+)$/.exec(t);if(m){const la=+m[1].replace(',','.'),lo=+m[2].replace(',','.');if(okLL(la,lo))return[la,lo]}}
  return null}
function nameFromUrl(u){let m=/\/maps\/place\/([^/@?]+)/.exec(u)||/[?&]q=([^&]+)/.exec(u);if(!m)return'';let n=m[1].replace(/\+/g,' ');try{n=decodeURIComponent(n)}catch(e){}n=n.trim();return parseGPS(n)?'':n}
const isShort=u=>/(maps\.app\.goo\.gl|goo\.gl\/maps|g\.co\/kgs|share\.google)/i.test(u);
const isMapsUrl=u=>/^https?:\/\/([a-z0-9-]+\.)*(google\.[a-z.]+\/maps|google\.[a-z.]+\/search|maps\.google\.[a-z.]+|maps\.app\.goo\.gl|goo\.gl\/maps|g\.co\/kgs|share\.google)/i.test(u);
const decEnt=s=>{const e=document.createElement('textarea');e.innerHTML=s;return e.value};
function fromHtml(h){ /* coordonnées + nom dans la page renvoyée par un relais */
  if(!h)return null;
  for(const p of [/center=(-?\d+\.\d+)(?:%2C|,)(-?\d+\.\d+)/,/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/,/@(-?\d+\.\d+),(-?\d+\.\d+)/,/\[null,null,(-?\d+\.\d+),(-?\d+\.\d+)\]/]){
    const m=p.exec(h);if(m&&okLL(+m[1],+m[2])){const tt=/<meta[^>]+property="og:title"[^>]+content="([^"]+)"/i.exec(h)||/<title>([^<]+)<\/title>/i.exec(h);
      let name=tt?decEnt(tt[1]).replace(/\s*[-–·|]\s*Google Maps.*$/i,'').trim():'';if(/^google maps$/i.test(name))name='';return{lat:+m[1],lng:+m[2],name}}}
  return null}
async function fetchT(u,ms=9000){const c=new AbortController(),id=setTimeout(()=>c.abort(),ms);try{return await fetch(u,{signal:c.signal})}finally{clearTimeout(id)}}
async function expand(u){ /* lien court : best-effort via relais publics (le navigateur ne peut pas suivre la redirection seul) */
  const tries=[async()=>{const r=await fetchT('https://api.allorigins.win/get?url='+encodeURIComponent(u));const j=await r.json();return{fin:(j.status&&j.status.url)||'',html:j.contents||''}},
               async()=>{const r=await fetchT('https://corsproxy.io/?url='+encodeURIComponent(u));return{fin:r.url||'',html:await r.text()}}];
  let name='';
  for(const f of tries){try{const o=await f(),g=parseGPS(o.fin),nm=nameFromUrl(o.fin);if(g)return{lat:g[0],lng:g[1],name:nm};const h=fromHtml(o.html);if(h)return{...h,name:h.name||nm};if(nm)name=name||nm}catch(e){}}
  return name?{name}:null}
async function geocode(q,lim=5,bias=true){ /* Nominatim (OpenStreetMap), gratuit */
  const b=bias&&S&&S.center?`&viewbox=${S.center[1]-.7},${S.center[0]+.7},${S.center[1]+.7},${S.center[0]-.7}`:'';
  const r=await fetchT('https://nominatim.openstreetmap.org/search?format=jsonv2&limit='+lim+'&accept-language=fr'+b+'&q='+encodeURIComponent(q));
  if(!r.ok)throw Error('recherche indisponible');const j=await r.json();
  return j.map(x=>({lat:+(+x.lat).toFixed(6),lng:+(+x.lon).toFixed(6),short:x.name||String(x.display_name||'').split(',')[0],name:x.display_name||''}))}
async function resolveLink(input){
  const raw=String(input||'').trim();if(!raw)throw Error('Colle un lien Google Maps ou « lat, lng ».');
  const g0=parseGPS(raw);if(g0)return{lat:g0[0],lng:g0[1],name:nameFromUrl(raw),how:'lien'};
  const u=(raw.match(/https?:\/\/\S+/)||[])[0];if(!u)throw Error('Format non reconnu : colle un lien Google Maps ou « lat, lng ».');
  let name=nameFromUrl(u);
  if(isMapsUrl(u)&&(isShort(u)||!name)){const r=await expand(u);if(r){if(r.lat!=null)return{lat:r.lat,lng:r.lng,name:r.name||name,how:'lien court'};if(r.name)name=r.name}}
  if(name){try{const rs=await geocode(name,1);if(rs[0])return{lat:rs[0].lat,lng:rs[0].lng,name,how:'nom du lieu, à vérifier'}}catch(e){}}
  throw Error(isShort(u)?'Lien court illisible depuis le navigateur. Ouvre-le dans Maps puis copie le lien long ou les coordonnées, ou utilise « Chercher par nom ».':'Aucune coordonnée trouvée dans ce lien.')}
function hav(a,b){if(!a||!b||a.lat==null||b.lat==null)return null;const r=x=>x*Math.PI/180,p=r(b.lat-a.lat),q=r(b.lng-a.lng),h=Math.sin(p/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(q/2)**2;return 12742*Math.asin(Math.sqrt(h))}

function renderTL(){const d=dayO(),its=[...d.items].sort((a,b)=>a.t.localeCompare(b.t));
  $('#tl').innerHTML=its.length?its.map(it=>{if(it.rest)return`<div class="tk rest"><small>${it.t}</small><b>🛏 Repos hôtel</b><small>jusqu’à ${it.to}</small></div>`;const a=get(it.aid);return a?`<div class="tk" data-open="${a.id}" style="--c:${COL[a.c]}"><small>${it.t}</small><b>${EM[a.c]} ${esc(a.n)}</b><small>${a.rate?'★'.repeat(a.rate):CT[a.c]}</small></div>`:''}).join('')
  :`<div class="tk ghost">${S.acts.length?'Touche un lieu sur la carte pour remplir '+dl(day):'Commence par ＋ : colle un lien Google Maps, la position se remplit toute seule.'}</div>`}
function initMap(){map=L.map('map',{zoomControl:false}).setView([20,0],2);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);layer=L.layerGroup().addTo(map);
  map.on('click',e=>{if(!placing||!S)return;const a=get(placing);if(!a){placing=null;return}mut(()=>{a.lat=+e.latlng.lat.toFixed(6);a.lng=+e.latlng.lng.toFixed(6)});placing=null;toast('📍 Position enregistrée');afterPos()})}
function drawMap(){if(!layer||!S)return;layer.clearLayers();PTS=[];const u=used(),route=[];
  dayO().items.sort((a,b)=>a.t.localeCompare(b.t));
  S.acts.filter(a=>a.lat!=null&&vis(a)).forEach(a=>{const n=dayO().items.filter(i=>i.aid).findIndex(i=>i.aid===a.id)+1,other=u.has(a.id)&&!n;
    L.marker([a.lat,a.lng],{icon:L.divIcon({className:'',iconSize:[40,40],iconAnchor:[20,20],html:`<div class="pin" style="--c:${COL[a.c]};opacity:${other?.45:1}"><b>${EM[a.c]}</b>${n?`<em>${n}</em>`:other?'<em>✓</em>':''}</div>`})}).addTo(layer).on('click',()=>actSheet(a.id));PTS.push([a.lat,a.lng])});
  dayO().items.filter(i=>i.aid).forEach(i=>{const a=get(i.aid);if(a&&a.lat!=null)route.push([a.lat,a.lng])});
  if(route.length>1)L.polyline(route,{color:'#e9b44c',weight:4,dashArray:'2 9',lineCap:'round'}).addTo(layer)}
const fit=()=>{if(map&&PTS.length)map.fitBounds(PTS,{padding:[60,60],maxZoom:14})};
function centerMap(){if(!map||!S)return;map.invalidateSize();drawMap();if(PTS.length)fit();else if(S.center)map.setView(S.center,S.zoom||11);else map.setView([20,0],2)}
function afterPos(){if(S.acts.filter(a=>a.lat!=null).length<=1)setTimeout(()=>{drawMap();fit()},60)}

async function cloudAI(){const acts=S.acts.map(a=>({id:a.id,n:a.n,c:CT[a.c],s:a.s.join(''),lat:a.lat,lng:a.lng,prix:a.price,h:a.hrs,min:a.d}));const days=cal().days.map((d,i)=>({jour:i+1,date:dl(i),hotel:d.hotel,items:d.items.map(x=>x.rest?{repos:x.t}:{id:x.aid,t:x.t})}));

document.addEventListener('click',e=>{try{onClick(e)}catch(err){console.error(err);toast('Erreur : '+err.message)}});
function onClick(e){
  if(e.target.closest('a'))return;
  const t=e.target.closest('button,[data-open],[data-geopick],[data-trip],[data-note],#sheet');if(!t)return;const d=t.dataset;
  if(t.id==='sheet'){if(e.target===t)close();return}
  if(t.id==='nlx'){$$('.nl-wrap').forEach(n=>n.remove());t.remove();return}
  if(t.id==='new'){if(!S)return;editSheet();return}
  if(t.id==='brand'){tripsSheet();return}
  if(t.id==='unp'){sheet(`<h2 style="font-size:20px;margin-top:0">Sans position</h2><p class="empty">Touche un lieu pour lui donner une position (lien Maps, GPS ou placement sur la carte).</p>${unp().map(a=>`<div class="near" data-open="${a.id}"><div><b>${esc(a.n)}</b><small>${CT[a.c]} · ${a.s.map(x=>SL[x]?SL[x][0]:'').join(', ')}</small></div><span>›</span></div>`).join('')}`);return}
  if(t.id==='undo'){if(undo.length){redo.push(snap());restore(undo.pop());save();refresh()}return}
  if(t.id==='redo'){if(redo.length){undo.push(snap());restore(redo.pop());save();refresh()}return}
  if(d.t){tab(d.t);return}
  if('close' in d){close();return}
  if('newtrip' in d){tripForm();return}
  if('trips' in d){tripsSheet();return}
  if(d.trip){if(d.trip!==DB.cur)setTrip(d.trip);close();return}
  if(d.savetrip!==undefined){saveTrip(d.savetrip);return}
  if(!S)return;
  if('edittrip' in d){tripForm(S.id);return}
  if('deltrip' in d){deleteTrip();return}
  if(d.note!==undefined){noteSheet(d.note);return}
  if(d.savenote!==undefined){const ti=$('#nt').value.trim(),b=$('#nb').value.trim();if(!ti&&!b){toast('Note vide');return}const id=d.savenote;mut(()=>{if(id){const n=S.notes.find(x=>x.id===id);if(n){n.t=ti;n.b=b}}else S.notes.push({id:uid(),t:ti,b})});close();return}
  if(d.delnote){if(confirm('Supprimer cette note ?')){mut(()=>{S.notes=S.notes.filter(x=>x.id!==d.delnote)});close()}return}
  if('resolve' in d){doResolve();return}
  if('geo' in d){doGeo();return}
  if(d.geopick!==undefined){pickGeo(d.geopick);return}
  if('bulk' in d){bulkSheet();return}
  if('bulkgo' in d){bulkGo();return}
  if(d.day!==undefined){day=Math.min(+d.day,S.n-1);bars();drawMap();if('go' in d)tab('map');return}
  if(d.send!==undefined){aiSend($('#aiq').value);return}
  if(d.ask){aiSend(d.ask);return}
  if(d.aiadd){const[i,n]=d.aiadd.split('|');addAt(i,+n);toast('Ajouté à '+dl(+n));addMsg({r:'a',h:'✓ '+esc(get(i).n)+' ajouté à '+dl(+n)});return}
  if(d.aiapply){const m=AIM[+d.aiapply];const c=applyOps(m.ops||[]);m.ops=[];toast(c+' modification(s) appliquée(s)');renderAI();return}
  if('aisave' in d){try{localStorage.setItem(K+'_ai',$('#aik').value.trim())}catch(e){}toast('Mode IA '+(aiKey()?'activé':'désactivé'));renderAI();return}
  if('aiclear' in d){try{localStorage.removeItem(K+'_ai');localStorage.removeItem(KL+'_ai')}catch(e){}renderAI();toast('Clé retirée');return}
  if(d.tg){if(d.tg==='o')hideO=!hideO;else hideU=!hideU;bars();drawMap();return}
  if(d.s){fs.has(d.s)?fs.delete(d.s):fs.add(d.s);bars();drawMap();fit();return}
  if(d.c){fc.has(d.c)?fc.delete(d.c):fc.add(d.c);bars();drawMap();fit();return}
  if(d.rmday){mut(()=>{const dd=dayO();dd.items=dd.items.filter(i=>i.aid!==d.rmday)});close();toast('Retiré de '+dl(day));return}
  if(d.add){addToDay(d.add);const a=get(d.add);if(a&&a.lat!=null)nearSheet(d.add);else close();return}
  if(d.add2){addToDay(d.add2);nearSheet(d.add2);return}
  if(d.open){actSheet(d.open);return}
  if(d.edit){editSheet(d.edit);return}
  if('newact' in d){editSheet();return}
  if(d.rate){const[i,n]=d.rate.split('|');mut(()=>{get(i).rate=get(i).rate==+n?0:+n});actSheet(i);return}
  if(d.fav){mut(()=>{get(d.fav).fav=!get(d.fav).fav});actSheet(d.fav);return}
  if(d.save!==undefined){const r=readForm(d.save);if(r){close();toast('Enregistré')}return}
  if(d.place!==undefined){let id=d.place;if($('#en')){const r=readForm(id||'');if(!r)return;id=r.id}placing=id;close();tab('map');toast('Touche la carte pour placer le lieu');return}
  if(d.del){if(confirm('Supprimer ce lieu ?')){mut(()=>{S.acts=S.acts.filter(a=>a.id!==d.del);S.cals.forEach(c=>c.days.forEach(x=>x.items=x.items.filter(i=>i.aid!==d.del)))});close()}return}
  if(d.rm){mut(()=>cal().days.forEach(x=>x.items=x.items.filter(i=>i.id!==d.rm)));return}
  if(d.restadd){mut(()=>cal().days[+d.restadd].items.push({id:uid(),rest:1,t:'17:00',to:'19:30'}));return}
  if(d.cal){S.cur=d.cal;day=Math.min(day,S.n-1);save();refresh();return}
  if('newcal' in d){const n=prompt('Nom du calendrier ?');if(n&&n.trim())mut(()=>{const c=mkCal(n.trim(),S.n);S.cals.push(c);S.cur=c.id});return}
  if('ren' in d){const n=prompt('Nouveau nom',cal().name);if(n&&n.trim())mut(()=>{cal().name=n.trim()});return}
  if('dup' in d){mut(()=>{const c=JSON.parse(JSON.stringify(cal()));c.id=uid();c.name+=' (copie)';c.days.forEach(x=>x.items.forEach(i=>i.id=uid()));S.cals.push(c);S.cur=c.id});return}
  if('delcal' in d){if(S.cals.length<2){toast('Garde au moins un calendrier');return}if(confirm('Supprimer ce calendrier ?'))mut(()=>{S.cals=S.cals.filter(c=>c.id!==S.cur);S.cur=S.cals[0].id});return}
  if(d.export){doExport(d.export==='all');return}}
document.addEventListener('keydown',e=>{if(e.target.id==='aiq'&&e.key==='Enter'){e.preventDefault();aiSend(e.target.value)}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
  if(d.time&&S){mut(()=>cal().days.forEach(x=>x.items.forEach(i=>{if(i.id===d.time&&t.value)i.t=t.value})))}
  else if(d.hotel!==undefined&&S){mut(()=>{cal().days[+d.hotel].hotel=t.value})}
  else if('imp' in d&&t.files[0]){doImport(t.files[0]);t.value=''}});
let rt;document.addEventListener('input',e=>{if(e.target.id!=='ema')return;clearTimeout(rt);const v=e.target.value.trim();if(/^https?:\/\//i.test(v)||parseGPS(v))rt=setTimeout(doResolve,450)});
window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});

/* ================= Démarrage ================= */
const boot=loadDB();DB=boot.db;S=curTrip();AIM=aiWelcome();
try{localStorage.setItem(K+'_t','1');localStorage.removeItem(K+'_t')}catch(e){setTimeout(()=>toast('⚠ Stockage du navigateur bloqué : exporte régulièrement ta sauvegarde'),800)}
initMap();show();
if(boot.migrated){save();setTimeout(()=>toast('✓ Données de l’ancienne version importées : Égypte 2026'),700)}
if(!S)setTimeout(tripForm,300);
window.__tp={get DB(){return DB},get S(){return S},parseGPS,fromHtml,nameFromUrl,norm,resolveLink};
})();
</script></body></html>
